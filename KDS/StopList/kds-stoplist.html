<title>КДС · Стоп-лист — прототип на ДС</title>
<!--
  ПРОТОТИП «КДС · Стоп-лист» — стоп-лист и остатки на кухонном экране WebKDS.
  ОТКУДА ЧТО ВЗЯТО:
    • постановка — Jira PB-8111 «Дизайн: стоп-лист и остатки на кухонном экране WebKDS»
      (рабочее ТЗ — KDS/StopList/pb8111-stoplist-tz.md; полный текст сценариев
      PB-8102-user-scenarios.md — Приложение A в нём же);
    • БАЗА — KDS/Combo/kds-combo.html (состояние base) 1:1: экран повара WebKDS v. 9.4.5
      по Figma «Web KDS Экраны» (файл 05VEoPOZuAVHLfYI6yqVjz, узел 10497:3361), каркас
      render()/mkView(), SCREENS, палитра .kds-view, панель ревью connect.js + layouts.js,
      переключение — событие dsreview:state и ?state=. Меняется в базе только одно —
      кнопка «Стоп-лист» в шапке (block + текст, иконка — кандидат, не утверждена;
      позиция — перед иконками показателей/счётчиками, по указанию заказчика 23.10.2026);
    • каркас страницы — подключение одной строкой: `../../Design-System/connect.js` с флагами
      data-no-header data-no-sidenav (это экран кухни); панель ревью и селект «Экраны» приходят
      сами (ds-review.js из connect.js), реестр — layouts.js рядом;
    • стили — только палитра базы (CSS-переменные --kds-*), шрифт Roboto, иконки
      Material Icons Outlined; новых цветов нет; у новых строк/панелей — ровно стиль
      строк-коробок базы (#212121, радиус 8), новых подложек/фонов/теней нет;
    • тач-требования и готовые элементы — §5.12 ТЗ: кнопки из базы (обводка 48 r12
      uppercase; «Печать» в шапке — обводка той же геометрии), поля-коробки 52 (#212121 r8), цель ≥ 44, фокус
      выделяет значение, реакция :active, баннеры без обязательного тапа;
    • демо-контента нет — только собственные экраны прототипа (правило 16.10.2026).

  ЭКРАНЫ — ЧТО ПРОИСХОДИТ (реестр layouts.js, 19 состояний = 19 ключей SCREENS):
    1. base-noaccess — та же база без кнопки входа (опция выкл / нет права / смена выкл)
    2. base — база 1:1 из kds-combo + кнопка «Стоп-лист» в шапке перед счётчиками (block + текст)
    3. list-empty — «Стоп-лист пуст»: «Ограничений нет» + акцентная кнопка «Добавить позицию»
       (сюда ведёт кнопка «Стоп-лист» на базе)
    4. add-fail — «Добавить в стоп-лист»: часть позиций исключена из меню, блок ввода заблокирован
    5. add-multi — то же наполнение + массовый выбор с чекбоксами
    6. list — стоп-лист после внесения: поиск, «Выбрать все», «Печать» (в шапке), «Добавить позицию»;
       позиции сгруппированы по категориям; у «Маргариты» размеры 25/30/35 см (сворачиваются ▾);
       футер «В стоп-листе: N блюд (M позиций)» · «Очистить стоп-лист»
    7. excluded — «Суп дня — 3 порции» с подписью «Исключена из меню», снять можно
    8. item-nodata — у «Тирамису» подпись «Нет данных об остатке» вместо плашки
    9. item-edit — правка остатка прямо в строке: поле с числом в фокусе
   10. item-sizes — правка размера «25 см» в его строке; размеры — отдельные строки
   11. item-sizes-by — размер «30 см» в фокусе; размеры независимы
   12. item-invalid — некорректный остаток: красная подпись под строкой
   13. multi-head — выбор позиций, действия в шапке (вариант A)
   14. multi-lock — выбор позиций, плашка внизу, остальное неактивно (вариант B)
   15. multi-partial — результат «Снято ограничений: 2 · пропущено: 1 (без ограничения)»
   16. clear-confirm — «Очистить стоп-лист?» с обязательным подтверждением
   17. shift-off — экран заказов + нейтральный баннер «Стоп-лист закрыт…», авто-скрытие 3 с
   18. icons — постер пиктограмм (все — кандидаты, ни одна не утверждена)
   19. rationale — постер «Обоснование решений» (6 решений из §5.10)

  ПЕРЕКЛЮЧЕНИЕ ЭКРАНОВ:
    • селект «Экраны» в плашке ревью (событие dsreview:state) и прямая ссылка ?state=<id>;
    • живые переходы в контенте (по указанию заказчика 23.10.2026): кнопка «Стоп-лист»
      в шапке базы открывает список; «К заказам» (видимая кнопка с обводкой) возвращает
      к экрану заказов; «Добавить позицию» открывает внесение; «К списку» возвращает к списку;
      внесённая позиция появляется в списке (живёт до перезагрузки страницы).
-->
<script src="../../Design-System/connect.js" data-no-header data-no-sidenav defer></script>
<style>
  /* Страница занимает всё окно: сетка контент-контейнера — от краёв, как в макете */
  html, body { margin: 0; }
  /* Кадр — как на страницах раздела (гайд «Принципы группировки контента»): 20/30/24 */
  .frame { padding: var(--ds-space-5x, 20px) 30px var(--ds-space-6x, 24px); }
  @media (max-width: 1160px) { .frame { padding: var(--ds-space-5x, 20px) var(--ds-space-4x, 16px) var(--ds-space-6x, 24px); } }

  /* ── Своя раскладка экрана кухни (КДС-компонента в веб-ДС нет).
        Вёрстка — 1:1 по обновлённой версии экрана повара (Figma 05VEoPOZuAVHLfYI6yqVjz,
        узел 10497:3361): карточка 360 (#121212, r8), шапка с полосой статуса 8 px
        (заливка 12 % цвета статуса, рамка 1px #616161), строки-«коробки» 52 (#212121, r8),
        название 22/28 Medium, количество — плашкой #E0E0E0 (22/28 Bold #333),
        кнопка 52×52 #3b3b43 (arrow_forward / check / close / delete, 28),
        группа — шапка (гость 12/16 + пиктограмма 16 + название) + вложенные строки,
        «Гость 3» — красный кант 4 px слева, перенос — пунктирная рамка «Часть заказа X из Y». */

  /* ── Своя раскладка экрана кухни (КДС-компонента в веб-ДС нет) ──────────── */
  .kds-host { max-width: 1280px; }
  .kds-anno {
    font: 400 14px/20px 'Roboto', 'Helvetica Neue', Arial, sans-serif;
    color: #616161; margin: 0 0 12px; max-width: 1280px;
  }
  .kds-fit { position: relative; overflow-x: auto; }
  /* Корпус планшета вокруг кадра — как в kds-screen.html (ux-прототип KDS):
     светлый кант → тёмный безель → экран, камера сверху по центру.
     Тени нет: вокруг скруглённых углов на белом фоне она даёт серый ореол */
  /* Корпус планшета вокруг кадра — как в kds-screen.html (ux-прототип KDS):
     светлый кант → тёмный безель → экран, камера сверху по центру.
     Тени нет — серый ореол по углам она и давала */
  .kds-shell { position: relative; display: inline-block; padding: 34px; border-radius: 52px;
    background: #101013; border: 2px solid #c6c6ce; }
  .kds-shell .kds-view { border-radius: 16px; }
  .kds-shell::after { content: ''; position: absolute; top: 13px; left: 50%; transform: translateX(-50%);
    width: 8px; height: 8px; border-radius: 50%;
    background: radial-gradient(circle at 35% 35%, #3c3c44, #0d0d10 65%);
    box-shadow: 0 0 0 1px #2a2a30; }
  .kds-shell--mob { padding: 18px; border-radius: 40px; }
  /* Два кадра в ряд: основной и мобильный */
  .kds-boards { display: flex; align-items: flex-start; gap: 24px; }
  .kds-boards .kds-fit { flex: 0 0 auto; }
  .kds-fit--mob { height: auto; }
  .kds-fit::-webkit-scrollbar { height: 8px; }
  .kds-fit::-webkit-scrollbar-thumb { background: #bdbdbd; border-radius: 4px; }
  /* В режиме панели ревью подпись не нужна — иначе экран 1280×800 не влезает в кадр */
  body.dsr-page .kds-anno { display: none; }

  /* ── Описание экрана: заголовок НАД макетом, описание — под ним ── */
  .kds-doc {
    margin: 20px 0 4px; max-width: 1280px;
    font-family: 'Roboto', 'Helvetica Neue', Arial, sans-serif;
  }
  .kds-doc--head { margin: 0 0 16px; }
  .kds-doc--body { margin: 20px 0 4px; }
  .kds-doc__title { font-size: 20px; font-weight: 500; line-height: 28px; letter-spacing: .15px; color: #333; margin: 0 0 8px; }
  .kds-doc__item { font-size: 14px; line-height: 22px; color: #333; margin: 0; }
  .kds-doc__item b { font-weight: 500; }
  .kds-doc__item em { font-style: normal; color: #616161; }
  .kds-doc__q { font-size: 14px; line-height: 22px; color: #616161; margin: 8px 0 0; }
  .kds-doc__q b { font-weight: 500; color: #333; }
  /* ── Комментарии к экрану: кнопка + панель (fixed → доступно при любом скролле) ── */
  .kds-cmt-fab { position: fixed; right: 20px; bottom: 20px; z-index: 70; display: inline-flex; align-items: center; gap: 8px;
    height: 44px; padding: 0 16px; border: 1px solid #e0e0e0; border-radius: 22px; background: #fff; color: #333;
    box-shadow: 0 2px 8px rgba(0,0,0,.12); font: 500 14px/20px 'Roboto', Arial, sans-serif; cursor: pointer; }
  .kds-cmt-fab:hover { background: #f5f5f5; }
  .kds-cmt-fab .material-icons { font-size: 20px; }
  .kds-cmt-fab.has-cmt { border-color: #448aff; color: #1565c0; }
  .kds-cmt-fab__n:empty { display: none; }
  .kds-cmt-fab__n { min-width: 20px; height: 20px; padding: 0 6px; border-radius: 10px; background: #448aff; color: #fff;
    font-size: 12px; line-height: 20px; text-align: center; }
  .kds-cmt-panel { position: fixed; right: 20px; bottom: 76px; z-index: 70; display: none; flex-direction: column;
    width: 360px; max-height: calc(100vh - 120px); padding: 12px; border-radius: 12px; background: #fff;
    box-shadow: 0 8px 24px rgba(0,0,0,.18); font-family: 'Roboto', 'Helvetica Neue', Arial, sans-serif; }
  .kds-cmt-panel.is-open { display: flex; }
  .kds-cmt__head { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 500; line-height: 20px; color: #333; margin: 0 0 8px; }
  .kds-cmt__n { display: inline-flex; align-items: center; justify-content: center; min-width: 20px; height: 20px; padding: 0 6px;
    border-radius: 10px; background: #e0e0e0; color: #616161; font-size: 12px; line-height: 20px; font-weight: 500; }
  .kds-cmt__n--zero { display: none; }
  .kds-cmt__copy { margin-left: auto; height: 28px; padding: 0 10px; border: 1px solid #e0e0e0; border-radius: 8px; background: #fff;
    font: 500 12px/18px 'Roboto', Arial, sans-serif; color: #333; cursor: pointer; }
  .kds-cmt__copy:hover { background: #f5f5f5; }
  .kds-cmt__close { flex: 0 0 28px; width: 28px; height: 28px; padding: 0; border: 0; border-radius: 6px; background: transparent;
    color: #9e9e9e; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .kds-cmt__close:hover { background: #f5f5f5; color: #333; }
  .kds-cmt__close .material-icons { font-size: 18px; }
  .kds-cmt__list { list-style: none; margin: 0 0 8px; padding: 0 2px 0 0; display: flex; flex-direction: column; gap: 4px;
    overflow-y: auto; flex: 1 1 auto; min-height: 0; }
  .kds-cmt__i { display: flex; align-items: flex-start; gap: 8px; padding: 8px 10px; border-radius: 8px; background: #f5f5f5;
    font-size: 14px; line-height: 20px; color: #333; }
  .kds-cmt__t { flex: 1; min-width: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
  .kds-cmt__time { flex: 0 0 auto; font-size: 12px; line-height: 20px; color: #9e9e9e; white-space: nowrap; }
  .kds-cmt__del { flex: 0 0 24px; width: 24px; height: 24px; padding: 0; border: 0; border-radius: 6px; background: transparent;
    color: #9e9e9e; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .kds-cmt__del:hover { background: #e0e0e0; color: #333; }
  .kds-cmt__del .material-icons { font-size: 16px; }
  .kds-cmt__empty { font-size: 14px; line-height: 20px; color: #9e9e9e; margin: 0 0 8px; }
  .kds-cmt__add { display: flex; gap: 8px; align-items: flex-start; }
  .kds-cmt__input { flex: 1; min-width: 0; min-height: 40px; max-height: 120px; resize: vertical; padding: 9px 12px;
    border: 1px solid #e0e0e0; border-radius: 8px; background: #fff; font: 400 14px/20px 'Roboto', Arial, sans-serif; color: #333; }
  .kds-cmt__input:focus { outline: none; border-color: #448aff; }
  .kds-cmt__send { flex: 0 0 auto; height: 40px; padding: 0 14px; border: 0; border-radius: 8px; background: #448aff; color: #fff;
    font: 500 14px/20px 'Roboto', Arial, sans-serif; cursor: pointer; }
  .kds-cmt__send:disabled { background: #e0e0e0; color: #9e9e9e; cursor: default; }
  .kds-cmt__hint { font-size: 11px; line-height: 15px; color: #9e9e9e; margin: 6px 0 0; }
  /* Список всех сценариев прототипа под описанием экрана: каждый экран отдельно, со своим описанием */
  .kds-scen { margin: 16px 0 0; border-top: 1px solid #e0e0e0; padding-top: 12px; }
  .kds-scen__head { font-size: 14px; font-weight: 500; line-height: 20px; color: #333; margin: 0 0 8px; }
  .kds-scen__list { list-style: none; margin: 0; padding: 0; }
  .kds-scen__i { display: flex; gap: 10px; align-items: flex-start; padding: 6px 8px; border-radius: 6px; }
  .kds-scen__i + .kds-scen__i { margin-top: 2px; }
  .kds-scen__i.is-cur { background: #eeeeee; }
  .kds-scen__n { flex: 0 0 22px; font-size: 13px; line-height: 20px; color: #9e9e9e; text-align: right; }
  .kds-scen__i.is-cur .kds-scen__n { color: #333; }
  .kds-scen__body { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
  .kds-scen__t { font-size: 13px; line-height: 20px; color: #616161; }
  .kds-scen__i.is-cur .kds-scen__t { color: #333; font-weight: 500; }
  .kds-scen__d { font-size: 13px; line-height: 20px; color: #757575; }
  .kds-scen__q { font-size: 13px; line-height: 20px; color: #616161; font-style: normal; }
  .kds-scen__i.is-cur .kds-scen__q { color: #444; }
  .kds-scen__i.is-cur .kds-scen__d { color: #333; }

  .kds-view {
    --kds-bg: #121212;            /* фон экрана — как в макете */
    --kds-surface: #121212;       /* карточка, шапка, футер, пилюли */
    --kds-row: #212121;           /* строка блюда / коробка группы */
    --kds-btn: #3b3b43;           /* кнопка 52×52 у строки */
    --kds-line: #616161;          /* рамки, разделители */
    --kds-text: #ffffff;
    --kds-text-2: #9e9e9e;
    --kds-text-3: #d6d6d6;
    --kds-ic-neutral: #9e9e9e;
    --kds-ic-warning: #ffab40;
    --kds-ic-accent: #448aff;
    --kds-ic-positive: #14b456;
    --kds-ic-negative: #ff5252;
    position: relative; overflow: hidden; border-radius: 8px;
    background: var(--kds-bg); color: var(--kds-text);
    font-family: 'Roboto', 'Helvetica Neue', Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .kds-view, .kds-view * { box-sizing: border-box; }
  .kds-view .material-icons { font-family: 'Material Icons Outlined'; vertical-align: middle; line-height: 1; }
  .kds-view button { font-family: inherit; -webkit-tap-highlight-color: transparent; cursor: pointer; }
  /* ── Экран тач-терминала (1280×800, палец, не мышь): без выделения текста,
        без зависимости от hover, цель нажатия = не меньше 44–52 px ── */
  .kds-view {
    user-select: none; -webkit-user-select: none; -webkit-touch-callout: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .kds-view [data-full] { cursor: pointer; }
  .kds-board, .kds-posters { touch-action: pan-x pan-y; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }

  /* ── Шапка экрана: Figma «Header» 1280×44, pad 12/16/8/16, внешний зазор 32,
        списки 24, иконка→текст 8, счётчики 14 (внутри 6), текст Medium 16/24 ls .5 ── */
  .kds-topbar { position: absolute; top: 0; left: 0; right: 0; height: 44px; padding: 12px 16px 8px; display: flex; align-items: center; gap: 32px; z-index: 6; }
  .kds-tb-lists { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: 24px; }
  .kds-tb-list { display: flex; align-items: center; gap: 8px; height: 24px; flex: 0 0 auto; font-size: 16px; font-weight: 500; line-height: 24px; letter-spacing: .5px; color: #fff; white-space: nowrap; }
  .kds-tb-list .material-icons { font-size: 20px; width: 24px; text-align: center; color: var(--kds-text-2); flex: 0 0 auto; }
  /* Адаптив (как Figma «Header»): название ресторана — сжимаемый слот, обрезается с эллипсисом
     и не наезжает на счётчики; остальные элементы списка не сжимаются */
  .kds-tb-rest { flex: 0 1 auto; min-width: 0; overflow: hidden; }
  .kds-tb-pick { min-width: 0; }
  .kds-tb-pick [data-val] { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .kds-tb-chev { font-size: 20px !important; width: 24px !important; margin-left: 0; flex: 0 0 auto; }
  .kds-tb-states { flex: 0 0 auto; display: flex; align-items: center; gap: 12px; margin-left: auto; }
  .kds-tb-state { display: flex; align-items: center; gap: 4px; font-size: 16px; font-weight: 500; line-height: 24px; letter-spacing: .5px; white-space: nowrap; }
  .kds-tb-state .material-icons { font-size: 20px; width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center; }
  .kds-tb-ico { flex: 0 0 24px; width: 24px; height: 24px; display: inline-flex; align-items: center; justify-content: center; }
  .kds-svg-ico { width: 20px; height: 20px; flex: 0 0 auto; display: block; }
  .kds-tb-state--clock .kds-svg-ico { color: #616161; }
  .kds-tb-state--accent { color: var(--kds-ic-accent); }
  .kds-tb-state--negative { color: var(--kds-ic-negative); }
  .kds-tb-state--positive { color: var(--kds-ic-positive); }
  .kds-tb-state--clock { color: #fff; }
  .kds-tb-state--clock .material-icons { color: var(--kds-text-2); }
  .kds-tb-icons { flex: 0 0 auto; display: flex; align-items: center; gap: 16px; }
  /* ── Шапка мобильного кадра (Figma «Header» 375×56): одна строка — две группы,
        внутри групп 8, между группами свободное место. Текст, часы и счётчики скрыты,
        вместо счётчиков — одна кнопка метрик ── */
  .kds-view--mob .kds-topbar { height: 44px; padding: 12px 12px 8px; gap: 16px; }
  /* обёртки групп «растворяются»: все пять кнопок становятся прямыми детьми шапки */
  .kds-view--mob .kds-tb-lists,
  .kds-view--mob .kds-tb-states,
  .kds-view--mob .kds-tb-icons { display: contents; }
  .kds-view--mob .kds-tb-list { width: auto; flex: 0 0 auto; height: 40px; padding: 0; gap: 8px;
    font-size: 0; letter-spacing: 0; background: transparent; }
  .kds-view--mob .kds-tb-list[data-clock] { display: none; }
  .kds-view--mob .kds-tb-list [data-val] { display: none; }
  .kds-view--mob .kds-tb-list.kds-tb-pick { background: transparent; }
  .kds-view--mob .kds-tb-list.kds-tb-rest { width: auto; flex: 0 0 auto; padding: 0; gap: 8px; }
  /* все иконки шапки — 24×24 на любом экране (и шрифтовые, и SVG) */
  .kds-topbar .material-icons { width: 24px; height: 24px; font-size: 24px; }
  /* внутри счётчиков и иконочных кнопок свои правила — перебиваем их тем же размером */
  .kds-topbar .kds-tb-state .material-icons,
  .kds-topbar .kds-iconbtn .material-icons { width: 24px; height: 24px; font-size: 24px; }
  .kds-topbar .kds-tb-chev { width: 24px !important; height: 24px; font-size: 24px !important; }
  .kds-topbar .kds-svg-ico { width: 20px !important; height: 20px !important; }
  .kds-topbar .kds-tb-ico { flex: 0 0 24px; width: 24px; height: 24px; }
  .kds-view--mob .kds-tb-chev { display: none; }
  .kds-view--mob .kds-tb-states [data-filter] { display: none; }
  .kds-view--mob .kds-tb-states .kds-tb-state--clock { width: auto; height: 40px; margin-left: auto;
    justify-content: center; gap: 0; padding: 0; background: transparent; }
  .kds-view--mob .kds-tb-states .kds-tb-state--clock b { display: none; }
  .kds-view--mob .kds-tb-icons .kds-iconbtn { width: 24px; height: 40px; padding: 0; background: transparent; }
  .kds-iconbtn {
    position: relative;
    flex: 0 0 auto; width: 24px; height: 24px; border: 0; border-radius: 0;
    background: transparent; color: var(--kds-text-2); display: flex; align-items: center; justify-content: center;
  }
  /* видимая иконка 24, но цель нажатия 44×44 — как требует тач */
  .kds-iconbtn::after { content: ''; position: absolute; inset: -10px; }
  .kds-iconbtn:active { background: rgba(255, 255, 255, .1); border-radius: 8px; }
  .kds-iconbtn .material-icons { font-size: 20px; }
  .kds-iconbtn--power .material-icons { font-size: 18px; }
  .kds-iconbtn--power { color: var(--kds-ic-accent); }

  /* ── Лента карточек ── */
  .kds-board {
    position: absolute; top: 48px; left: var(--ds-space-4x, 16px); right: var(--ds-space-4x, 16px); bottom: 74px;
    display: flex; align-items: flex-start; gap: var(--ds-space-4x, 16px); z-index: 1;
    overflow: auto;
    scrollbar-width: none;
  }
  .kds-board::-webkit-scrollbar { width: 0; height: 0; }

  /* ── Полоса скролла (Figma: Scroll 1280×12 на y=728, ползунок 8 px r8 #333) ── */
  .kds-scrollstrip { position: absolute; left: 0; right: 0; bottom: 56px; height: 12px; padding: 2px; z-index: 6; }
  .kds-scrollstrip__thumb { height: 8px; border-radius: 8px; background: #333333; }

  /* ── Футер (Figma: Footer 1280×56, pad 4/16, space-between; текст Medium 16/24 ls .5;
        фон — rgba(18,18,18,0.92), нижние углы скруглены рамкой кадра) ── */
  .kds-footer {
    position: absolute; left: 0; right: 0; bottom: 0; height: 56px; padding: 4px 16px; z-index: 6;
    background: rgba(18, 18, 18, .92);
    display: flex; align-items: center; justify-content: space-between; gap: 24px;
  }
  .kds-footer__left { display: flex; align-items: center; gap: 24px; min-width: 0; }
  .kds-footer__ver { font-size: 16px; font-weight: 500; line-height: 24px; letter-spacing: .5px; color: #fff; white-space: nowrap; }
  .kds-footer__status { display: flex; align-items: center; gap: 8px; font-size: 16px; font-weight: 500; line-height: 24px; letter-spacing: .5px; }
  /* Figma: ELLIPSE 16×16 залит #14b456 (а не глиф fiber_manual_record — в Outlined он рисуется кольцом) */
  .kds-footer__status .kds-dot { flex: 0 0 auto; width: 16px; height: 16px; border-radius: 50%; background: var(--kds-ic-positive); }
  .kds-footer__total { font-size: 16px; font-weight: 500; line-height: 24px; letter-spacing: .5px; white-space: nowrap; position: absolute; left: 50%; transform: translateX(-50%); }
  .kds-footer__right { display: flex; align-items: center; gap: 8px; flex: 0 0 auto; }
  .kds-footer__label { font-size: 16px; line-height: 24px; color: var(--kds-text-2); }
  .kds-footer__btn {
    position: relative;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; height: 48px; padding: 14px 16px;
    border: 1px solid var(--kds-line); border-radius: 12px; background: transparent;
    font-size: 14px; font-weight: 500; line-height: 20px; letter-spacing: .5px; text-transform: uppercase; color: #fff;
  }
  .kds-footer__btn:active { background: rgba(255, 255, 255, .08); }
  .kds-footer__btn .material-icons { font-size: 20px; color: #fff; }
  .kds-view--narrow .kds-footer__left { gap: 16px; }
  .kds-view--narrow .kds-footer__total { display: none; }
  /* ── Футер мобильный (Figma «Footer» 375×72): точка статуса слева, «Всего заказов» по центру,
        кнопка «Отменить» — 52×56, синяя, только иконка ── */
  .kds-view--mob .kds-footer { height: 72px; padding: 8px 16px; }
  .kds-view--mob .kds-footer__ver { display: none; }
  .kds-view--mob .kds-footer__status { font-size: 0; gap: 0; }
  .kds-view--mob .kds-footer__total { display: block; font-size: 16px; line-height: 20px; color: #fff; }
  .kds-view--mob .kds-footer__btn { width: 52px; height: 56px; padding: 0; border: 1px solid var(--kds-line); border-radius: 12px;
    background: transparent; font-size: 0; gap: 0; opacity: 1; }
  .kds-view--mob .kds-footer__btn .material-icons { font-size: 24px; color: #fff; }
  .kds-view--mob .kds-footer__btn:disabled { opacity: 1; }
  /* ── Контент мобильного кадра (Figma PB-6623): одна колонка, карточка во всю ширину,
        строки и кнопки 56 ── */
  /* Индикаторы прокрутки — как в Figma: внизу полоса Scroll 12 px (ползунок 8 px #333),
     в режиме «по блюдам» — вертикальная полоса справа (трек #9E9E9E, ползунок #616161).
     Сама прокрутка — палец/пан/колесо, индикатор только показывает позицию */
  .kds-vscroll { display: none; }
  .kds-scrollstrip { display: block; }
  .kds-dlist ~ .kds-scrollstrip { display: none; }
  .kds-dlist ~ .kds-vscroll { display: block; }
  /* На мобильном кадре индикаторов нет */
  .kds-view--mob .kds-scrollstrip, .kds-view--mob .kds-vscroll { display: none; }
  .kds-view--mob .kds-board { top: 48px; left: 12px; right: 12px; bottom: 80px;
    flex-direction: column; flex-wrap: nowrap; gap: 16px; }
  .kds-view--mob .kds-card, .kds-view--narrow.kds-view--mob .kds-card { width: 100%; }
  .kds-view--mob .kds-row { min-height: 52px; }
  .kds-view--mob .kds-row__ico { flex: 0 0 56px; }
  .kds-view--mob .kds-row__ico .material-icons { font-size: 28px; }
  /* Узкий экран: шапка не ломается — уменьшаем только внешние зазоры */
  .kds-view--narrow .kds-topbar { gap: 16px; }
  .kds-view--narrow .kds-tb-lists { gap: 16px; }
  /* мобильный кадр тоже «узкий»: его отступы должны побеждать правила --narrow (8, как в макете) */
  .kds-view--narrow.kds-view--mob .kds-topbar { height: 44px; padding: 12px 12px 8px; gap: 16px; }
  .kds-view--narrow.kds-view--mob .kds-tb-lists { gap: 8px; }

  /* ── Карточка заказа (обновлённый вид, 1:1 с макетом) ── */
  .kds-card { display: flex; flex-direction: column; width: 360px; flex: 0 0 auto; background: transparent; border-radius: 8px; }
  .kds-view--narrow .kds-card { width: 326px; }
  .kds-card__head {
    border: 0; box-shadow: inset 0 0 0 1px var(--kds-line);
    border-top: 8px solid var(--st-band, #616161);
    border-radius: 8px; background: var(--st-tint, rgba(97, 97, 97, .12));
  }
  /* Шапка: полоса 8 + блок «номер/канал» 60 (пад 4/6, без зазора между строками) + подвал
     20 (+4) 20 (+4) комментарий 30 и 4 px снизу — итого 92 / 126 / 150 как в макете */
  .kds-card__headtop { padding: 4px 6px; display: flex; flex-direction: column; gap: 0; }
  /* шапка заказа целиком — кликабельная область статуса (PB-7765) */
  .kds-card__head { cursor: pointer; }
  .kds-card__head:active { filter: brightness(1.12); }
  .kds-card__head p, .kds-card__head span { cursor: inherit; }
  .kds-card__slot { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; min-height: 32px; }
  .kds-card__num { font-size: 24px; font-weight: 500; line-height: 32px; letter-spacing: .5px; color: var(--st-num, #fff); }
  .kds-card__brand { font-size: 14px; line-height: 20px; letter-spacing: .5px; color: #fff; margin-left: 8px; margin-right: auto; white-space: nowrap; }
  .kds-card__timer { font-size: 24px; font-weight: 500; line-height: 32px; letter-spacing: .5px; color: var(--st-timer, #fff); }
  .kds-card__ch { font-size: 14px; line-height: 20px; letter-spacing: .5px; color: #fff; white-space: pre-wrap; }
  .kds-card__hfoot { padding: 0 6px 4px; display: flex; flex-direction: column; gap: 4px; }
  .kds-card__rest { display: flex; align-items: center; gap: 4px; font-size: 14px; line-height: 20px; letter-spacing: .5px; }
  .kds-card__rest .material-icons { font-size: 20px; color: var(--kds-ic-neutral); }
  .kds-hmeta { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .kds-hmeta__items { display: flex; align-items: center; gap: 16px; min-width: 0; flex-wrap: wrap; }
  .kds-hmeta__item { display: flex; align-items: center; gap: 4px; font-size: 14px; line-height: 20px; letter-spacing: .5px; white-space: nowrap; }
  .kds-hmeta__item .material-icons, .kds-hmeta__item .kds-svg-ico { font-size: 20px; color: var(--kds-ic-neutral); }
  .kds-card__pay { font-size: 20px; color: var(--kds-ic-positive); flex-shrink: 0; }
  .kds-card__pay--off { color: var(--kds-ic-neutral); }
  /* В макете у карточек в статусах «Приготовлен» и «Отменён» вся шапка белая — иконки тоже белые */
  .kds-card--wico .kds-hmeta__item .material-icons,
  .kds-card--wico .kds-hmeta__item .kds-svg-ico,
  .kds-card--wico .kds-card__rest .material-icons { color: #ffffff; }

  /* ── Экран сборщика «без статусов» (Figma 8941:7418): в новом дизайне кнопки статуса нет.
        Геометрия шапки — как у всех карточек (та же полоса 8 px, те же отступы), но без цвета
        статуса: полоса нейтральная #616161, заливки статуса нет; кнопки строк нейтральные ── */
  .kds-card--asm .kds-card__head { border-top-color: #616161; background: transparent; }
  /* Экран сборщика: у блюд НЕТ кнопок — справа только иконка статуса (без подложки и рамки);
     цвет и глиф — как у статусов везде (стрелка / галочка / крестик) */
  /* Экран сборщика: иконка статуса не кнопка — 24 px по макету DSGN-509 (узел 8941:7418),
     а не 28, как в кнопках 52×52 на экране повара */
  .kds-row__ico { flex: 0 0 52px; display: flex; align-items: center; justify-content: center; }
  .kds-row__ico .material-icons { font-size: 24px; }

  /* Комментарий — пунктирная линия сверху, иконка 16 + текст 16/24 */
  .kds-comment { display: flex; align-items: flex-start; gap: 6px; padding: 1px 0 0; margin-top: 0; }
  .kds-comment__inner { flex: 1; min-width: 0; display: flex; align-items: flex-start; gap: 6px; border-top: 1px dashed var(--kds-line); padding: 4px 0 0; min-height: 28px; }
  .kds-comment .material-icons { font-size: 16px; color: var(--kds-ic-warning); flex: 0 0 auto; padding-top: 4px; }
  .kds-comment__text { font-size: 16px; line-height: 24px; letter-spacing: .5px; color: var(--kds-text-3); padding-top: 0; }

  .kds-card__body { background: transparent; padding-top: 6px; display: flex; flex-direction: column; gap: var(--ds-space-1x, 4px); }
  .kds-card__body--tint { background: transparent; }
  .kds-card__body--flush { padding-top: 0; }
  .kds-kit--tall { padding-bottom: 4px; }
  .kds-kit--tall .kds-kit__btn { margin-bottom: -4px; }
  .kds-card--partTop { box-shadow: inset 0 4px 0 var(--kds-line); }
  .kds-card--partBottom { box-shadow: inset 0 -4px 0 var(--kds-line); }
  .kds-card--partTop.kds-card--partBottom { box-shadow: inset 0 4px 0 var(--kds-line), inset 0 -4px 0 var(--kds-line); }
  .kds-card__div { flex: 0 0 1px; width: 312px; height: 1px; margin: 0 0 -5px 8px; background: rgba(255, 255, 255, .12); }
  .kds-cap { flex: 0 0 4px; height: 4px; margin-bottom: 4px; border: 2px dashed var(--kds-line); border-bottom: 0; border-radius: 4px 4px 0 0; }
  .kds-card > .kds-transfer { margin-top: 4px; }
  .kds-card__head--pad { padding-bottom: 2px; }
  /* ── Строка блюда: «коробка» 52 (#212121, r8) + кнопка 52×52 (#3b3b43), рамка — цвет статуса ── */
  .kds-row { display: flex; align-items: stretch; background: var(--kds-row); border-radius: 8px; overflow: hidden; min-height: 52px; }
  .kds-row__main { flex: 1; min-width: 0; padding: var(--ds-space-1x, 4px) var(--ds-space-2x, 8px); display: flex; flex-direction: column; justify-content: center; }
  .kds-guest { display: flex; align-items: center; gap: 4px; height: 16px; font-size: 12px; line-height: 16px; letter-spacing: .4px; color: var(--kds-text-3); }
  .kds-row__line { display: flex; align-items: center; gap: 6px; min-width: 0; }
  .kds-row__name { font-size: 22px; font-weight: 500; line-height: 28px; letter-spacing: .25px; color: #fff; min-width: 0; white-space: nowrap; }
  .kds-qty {
    flex: 0 0 auto; background: #e0e0e0; border-radius: 6px; padding: 0 4px;
    font-size: 22px; font-weight: 700; line-height: 28px; letter-spacing: .25px; color: #333;
  }
  /* Отменённая строка: красный текст БЕЗ зачёркивания (решение дизайнера 22.10.2026) */
  .kds-row--neg .kds-row__name { color: var(--kds-ic-negative); text-decoration: none; }
  /* Справа у отменённой строки — не кнопка, а просто крестик без подложки */
  .kds-row__ico--x { color: var(--kds-ic-negative); }
  .kds-row__ico--x .material-icons { font-size: 24px; }
  /* ── Отменённый заказ (красная полоса): строки красные БЕЗ зачёркивания и без
        подложки у кнопки, группа — наоборот: зачёркнута вся (как в макете) ── */
  .kds-card--cancelled .kds-row--neg .kds-row__name { color: var(--kds-ic-negative); text-decoration: none; }
  .kds-card--cancelled .kds-kit--neg .kds-kit__name,
  .kds-card--cancelled .kds-kit--neg .kds-kit__comp { text-decoration: line-through; }
  /* Звезда (stars) — признак «новое блюдо» (уже занята в продукте). У набора/группы звезды нет;
     точный вектор компонента stars из Figma (кольцо входит в глиф) — слот и цвет */
  .kds-star { display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto;
    color: var(--kds-ic-positive);
  }
  .kds-star--lg { width: 40px; height: 40px; }
  .kds-star .kds-svg-ico { color: var(--kds-ic-positive); }
  .kds-row__status { display: none; }
  .kds-row--sel { box-shadow: inset 4px 0 0 var(--kds-ic-negative); }
  /* Кухня блюда (PB-6800 «Визуальное выделение цеха»): рамка справа 1px на строке блюда.
     Холодный цех — синяя #448AFF, горячий — красная #FF5252, жёлтая — #FFAB40 (цвета из макета).
     Настоящий border-right: повторяет скругление углов строки (как border-r кадра в Figma);
     inset-тень не подходит — она рисуется ПОД кнопкой у правого края и не видна. */
  .kds-row--kt-cold { border-right: 1px solid #448aff; }
  .kds-row--kt-hot { border-right: 1px solid #ff5252; }
  .kds-row--kt-warn { border-right: 1px solid #ffab40; }
  .kds-btn {
    flex: 0 0 52px; width: 52px; border: 0; border-radius: 8px;
    background: var(--kds-btn); display: flex; align-items: center; justify-content: center;
    color: var(--kds-ic-neutral); transition: background-color .15s ease;
  }
  @media (hover: hover) and (pointer: fine) { .kds-btn:hover { background: #4d4d4d; } }
  .kds-btn:active { background: #4d4d4d; }
  .kds-btn .material-icons { font-size: 28px; }
  /* Статус строки — ЦВЕТ/иконка кнопки 52×52, как в макете: ожидает — серая стрелка,
     пора готовить — жёлтая, готовится — синяя, готов — зелёная галочка, отмена — красный крестик.
     Правила идут ПОСЛЕ .kds-btn, иначе базовый серый цвет перебивал бы статусы. */
  .kds-btn--waiting { color: var(--kds-ic-neutral); }
  .kds-btn--urgent { color: var(--kds-ic-warning); }
  .kds-btn--cooking { color: var(--kds-ic-accent); }
  .kds-btn--ready { color: var(--kds-ic-positive); }
  .kds-btn--cancelled { color: var(--kds-ic-negative); }
  /* В отменённом заказе кнопки 52×52 сливаются со строкой (#212121) — как в Figma */
  .kds-card--cancelled .kds-btn, .kds-card--cancelled .kds-kit__btn { background: transparent; }

  /* ── Курс: полоса как в макете DSGN-533 (компонент Button kurs) — 36 px, r12, текст 14/20 по центру.
        В сценариях 3.3 и «Общих границах» состояния «активный/дизейбл» у курса НЕТ: все курсы
        выглядают одинаково — заливка #424242, белый текст. Курс — кнопка: нажатие бампает весь курс (DS-534) ── */
  .kds-course {
    display: flex; align-items: center; justify-content: center; gap: 8px; width: 100%;
    flex: 0 0 auto; height: 36px; border: 1px solid #424242; border-radius: 12px; background: #424242;
    font-size: 14px; line-height: 20px; letter-spacing: .25px; color: #ffffff;
    margin-top: var(--ds-space-3x, 12px);
  }
  .kds-course:active { background: #4d4d4d; }
  .kds-course:first-child { margin-top: 0; }
  /* шеврон компонента 18 px, зазор 8 ── как в DSGN-533 ── */
  .kds-course .material-icons { font-size: 18px; color: #ffffff; }

  /* ── Набор (применение задачи к новому дизайну) ──
        Заголовок набора — отдельная строка без кнопки: гость 12/16 + пиктограмма 16 + название 20/24
        (+ маркер экземпляра, + «на экране N из M блюд набора»); компоненты — вложенные строки как в макете (отступ 24),
        каждая со своей кнопкой и статусом. */
  /* ── Набор (комбо) в карточке — 1:1 по Figma (карточки «10585:7793», «10585:7667»):
        блок 360 БЕЗ рамки (#212121, r8), шапка (гость 12/16 + звезда «новое блюдо» по данным, название 22/28,
        «на экране N из M блюд набора» 12/16 когда видна не вся группа), компоненты текстом 18/24 (без своих кнопок),
        комментарий — пунктир сверху (иконка #FFAB40, текст 16/24 #D6D6D6), справа одна кнопка 52 на всю высоту ── */
  .kds-kit { position: relative; display: flex; align-items: stretch; background: var(--kds-row); border-radius: 8px; overflow: hidden; }
  .kds-kit__body { flex: 1; min-width: 0; display: flex; flex-direction: column; padding-bottom: var(--ds-space-1x, 4px); }
  .kds-kit__head { min-height: 52px; padding: var(--ds-space-1x, 4px) var(--ds-space-2x, 8px); display: flex; flex-direction: column; justify-content: center; }
  .kds-kit__gline { display: flex; align-items: center; height: 16px; }
  .kds-kit__star { margin-left: auto; display: flex; color: var(--kds-ic-positive); }
  .kds-kit__name { font-size: 22px; font-weight: 500; line-height: 28px; letter-spacing: .25px; }
  /* Подпись частичной видимости — про видимость, а не про готовность. Компактно, в ОДНОЙ строке
     с названием, справа: «2 из 3 блюд» 14/20, medium, #BDBDBD — читается с рабочего расстояния
     на тач-терминале (решение дизайнера 22.10.2026) */
  .kds-kit__seen, .kds-cset__seen { margin-left: auto; flex: 0 0 auto; white-space: nowrap;
    font-size: 14px; line-height: 20px; letter-spacing: .25px; font-weight: 500; color: #bdbdbd; }
  /* Гость в правом слоте шапки (вариант экрана 10) — точно там же и так же,
     где стояла подпись «N из M блюд»: справа, по центру строки, 14/20 medium #BDBDBD */
  .kds-cset__guest-right { margin-left: auto; flex: 0 0 auto; align-self: flex-end; white-space: nowrap;
    font-size: 14px; line-height: 20px; letter-spacing: .25px; font-weight: 500; color: #bdbdbd; }
  /* Строка «название + счётчик»: название слева, подпись видимости — справа */
  .kds-cset__row, .kds-kit__nrow { display: flex; align-items: center; gap: var(--ds-space-2x, 8px); min-width: 0; }
  .kds-seen-sub { display: none; }
  .kds-kit--neg .kds-kit__name { color: var(--kds-ic-negative); }
  .kds-kit__comp { display: flex; align-items: center; gap: 6px; min-height: 24px; padding: 0 var(--ds-space-3x, 12px) 0 var(--ds-space-4x, 16px);
    font-size: 18px; line-height: 24px; letter-spacing: .5px; color: #fff; }
  .kds-kit__comp--plain { padding-left: 41px; }
  .kds-kit__comp--deep { padding-left: 41px; }
  .kds-kit__comp--tight { padding-right: 8px; }
  .kds-kit__comp--tall { min-height: 28px; }
  .kds-kit__comp--neg { color: var(--kds-ic-negative); }
  /* Отменённый компонент набора (PB-8108) — красный БЕЗ зачёркивания (решение дизайнера 22.10.2026) */
  .kds-kit__comp--cancelled { text-decoration: none; }
  .kds-kit__qty { flex: 0 0 auto; min-width: 19px; height: 24px; background: #e0e0e0;
    border-radius: 6px; padding: 0 4px; font-size: 18px; font-weight: 700; line-height: 24px; letter-spacing: .5px; color: #333; }
  .kds-kit__qty--neg { background: transparent; box-shadow: inset 0 0 0 1px var(--kds-ic-negative); color: var(--kds-ic-negative); font-weight: 500; }
  .kds-kit__comment { display: flex; align-items: flex-start; margin: var(--ds-space-1x, 4px) 0 0; padding: 2px var(--ds-space-2x, 8px) 0; }
  .kds-kit__comment-in { flex: 1; min-width: 0; display: flex; align-items: flex-start; gap: 6px;
    border-top: 1px dashed var(--kds-line); padding: 3px 0 0; }
  .kds-kit__comment .material-icons { font-size: 16px; line-height: 1; color: var(--kds-ic-warning); padding-top: 4px; }
  .kds-kit__comment .kds-comment__text { font-size: 16px; line-height: 24px; letter-spacing: .5px; color: #d6d6d6; }
  .kds-kit__btn { flex: 0 0 52px; width: 52px; border: 0; padding: 0; background: var(--kds-btn); border-radius: 8px;
    display: flex; align-items: center; justify-content: center; color: var(--kds-ic-neutral); transition: background-color .15s ease; }
  .kds-kit__btn .material-icons { font-size: 28px; }
  .kds-kit__btn:active { background: #4d4d4d; }
  @media (hover: hover) and (pointer: fine) { .kds-kit__btn:hover { background: #4d4d4d; } }
  .kds-kit__btn--urgent { color: var(--kds-ic-warning); }
  .kds-kit__btn--cooking { color: var(--kds-ic-accent); }
  .kds-kit__btn--ready { color: var(--kds-ic-positive); }
  .kds-kit__btn--cancelled { color: var(--kds-ic-negative); }
  .kds-kit--mods { box-shadow: none; }
  .kds-kit--mods .kds-kit__body { padding-bottom: 0; }
  .kds-nest { display: flex; flex-direction: column; gap: var(--ds-space-1x, 4px); }
  .kds-nest__rows { display: flex; flex-direction: column; gap: var(--ds-space-1x, 4px); margin-left: var(--ds-space-6x, 24px); }

  /* ── Отдельно готовящийся модификатор ── */
  /* Пиктограмма post_add в строке НЕ используется: смысл не утверждён (кандидат — только на постере) */
  .kds-dlink { display: inline-flex; align-items: center; gap: 4px; min-width: 0; font-size: 12px; line-height: 16px; color: var(--kds-text-3); }
  .kds-dlink .material-icons { font-size: 14px; color: var(--kds-text-2); }
  .kds-dsep { color: var(--kds-text-2); }

  /* ── Режим «по блюдам» — по макету Figma «Режим Блюда» (10602:36475):
        строка = [шапка заказа 360] + 8 + [блюдо 820 + кнопка 52], рамка 1px #616161, r8 ── */
  /* Список — как в макете: видимая область от шапки (48) до футера (56), скролл — отдельная полоса справа (Scroll) */
  .kds-dlist { position: absolute; top: 48px; left: var(--ds-space-4x, 16px); right: 24px; bottom: 56px; overflow-y: auto; overflow-x: hidden;
    display: flex; flex-direction: column; gap: var(--ds-space-1x, 4px); z-index: 1; scrollbar-width: none; }
  .kds-dlist::-webkit-scrollbar { width: 0; height: 0; }
  /* Вертикальная полоса скролла (Figma: Scroll 12 px на правом краю, от шапки до футера;
     трек 8 px #9E9E9E r8, ползунок #616161 r8) */
  .kds-vscroll { position: absolute; top: 48px; right: 2px; bottom: 56px; width: 12px; padding: 2px; z-index: 6; }
  .kds-vscroll__track { position: relative; width: 8px; height: 100%; border-radius: 8px; background: #9e9e9e; }
  .kds-vscroll__knob { position: absolute; left: 0; top: 0; width: 8px; min-height: 24px; border-radius: 8px; background: #616161; }
  .kds-board, .kds-posters, .kds-dlist { cursor: grab; }
  .kds-board.is-panning, .kds-posters.is-panning, .kds-dlist.is-panning { cursor: grabbing; }
  /* Строка — без своего фона: две отдельные «коробки» (плашка заказа и блюдо) с зазором 8 по фону экрана, как в макете */
  .kds-dl-row { display: flex; align-items: stretch; gap: 8px; min-height: 60px; flex: 0 0 auto; }
  /* Плашка заказа: заливка 12 % цвета статуса, рамка 1px #616161, r8, паддинг 4/6 */
  .kds-dl-stub { flex: 0 0 360px; width: 360px; padding: 4px 6px; border: 1px solid #616161; border-radius: 8px;
    display: flex; flex-direction: column; align-items: stretch; text-align: left;
    background: rgba(97,97,97,.12); cursor: pointer; }
  .kds-dl-stub--waiting { background: rgba(97,97,97,.12); }
  .kds-dl-stub--urgent { background: rgba(234,120,6,.12); }
  .kds-dl-stub--cooking { background: rgba(38,81,181,.12); }
  .kds-dl-stub--ready { background: rgba(15,133,44,.12); }
  .kds-dl-stub--cancelled { background: rgba(222,26,18,.12); }
  .kds-dl-stub:active { filter: brightness(1.1); }
  .kds-dl-stub__top { display: flex; align-items: baseline; justify-content: space-between; gap: 36px; height: 32px; }
  .kds-dl-stub__num, .kds-dl-stub__timer { font-size: 24px; font-weight: 500; line-height: 32px; letter-spacing: .5px; color: #fff; }
  .kds-dl-stub--urgent .kds-dl-stub__timer { color: var(--kds-ic-warning); }
  .kds-dl-stub--cancelled .kds-dl-stub__timer { color: #d6d6d6; }
  .kds-dl-stub__timer.is-neg { color: #ff5252; }
  .kds-dl-stub__ch { font-size: 14px; line-height: 20px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kds-dl-body { flex: 1 1 auto; min-width: 0; display: flex; background: #212121; border-radius: 8px; overflow: hidden; }
  .kds-dl-body--indent { margin-left: 36px; }
  .kds-dl-body--sel { box-shadow: inset 4px 0 0 var(--kds-ic-negative); }
  .kds-dl-main { flex: 1 1 auto; min-width: 0; padding: var(--ds-space-1x, 4px) var(--ds-space-2x, 8px); display: flex; flex-direction: column; justify-content: center; }
  .kds-dl-cell { display: flex; flex-direction: column; justify-content: center; }
  /* Строка над названием: гость слева, набор с номером экземпляра справа */
  .kds-dl-meta { display: flex; align-items: center; gap: 8px; min-width: 0;
    font-size: 12px; line-height: 16px; letter-spacing: .4px; color: var(--kds-text-3); }
  /* Звезда — всегда у правого края строки над названием */
  .kds-dl-meta .kds-dl-star { margin-left: auto; flex: 0 0 auto; display: flex; }
  /* Набор — в одной строке с названием блюда, справа */
  .kds-dl-combo-tag { display: inline-flex; align-items: center; margin-left: auto; padding-left: 12px;
    flex: 0 0 auto; max-width: 55%; overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
    font-size: 16px; font-weight: 400; line-height: 24px; letter-spacing: .15px; color: var(--kds-text-3); }
  .kds-dl-main--chips { padding-bottom: 8px; }
  .kds-dl-main--chips .kds-dl-cell { min-height: 48px; }
  .kds-dl-main--combo { padding-bottom: 4px; gap: 4px; }
  .kds-dl-main--combo .kds-dl-cell { min-height: 44px; }
  .kds-dl-main--combo .kds-dl-chips { min-height: 24px; }
  .kds-dl-gline { display: flex; align-items: center; justify-content: space-between; gap: 8px; height: 16px; }
  .kds-guest { font-size: 12px; line-height: 16px; letter-spacing: .4px; color: #d6d6d6; }
  .kds-dl-line { display: flex; align-items: center; gap: 6px; min-height: 28px; min-width: 0; }
  .kds-dl-name { flex: 0 1 auto; min-width: 0; font-size: 22px; font-weight: 500; line-height: 28px; letter-spacing: .25px; color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kds-dl-name.is-neg { color: var(--kds-ic-negative); }
  /* F1 (ред. 22.10.2026): принадлежность набору — отдельной строкой НАД названием.
     Шрифт и цвет — как у строки гостя: 12/16, var(--kds-text-3) (#D6D6D6), без иконки;
     при нехватке места сокращается с многоточием, полное — по тапу (data-full) */
  .kds-row__combo-line, .kds-dl-combo-line { font-size: 12px; line-height: 16px; letter-spacing: .4px; color: var(--kds-text-3); font-weight: 400;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
  /* Строка принадлежности в списке блюд: набор слева, гость справа (одна строка, без второго ряда) */
  .kds-dl-combo-line { display: flex; align-items: center; }
  .kds-dl-combo__name { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .kds-dl-combo__guest { margin-left: auto; flex: 0 0 auto; padding-left: 12px; color: var(--kds-text-3); }
  /* Номер экземпляра набора в строке принадлежности: цифра в нейтральном бейдже 20×16 r4 */
  .kds-dl-inst { display: inline-flex; align-items: center; justify-content: center; min-width: 24px; height: 20px;
    margin-left: 8px; padding: 0 6px; border-radius: 6px; background: #333333; color: #d6d6d6;
    font-size: 14px; line-height: 20px; font-weight: 500; letter-spacing: .25px; vertical-align: middle; }
  /* Вторичная подпись в карточке: только служебный текст (напр. «не готовится») */
  .kds-row__sub { font-size: 12px; line-height: 16px; letter-spacing: .4px; color: #9e9e9e; margin-top: 0; }
  /* Модификатор блюда — строкой под названием, как служебная подпись 12/16 #9E9E9E */
  .kds-row__mods { display: flex; flex-direction: column; gap: 2px; margin-top: 0; }
  .kds-row__mod { font-size: 12px; line-height: 16px; letter-spacing: .4px; color: #9e9e9e; }
  /* Отменённый модификатор у блюда (не блюдо): красный; удалённый — зачёркнутый */
  .kds-row__mod--neg { color: var(--kds-ic-negative); }
  .kds-row__mod--del { text-decoration: line-through; }
  /* Вариант «модификатор как комментарий» (только g-two-combos, сценарий 3.5) — геометрия 1:1
     по Figma «Comment» (10628:57896): отступы от соседних блоков по 4, внутри pt 2,
     пунктир 1px #616161, pt 4 до текста, зазор иконка–текст 6, иконка 16 (pt 4 — центр иконки
     на центре первой строки текста 16/24), текст 16/24 #D6D6D6 */
  .kds-row__mods--cmt { display: block; margin: 4px 0 0; padding: 2px 0 0; }
  .kds-row__mods-cmt { display: flex; align-items: flex-start; gap: 6px;
    border-top: 1px dashed var(--kds-line); padding: 4px 0 0; }
  .kds-row__mods-cmt .material-icons { flex: 0 0 auto; font-size: 16px; line-height: 1; padding-top: 4px; color: var(--kds-ic-warning); }
  .kds-row__mods-cmt .kds-row__mods-in { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 2px; }
  .kds-row__mods--cmt .kds-row__mod { font-size: 16px; line-height: 24px; letter-spacing: .5px; color: #d6d6d6; }
  /* Позиция набора, которая не готовится (напиток забирает сборщик) — без статуса приготовления */
  .kds-row--nocook { background: rgba(234, 120, 6, .12); }
  .kds-row__nocook { display: flex; align-items: center; gap: 4px; font-size: 12px; line-height: 16px; letter-spacing: .4px; color: #9e9e9e; margin-top: 0; }
  .kds-row__nocook .material-icons { font-size: 14px; line-height: 16px; color: var(--kds-ic-warning); }
  /* Плашка количества в «по блюдам» — 1:1 как в карточке заказа (`.kds-qty`):
     22/28 bold, r6, #E0E0E0, паддинг 0/4, высота 28, ширина по цифре (min 21) */
  .kds-dl-qty { flex: 0 0 auto; display: inline-flex; align-items: center; justify-content: center;
    min-width: 21px; height: 28px; padding: 0 4px; border-radius: 6px; background: #e0e0e0;
    color: #333; font-size: 22px; font-weight: 700; line-height: 28px; letter-spacing: .25px; text-align: center; }
  .kds-dl-star { flex: 0 0 auto; display: flex; color: var(--kds-ic-positive); }
  .kds-dl-chips { display: flex; flex-wrap: wrap; align-items: center; min-height: 28px; padding-left: 24px; }
  .kds-dl-chip { display: inline-flex; align-items: center; gap: 6px; padding: 0 12px;
    font-size: 18px; line-height: 24px; letter-spacing: .5px; color: #fff; white-space: nowrap; }
  .kds-dl-chip.is-neg { color: var(--kds-ic-negative); }
  .kds-dl-chip__qty { min-width: 19px; height: 24px; padding: 0 4px; border-radius: 6px; border: 1px solid currentColor;
    font-size: 18px; font-weight: 700; line-height: 22px; letter-spacing: .5px; text-align: center; }
  .kds-dl-comment { display: flex; align-items: flex-start; gap: 6px; padding: 4px 8px 0; border-top: 1px dashed #616161; }
  /* Иконка комментария — как в карточке заказа: 16 px, `padding-top: 4px`, чтобы центр иконки
     совпадал с центром первой строки текста 16/24 (жёлтая, `--kds-ic-warning`) */
  .kds-dl-comment .material-icons { font-size: 16px; line-height: 1; padding-top: 4px; color: var(--kds-ic-warning); }
  .kds-dl-comment__text { font-size: 16px; line-height: 24px; color: #d6d6d6; }
  .kds-dl-btn { flex: 0 0 52px; width: 52px; border: 0; border-radius: 8px; background: #3b3b43; color: #9e9e9e;
    display: flex; align-items: center; justify-content: center; }
  .kds-dl-btn .material-icons { font-size: 28px; }
  .kds-dl-btn.kds-btn--cancelled { background: #3b3b43; color: var(--kds-ic-negative); }
  .kds-dl-btn.kds-btn--ready { background: #3b3b43; color: var(--kds-ic-positive); }
  .kds-ditem { font-size: 12px; line-height: 16px; color: var(--kds-text-2); white-space: nowrap; }
  .kds-drow__sub { display: flex; align-items: center; gap: 8px; min-width: 0; flex-wrap: wrap; }
  /* Подпись связи модификатора — как счётчик «2 из 3 блюд»: 14/20, medium, #BDBDBD */
  .kds-drow__sub .kds-ditem,
  .kds-drow__sub .kds-dsep,
  .kds-drow__sub .kds-dlink { font-size: 12px; line-height: 16px; letter-spacing: .4px; font-weight: 500; color: #bdbdbd; }

  /* Группа набора по сценариям: заголовок без кнопки/статуса + компоненты строками с кнопками.
     Решение дизайнера 22.10.2026: подложка заголовка остаётся как была (#212121, r8);
     меняется только подпись видимости — она перенесена в строку названия, справа: «2 из 3 блюд». */
  .kds-cset { display: flex; flex-direction: column; gap: var(--ds-space-1x, 4px); }
  /* Шапка группы: подложка #212121, r8, паддинг 4/8; высота по контенту — 4 + 16 + 24 + 4 = 48 (с гостевой строкой) */
  .kds-cset__head { background: var(--kds-row); border-radius: 8px;
    padding: var(--ds-space-1x, 4px) var(--ds-space-2x, 8px); min-height: 0;
    display: flex; flex-direction: column; justify-content: center; gap: 0; min-width: 0; }
  .kds-cset__gline { display: flex; align-items: center; height: 16px; }
  /* Вторая строка шапки — под названием: иконка 20 + зазор 8 = 28 */
  .kds-cset__gline--sub { padding-left: 28px; }
  /* Шапка без второй строки (гость ушёл вправо) — высота по контенту: 4 + 24 + 4 = 32 */
  .kds-cset__head--tight { min-height: 0; }
  /* Шапка с той же высотой, что с гостевой строкой (48) — когда строки гостя нет, но высоту держим */
  .kds-cset__head--tall { min-height: 48px; }
  .kds-cset__name { display: flex; align-items: center; gap: var(--ds-space-2x, 8px); min-width: 0; flex: 0 1 auto;
    font-size: 20px; font-weight: 500; line-height: 24px; letter-spacing: .25px; color: #fff; }
  /* Пиктограмма набора — fastfood из Figma «Icons (New)» (инлайн-SVG, не шрифт Material Icons) */
  /* Иконка набора в заголовке группы — 20 px, как остальные иконки карточки,
     цвет — белый, как у названия набора (`--kds-text`) */
  .kds-cset__ico { flex: 0 0 20px; width: 20px; height: 20px; display: inline-flex; align-items: center; color: var(--kds-text); }
  .kds-cset__ico .kds-svg-ico { width: 20px; height: 20px; }
  .kds-cset__t { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* Комбо отменено целиком: заголовок и иконка набора — красные, компоненты — как отменённые строки */
  .kds-cset--neg .kds-cset__t { color: var(--kds-ic-negative); }
  .kds-cset--neg .kds-cset__ico { color: var(--kds-ic-negative); }
  /* Номер экземпляра рядом с названием — просто цифра в нейтральном бейдже */
  .kds-cset__inst, .kds-modsblk__inst { display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto;
    min-width: 28px; height: 24px; padding: 0 4px; border-radius: 8px; background: #333333;
    font-size: 16px; line-height: 24px; font-weight: 500; letter-spacing: .15px; color: #d6d6d6; margin-left: 0; white-space: nowrap; }
  /* Отличие карточки g-instances — нейтральная иконка набора в заголовке */
  .kds-cset--t20 .kds-cset__ico { color: var(--kds-ic-neutral); }
  /* Строки группы — с отступом 26 px и вертикальной полосой 2 px слева (решение дизайнера 22.10.2026):
     полоса от верха первой строки до низа последней, на 16 px от края карточки, строки сдвинуты на 10 px вправо */
  .kds-cset__rows { display: flex; flex-direction: column; gap: var(--ds-space-1x, 4px); margin-left: 26px; position: relative; }
  .kds-cset__rows::before { content: ''; position: absolute; left: -10px; top: 0; bottom: 0;
    width: 2px; border-radius: 2px; background: #4d4d4d; }
  /* Модификаторы уровня набора (g-modifier): блоком вместе после блюд,
     с отступом в один уровень относительно строк блюд */
  .kds-cset__submod { display: flex; flex-direction: column; gap: var(--ds-space-1x, 4px); margin-left: 26px; }
  /* Блок «моды готовятся отдельно» (g-modifier-sep, карточка 1): шапка — ряд по Figma 7664:13006
     «Text default»: иконка 20 + текст 16/24 Regular ls .5 белый, py 8, зазор 4; ниже — строки модов */
  .kds-modsblk { display: flex; flex-direction: column; gap: var(--ds-space-1x, 4px); }
  .kds-modsblk__head { display: flex; align-items: center; gap: 4px; padding: 8px 0; }
  .kds-modsblk__ico { display: inline-flex; align-items: center; justify-content: center; flex: 0 0 auto; color: var(--kds-text); }
  .kds-modsblk__ico .kds-svg-ico { width: 20px; height: 20px; }
  .kds-modsblk__title { min-width: 0; font-size: 18px; font-weight: 400; line-height: 24px; letter-spacing: .5px;
    color: #fff; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  /* Подпись справа в шапке блока — как «из: Холодный цех» на соседней карточке: 14/20 medium #BDBDBD */
  .kds-modsblk__cap { margin-left: auto; flex: 0 0 auto; white-space: nowrap;
    font-size: 14px; line-height: 20px; letter-spacing: .25px; font-weight: 500; color: #bdbdbd; }
  /* Строки модов — с отступом и вертикальной полосой, как строки блюд в группе набора */
  .kds-modsblk__rows { display: flex; flex-direction: column; gap: var(--ds-space-1x, 4px); margin-left: 26px; position: relative; }
  .kds-modsblk__rows::before { content: ''; position: absolute; left: -10px; top: 0; bottom: 0;
    width: 2px; border-radius: 2px; background: #4d4d4d; }

  /* ── Перенос чека: пунктир слева/справа/снизу, сверху открыт (24 px, как в макете) ── */
  .kds-transfer {
    display: flex; align-items: center; justify-content: center; height: 24px; padding: 0;
    border-bottom: 2px dashed var(--kds-line); border-left: 2px dashed var(--kds-line); border-right: 2px dashed var(--kds-line);
    border-radius: 0 0 4px 4px; font-size: 14px; line-height: 20px; letter-spacing: .5px; color: var(--kds-text-3);
  }
  .kds-transfer--top { height: 2px; border-top: 2px dashed var(--kds-line); border-left: 2px dashed var(--kds-line); border-right: 2px dashed var(--kds-line); border-bottom: 0; border-radius: 4px 4px 0 0; padding: 0; }

  /* ── Сокращение длинных названий + тултип полного названия ── */
  .kds-ellip { display: inline-block; max-width: 100%; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; vertical-align: bottom; }
  .kds-kit__name.kds-ellip { max-width: 100%; }
  .kds-dlink .kds-ellip { max-width: 300px; }
  .kds-tip {
    position: absolute; z-index: 30; display: none; pointer-events: none;
    max-width: 320px; padding: 8px 12px; border-radius: 8px;
    background: var(--kds-btn); color: #fff; font-size: 16px; line-height: 24px; letter-spacing: .25px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, .45);
  }

  /* ── Плакаты (пиктограммы / обоснование) ── */
  .kds-posters {
    position: absolute; top: 48px; left: 16px; right: 16px; bottom: 74px; z-index: 1;
    overflow: auto; display: flex; flex-direction: column; gap: 16px; align-items: stretch;
    scrollbar-width: thin; scrollbar-color: #616161 transparent;
  }
  .kds-posters::-webkit-scrollbar { width: 8px; height: 8px; }
  .kds-posters::-webkit-scrollbar-thumb { background: #616161; border-radius: 8px; }
  .kds-poster { background: var(--kds-surface); border-radius: 8px; padding: 20px 24px; max-width: 980px; width: 100%; }
  .kds-poster--row { display: flex; gap: 16px; align-items: stretch; }
  .kds-poster__cell { flex: 1; min-width: 0; background: var(--kds-row); border: 1px solid var(--kds-line); border-radius: 8px; padding: 20px 24px; display: flex; flex-direction: column; gap: 12px; align-items: flex-start; }
  .kds-poster__ico { font-size: 40px; color: var(--kds-ic-accent); }
  .kds-poster__ico--warn { color: var(--kds-ic-warning); }
  .kds-poster__ico--neutral { color: var(--kds-ic-neutral); display: inline-flex; align-items: center; }
  /* Иконка набора на постере fastfood — нейтральный цвет, как у иконок шапки карточки */
  .kds-poster__ico--muted { color: #616161; display: inline-flex; align-items: center; }
  .kds-poster__title { font-size: 20px; font-weight: 500; line-height: 28px; }
  .kds-poster__sub { font-size: 14px; line-height: 20px; color: var(--kds-text-3); }
  .kds-poster__list { margin: 0; padding-left: 20px; display: flex; flex-direction: column; gap: 8px; }
  .kds-poster__list li { font-size: 14px; line-height: 20px; color: var(--kds-text-3); }
  .kds-poster__list li b { color: #fff; font-weight: 500; }
  .kds-posters__note { font-size: 14px; line-height: 20px; color: var(--kds-text-2); max-width: 980px; width: 100%; padding: 0 4px; }

  /* ══════════ Работающий макет: элементы управления ══════════
     Всё, кроме статусов строк, взято из компонентов Figma:
     «Menu setting» (10106:75132) — меню показателей из шапки;
     «Menu header» 340×64 + «Menu content» 340×124 (7471:15466 / 7471:15467)
     и «Toogle mode» (7069:32810) — панель «Настройки». */
  .kds-tb-pick { border: 0; background: transparent; padding: 0; cursor: pointer; text-align: left; }
  .kds-tb-pick:active { opacity: .7; }
  .kds-tb-pick.is-open { color: var(--kds-ic-accent); }
  .kds-tb-pick.is-open .material-icons { color: var(--kds-ic-accent); }
  /* счётчики-фильтры: сами по себе кнопки, активный подчёркнут цветом без сдвига макета */
  .kds-tb-state { border: 0; background: transparent; padding: 0; cursor: pointer; }
  .kds-tb-state:active { opacity: .7; }
  .kds-tb-state.is-sel { box-shadow: 0 3px 0 currentColor; }
  .kds-tb-state b { font-weight: 500; }

  /* меню: контейнер 360, #333333, r12, рамка 1px #616161, пад 12/4, пункт 48 */
  .kds-menu { position: absolute; z-index: 30; display: none; width: 360px; padding: 12px 4px;
    background: #333333; border: 1px solid #616161; border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, .45); }
  .kds-menu.is-open { display: block; }
  .kds-menu--metrics { width: 360px; }
  .kds-menu__title { display: flex; align-items: center; gap: 8px; padding: 12px 0 12px 12px;
    font-size: 16px; font-weight: 400; line-height: 24px; letter-spacing: .5px; color: #fff; }
  .kds-menu__title .material-icons { font-size: 20px; width: 24px; text-align: center; color: #9e9e9e; }
  .kds-menu__div { height: 1px; background: #616161; margin: 0 0 8px; }
  .kds-menu__item { display: flex; align-items: center; gap: 8px; width: 100%; min-height: 48px;
    padding: 12px 0 12px 12px; border: 0; border-radius: 8px; background: transparent; text-align: left;
    white-space: nowrap; overflow: hidden;
    font-size: 16px; font-weight: 400; line-height: 24px; letter-spacing: .5px; color: #fff; }
  .kds-menu__ico { flex: 0 0 24px; width: 24px; height: 24px; display: flex; align-items: center; justify-content: center; }
  .kds-menu__ico .material-icons { font-size: 20px; }
  .kds-menu__ico .kds-svg-ico { width: 20px; height: 20px; }
  .kds-menu__item:active, .kds-menu__item.is-sel { background: rgba(255, 255, 255, .08); }

  /* панель «Настройки»: шапка 340×64 + контент 340×124 */
  .kds-menu--settings { width: 340px; padding: 12px 4px 8px; }
  .kds-set__head { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 0 8px 8px 12px; }
  .kds-set__title { font-size: 22px; font-weight: 500; line-height: 28px; letter-spacing: .25px; color: #fff; }
  .kds-set__body { display: flex; flex-direction: column; gap: 16px; padding: 8px 12px 12px; }
  .kds-set__row { display: flex; align-items: center; justify-content: space-between; gap: 12px; min-height: 44px; }
  .kds-set__label { font-size: 16px; font-weight: 400; line-height: 24px; letter-spacing: .5px; color: #fff; }
  /* Toogle mode 92×44: пад 4/6, r16, иконки 36×36 r16 */
  .kds-toggle { display: flex; gap: 8px; padding: 4px 6px; background: #121212; border-radius: 16px; }
  .kds-toggle__i { width: 36px; height: 36px; border: 0; border-radius: 16px; background: #424242; color: #fff;
    display: flex; align-items: center; justify-content: center; }
  .kds-toggle__i.is-on { background: #ffffff; color: #121212; }
  .kds-toggle__i .material-icons { font-size: 28px; }
  /* Масштаб: кнопки 44×44 r8 #121212, значение 57×40 */
  .kds-scale { display: flex; align-items: center; gap: 16px; }
  .kds-scale__btn { width: 44px; height: 44px; border: 0; border-radius: 8px; background: #121212; color: #fff;
    display: flex; align-items: center; justify-content: center; }
  .kds-scale__btn .material-icons { font-size: 28px; }
  .kds-scale__btn--reset { background: transparent; color: #9e9e9e; }
  .kds-scale__val { min-width: 57px; text-align: center; font-size: 16px; font-weight: 400; line-height: 40px; letter-spacing: .5px; color: #fff; }

  /* слой масштаба: содержимое экрана масштабируется внутри кадра 1280×800 */
  .kds-zoom { position: absolute; inset: 0; transform-origin: top left; }

  /* кнопка «Отменить» неактивна, пока нечего отменять */
  .kds-footer__btn:disabled { opacity: .38; cursor: default; }
  .kds-footer__btn:disabled:active { background: transparent; }
  /* ползунок полосы скролла можно тянуть */
  .kds-scrollstrip__thumb { cursor: grab; touch-action: none; }
  .kds-scrollstrip__thumb:active { cursor: grabbing; background: #4d4d4d; }

  /* ── Светлая тема — палитра из кадра «Светлая тема» (7014:4550 → 7091:54119) ── */
  .kds-view--light {
    --kds-bg: #ececec; --kds-surface: #ffffff; --kds-row: #f5f5f5; --kds-btn: #e0e0e0;
    --kds-line: #e0e0e0; --kds-text: #333333; --kds-text-2: #616161; --kds-text-3: #424242;
    --kds-ic-neutral: #757575;
  }
  .kds-view--light .kds-tb-list, .kds-view--light .kds-tb-state--clock, .kds-view--light .kds-card__brand,
  .kds-view--light .kds-card__ch, .kds-view--light .kds-row__name, .kds-view--light .kds-kit__name,
  .kds-view--light .kds-kit__comp, .kds-view--light .kds-footer__ver,
  .kds-view--light .kds-footer__total, .kds-view--light .kds-footer__btn,
  .kds-view--light .kds-poster__list li b, .kds-view--light .kds-card__num { color: #333333; }
  .kds-view--light .kds-footer__btn .material-icons { color: #333333; }
  .kds-view--light .kds-card__head { border-color: #e0e0e0; }
  .kds-view--light .kds-menu { background: #ffffff; border-color: #e0e0e0; }
  .kds-view--light .kds-menu__title, .kds-view--light .kds-menu__item, .kds-view--light .kds-set__label,
  .kds-view--light .kds-set__title, .kds-view--light .kds-scale__val { color: #333333; }
  .kds-view--light .kds-menu__div { background: #e0e0e0; }
  .kds-view--light .kds-menu__item:active, .kds-view--light .kds-menu__item.is-sel { background: #f5f5f5; }

  /* ── Стоп-лист (PB-8111): отдельный интерфейс вместо экрана заказов, каркас тот же ── */
  /* Область стоп-листа — уже кадра: по 80 слева и справа, низ — над футером (56) с зазором 16 */
  .kds-slist { position: absolute; top: 60px; left: 80px; right: 80px; bottom: 72px; z-index: 1; display: flex; flex-direction: column; }
  /* Полоса над списком: поле поиска + кнопки («Добавить позицию» — акцент, «Печать» — обводка) */
  /* Полоса действий — на всю ширину области списка */
  .kds-shead { display: flex; align-items: center; gap: var(--ds-space-2x, 8px);
    width: 100%; }
  /* Поле поиска — компонент Search ДС (.ds-search / __icon / __label / __right-icon / __clear):
     геометрию, отступы 12, зазор 8, радиус 12 и состояния берём у компонента,
     а цвета задаём через его же переменные значениями из палитры КДС */
  .kds-ssearch {
    --ds-color-search-background: transparent;
    --ds-color-search-default-border-color: var(--kds-line);
    --ds-color-search-hover-border-color: var(--kds-line);
    --ds-color-search-focus-border-color: var(--kds-ic-accent);
    --ds-color-search-default-text-color: var(--kds-text-3);
    --ds-color-search-focus-text-color: var(--kds-text-3);
    --ds-color-text-primary: var(--kds-text);
    --ds-color-icon-primary: var(--kds-text-2);
  }
  /* Поле в шапке: постоянная ширина, прижато к правому краю блока шапки */
  .kds-ssearch--tb { flex: 0 1 480px; min-width: 160px; width: 480px; margin-left: auto; }
  /* Кнопки полосы — всегда у правого края, даже если поле поиска не растягивается */
  .kds-shead__btns { margin-left: auto; }
  .kds-ssearch .material-icons { font-size: 20px; }
  /* Плейсхолдер поиска — ТА ЖЕ типографика, что у Input number в строке: 16/24 · 500,
     Empty — --kds-text-3, Focus — --kds-text-2 (Form-Field-Input ДС, fixes.css п.16) */
  .kds-ssearch .ds-search__label::placeholder { font-size: 16px; line-height: 24px; font-weight: 500;
    letter-spacing: .25px; color: var(--kds-text-3); opacity: 1; }
  .kds-ssearch .ds-search__label:focus::placeholder { color: var(--kds-text-2); }
  /* Голосовой поиск — второй слот right-icon (сенсорный терминал может быть без клавиатуры) */
  .kds-ssearch.is-listen { border-color: var(--kds-ic-negative); }
  .kds-ssearch.is-listen .kds-ssearch__mic { color: var(--kds-ic-negative); }
  .kds-ssearch.is-listen .kds-ssearch__mic .material-icons { animation: kds-mic 1s ease-in-out infinite; }
  @keyframes kds-mic { 0%, 100% { opacity: 1; } 50% { opacity: .45; } }
  /* Кнопки стоп-листа: цвета — ТОЛЬКО переменные КДС (--kds-ic-accent / negative / positive),
     заливка — в тоне кнопок строк --kds-btn; обводка — --kds-line */
  .kds-btn-acc, .kds-btn-acc-out, .kds-btn-out, .kds-btn-neg { display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    height: 48px; padding: 14px 16px; border-radius: 12px; flex: 0 0 auto;
    font-size: 14px; font-weight: 500; line-height: 20px; letter-spacing: .5px; text-transform: uppercase; white-space: nowrap; }
  /* Неактивная кнопка любого вида — приглушена и не реагирует (состояние Disable компонента Button) */
  .kds-btn[disabled], .kds-btn-out[disabled], .kds-btn-acc-out[disabled], .kds-btn-quiet[disabled],
  .kds-srow__clear[disabled], .kds-footer__btn[disabled] { opacity: .4; cursor: default; }
  .kds-btn-acc { border: 0; background: var(--kds-ic-accent); color: var(--kds-text); }
  .kds-btn-acc .material-icons { font-size: 20px; color: var(--kds-text); }
  /* Акцентная кнопка-обводка (Button/Outlined Accent): заливки нет, синий контур и синий текст */
  .kds-btn-acc-out { border: 1px solid var(--kds-ic-accent); background: transparent; color: var(--kds-ic-accent); }
  .kds-btn-acc-out .material-icons { font-size: 20px; color: var(--kds-ic-accent); }
  .kds-btn-acc-out:active { background: color-mix(in srgb, var(--kds-ic-accent) 12%, transparent); }
  .kds-btn-acc:active { filter: brightness(.92); }
  .kds-btn-acc[disabled] { opacity: .4; cursor: default; }
  /* Negative filled: действия, которые ведут к красному состоянию */
  .kds-btn-neg { border: 0; background: var(--kds-ic-negative); color: var(--kds-text); }
  .kds-btn-neg .material-icons { font-size: 20px; color: var(--kds-text); }
  .kds-btn-neg:active { filter: brightness(.92); }
  .kds-btn-neg[disabled] { opacity: .4; cursor: default; }
  .kds-btn-out { border: 1px solid var(--kds-line); background: transparent; color: var(--kds-text); }
  .kds-btn-out .material-icons { font-size: 20px; color: var(--kds-text); }
  .kds-btn-out:active, .kds-btn-out.is-on { background: color-mix(in srgb, var(--kds-text) 8%, transparent); }
  /* Текстовая кнопка: служебные действия списка — без обводки и заливки */
  .kds-btn-quiet { height: 48px; padding: 0 12px; border: 0; border-radius: 8px; background: transparent;
    display: inline-flex; align-items: center; justify-content: center; gap: 8px; flex: 0 0 auto;
    font-size: 14px; font-weight: 500; line-height: 20px; letter-spacing: .5px; text-transform: uppercase; color: var(--kds-text); white-space: nowrap; }
  .kds-btn-quiet:active { background: color-mix(in srgb, var(--kds-text) 8%, transparent); }
  .kds-btn-quiet.is-on { color: var(--kds-ic-accent); }
  /* Список позиций: ОДИН столбец по центру, каждая строка ужата вдвое по ширине (замечание заказчика:
     строки через весь экран — неудобно; без двух столбцов), вертикальный скролл со скрытой полосой */
  /* Список — шаг 4 между строками; блок категории — свой контейнер, поэтому отступы
     между блюдами и между группами задают контейнеры, а не заголовки */
  .kds-sbody-wrap { flex: 1 1 auto; min-height: 0; width: 100%;
    margin: var(--ds-space-4x, 16px) auto 0; display: flex; flex-direction: row; align-items: stretch;
    gap: var(--ds-space-2x, 8px); }
  .kds-sbody { flex: 1 1 auto; min-width: 0; overflow-y: auto; overflow-x: hidden;
    display: flex; flex-direction: column; gap: var(--ds-space-4x, 16px); align-items: stretch;
    scrollbar-width: none; }
  .kds-sbody::-webkit-scrollbar { display: none; }
  /* Скролл списка — инстанс Scroll ДС (ds-scroll--v) рядом со списком, как в макетах VIT;
     цвета — палитра КДС через переменные компонента */
  .kds-sbody-scroll { flex: none; align-self: stretch;
    --ds-color-scroll-default-background: transparent;
    --ds-color-scroll-default-knob-color: var(--kds-line);
    --ds-color-scroll-hover-background: rgba(255, 255, 255, .06); }
  .kds-sgrp { flex: 0 0 auto; display: flex; flex-direction: column; gap: var(--ds-space-1x, 4px); }
  .kds-sgrp > .kds-srow { width: 100%; }
  /* Строки НЕ сжимаются: при большом списке список прокручивается, а не плющит строки (52 остаются 52) */
  .kds-sbody > .kds-srow, .kds-sbody > .kds-snone { flex: 0 0 auto; }
  .kds-sbody .kds-srow { width: 100%; }
  /* Заголовок категории — на всю ширину списка */
  /* Заголовок категории — только текст, без собственных отступов */
  .kds-sgroup { flex: 0 0 auto; width: 100%;
    font-size: 12px; font-weight: 500; line-height: 16px; letter-spacing: .5px;
    text-transform: uppercase; color: var(--kds-text-2); }
  .kds-sbody::-webkit-scrollbar { width: 0; height: 0; }
  /* Строка позиции: коробка #212121 r8, высота 52, название 22/28 Medium #fff (ширину задаёт раскладка списка) */
  .kds-srow { background: transparent; }
  .kds-srow__top { display: flex; align-items: stretch; min-height: 52px; gap: var(--ds-space-4x, 16px); }
  /* Коробка блюда (#212121 r8): чекбокс + название. Input number — ЗА коробкой, в колонке значений */
  .kds-srow__box { flex: 1 1 auto; min-width: 0; display: flex; align-items: stretch;
    background: var(--kds-row); border-radius: 8px; overflow: hidden; }
  .kds-srow__main { flex: 1 1 auto; min-width: 0; padding: var(--ds-space-1x, 4px) var(--ds-space-2x, 8px);
    display: flex; flex-direction: row; align-items: center; gap: var(--ds-space-4x, 16px); cursor: pointer; }
  /* Зоны строки: название тянется, служебная подпись — справа, вплотную к блоку остатка */
  .kds-srow__namecol { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
  .kds-srow__meta { flex: 0 0 auto; min-width: 0; display: flex; align-items: center; justify-content: flex-end; }
  /* Служебный текст строки — Support text ДС: 16/24, второй цвет */
  .kds-srow__meta-t { font-size: 16px; line-height: 24px; letter-spacing: .25px; color: var(--kds-text-2); white-space: nowrap; }
  /* Причина отказа — красным (палитра КДС), чтобы отличалась от нейтральных подписей */
  .kds-srow__meta-t--danger { color: var(--kds-ic-negative); }
  /* У размера чекбокса нет — тот же отступ слева, что у названия блюда, иначе размер висит левее родителя */
  .kds-srow--sub .kds-srow__main { padding-left: calc(52px + var(--ds-space-2x, 8px)); }
  /* В узком кадре служебная подпись прячется — название важнее */
  .kds-view--narrow .kds-srow__meta { display: none; }
  .kds-srow__name { font-size: 22px; font-weight: 500; line-height: 28px; letter-spacing: .25px; color: var(--kds-text); white-space: nowrap;
    min-width: 0; overflow: hidden; text-overflow: ellipsis; }
  .kds-srow__cap { font-size: 12px; line-height: 16px; letter-spacing: .4px; color: var(--kds-text-2); }
  /* «Полный стоп» — после названия, мельче (16/24) и с отступами */
  .kds-sstop { flex: 0 0 auto; margin: 0 8px; font-size: 16px; font-weight: 500; line-height: 24px; letter-spacing: .4px;
    color: var(--kds-ic-negative); }
  /* Название + метка состояния — в одну строку, выровнены по НИЖНЕМУ краю (не по центру) */
  .kds-srow__l1 { display: flex; align-items: flex-end; gap: 4px; min-width: 0; }
  /* Полный стоп — состояние под названием, красным (как раньше красная подпись в строке) */
  .kds-srow__cap.is-stop { color: var(--kds-ic-negative); }  /* Чекбокс режима выбора — слева у строки */
  .kds-srow__check { flex: 0 0 52px; width: 52px; border: 0; background: transparent; color: var(--kds-text-2);
    display: flex; align-items: center; justify-content: center; }
  .kds-srow__check .material-icons { font-size: 28px; }
  .kds-srow__check.is-on { color: var(--kds-ic-accent); }
  /* Исключённую из меню позицию выбрать нельзя — чекбокс неактивен (состояние Disable) */
  .kds-srow__check[disabled] { opacity: .4; cursor: default; }
  /* Отмеченная строка — заливка 12% акцента (как тинт шапки заказа в базе --st-tint), без бордеров */
  .kds-srow.is-sel .kds-srow__box { background: rgba(68, 138, 255, .12); }
  /* Полный стоп — тинт статуса 12%, как шапка заказа (--st-tint) */
  .kds-srow.is-stop .kds-srow__box { background: rgba(255, 82, 82, .12); }
  .kds-srow__main:active { background: rgba(255, 255, 255, .08); }
  .kds-srow__check:active { background: rgba(255, 255, 255, .08); }
  /* Размеры позиции — как в Figma 10628:57825: отдельные строки-коробки 52 с отступом 24 слева
     (правая кромка по списку), название 22/28, остаток — своё поле в строке */
  /* Вложенный уровень — как в базе (kds-nest__rows): отступ 24 (--ds-space-6x), зазор 4 */
  .kds-sbody .kds-srow--sub { width: calc(100% - var(--ds-space-6x, 24px)); margin-left: var(--ds-space-6x, 24px); }
  /* Остаток — прямо в строке (заказчик 10.11.2026: «зачем лишние шаги»): вместо ✎ и диалога —
     поле 52 в тоне кнопок строки (#3b3b43 r8), число 22/28 справа, единица — рядом, ВНЕ поля
     (в Input ДС справа только иконочный слот, текстового суффикса нет) */
  .kds-srow__val { flex: 0 0 auto; display: flex; align-items: center; gap: 8px;
    padding-right: var(--ds-space-2x, 8px); }
  /* «Добавить» — отдельное действие строки внесения, отбито от блока остатка:
     8 у блока + 8 у кнопки = 16 от «шт» */
  .kds-srow__top > .kds-btn-acc { margin-left: var(--ds-space-2x, 8px); }
  /* Остаток: кнопки шага 52×52 как у кнопок строк базы + поле ДС Input (M, 48) между ними */
  .kds-srow__val .kds-btn { height: 52px; }
  /* Плейсхолдер 16/24 500 — состояния Form-Field-Input ДС (fixes.css, п.16):
     Empty — цвет лейбла (в тёмной палитре kds-text-3), Focus — приглушённый (kds-text-2).
     Одна типографика у поля в строке и у поля в цифровой панели */
  .kds-srow__num .ds-input__field::placeholder,
  .kds-numpad__field .ds-input__field::placeholder { font-size: 16px; line-height: 24px; font-weight: 500;
    color: var(--kds-text-3); opacity: 1; }
  .kds-srow__num .ds-input__field:focus::placeholder,
  .kds-numpad__field .ds-input__field:focus::placeholder { color: var(--kds-text-2); }
  /* Сброс значения — слот Element right у Input ДС: иконка 20, цель нажатия 48,
     видна только когда в поле есть значение (пустое поле показывает плейсхолдер) */
  .kds-srow__clear { width: 48px; height: 48px; margin: -12px -12px -12px 0; padding: 0;
    border: 0; background: transparent; color: var(--kds-text-2); display: none;
    align-items: center; justify-content: center; border-radius: 8px; }
  .kds-srow__clear .material-icons { font-size: 20px; }
  .kds-srow__clear:active { background: color-mix(in srgb, var(--kds-text) 8%, transparent); }
  .kds-srow__num:has(.ds-input__field:not(:placeholder-shown)) .kds-srow__clear { display: inline-flex; }
  /* Пустой слот значения у строк без поля — той же ширины, что блок остатка с единицей,
     чтобы правая кромка коробок была общей */
  /* Пустой слот у строк с размерами — ровно ширина блока значения, иначе поля не выстроены по одной сетке */
  .kds-srow__val--blank { width: 336px; }
  /* Поле шире: при цели 120 промахнуться мимо ввода и попасть в «×» было слишком легко */
  .kds-srow__val .ds-input { width: 152px; }
  /* Поле — в палитре КДС: тёмная коробка #212121 с обводкой #616161, число белое 22/28 700 */
  .kds-srow__val .ds-input__frame { width: 100%; background: var(--kds-row); border-color: var(--kds-line); }
  /* Тёмная заливка поля не должна зависеть от порядка подключения стилей ДС:
     правила с префиксом .kds-view перебивают любые светлые состояния Input */
  .kds-view .kds-srow__val .ds-input__frame,
  .kds-view .kds-numpad__field .ds-input__frame { background-color: var(--kds-row) !important; }
  .kds-view .ds-input__field { background-color: transparent !important; color: var(--kds-text);
    -webkit-text-fill-color: currentColor; caret-color: var(--kds-ic-accent); }
  /* Состояния поля тоже держим в палитре КДС — светлые состояния Input ДС сюда не проникают */
  .kds-view .kds-srow__val .ds-input__frame:hover,
  .kds-view .kds-srow__val .ds-input__frame:focus-within,
  .kds-view .kds-srow__val .ds-input__frame:has(.is-focus) { background-color: var(--kds-row) !important; }
  .kds-srow__val .ds-input__frame:hover { background: var(--kds-row); border-color: var(--kds-text-2); }
  .kds-srow__val .ds-input__frame:focus-within { background: var(--kds-row); border-color: var(--kds-ic-accent); }
  /* Экран-состояние «поле в фокусе»: тот же акцент, что и при реальном фокусе (§6 #6–8) */
  .kds-srow__val .ds-input__frame:has(.is-focus) { border-color: var(--kds-ic-accent); }
  /* Выделение значения — в палитре КДС: системный светлый highlight на тёмном давал белую плашку
     на секунду при смене экрана (значение выделяется автофокусом, §5.12.7) */
  .kds-view ::selection { background: rgba(68, 138, 255, .38); color: var(--kds-text); }
  /* Переход фона ДС (0,15 с) при перерисовке экрана давал светлую вспышку заливки поля */
  .kds-srow__val .ds-input__frame, .kds-numpad__field .ds-input__frame { transition: none; }
  /* Позиция исключена из меню: блок ввода недоступен целиком — приглушён, без реакции на наведение */
  .kds-view .kds-srow__val.is-off { opacity: .4; cursor: default; }
  .kds-view .kds-srow__val.is-off .kds-btn[disabled] { opacity: 1; }
