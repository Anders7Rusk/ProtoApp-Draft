  .kds-view .kds-srow__val.is-off .ds-input__frame,
  .kds-view .kds-srow__val.is-off .ds-input__frame:hover { border-color: var(--kds-line); }
  .kds-view .kds-srow__val.is-off .ds-input__field { cursor: default; }
  /* Само блюдо тоже в состоянии Disable: название приглушено, тап не подсвечивает строку.
     Красная причина остаётся читаемой — она и объясняет, почему строку нельзя внести */
  .kds-view .kds-srow__main.is-off { cursor: default; pointer-events: none; }
  .kds-view .kds-srow__main.is-off .kds-srow__name { opacity: .4; }
  .kds-view .kds-srow__main.is-off:active { background: transparent; }
  .kds-srow__val .ds-input--error .ds-input__frame { background: var(--kds-row); border-color: var(--kds-ic-negative); }
  /* Значение — крупно, 22/28 как плашка количества базы, а не 16/24 из десктопного Input.
     Одна анатомия у поля в строке и у поля ввода в цифровой панели */
  .kds-srow__val .ds-input__field, .kds-numpad__field .ds-input__field {
    font: 700 22px/28px 'Roboto', 'Helvetica Neue', Arial, sans-serif; letter-spacing: .25px; color: var(--kds-text); }
  .kds-srow__val .ds-input__field::placeholder,
  .kds-numpad__field .ds-input__field::placeholder { color: var(--kds-text-3); }
  .kds-srow__val .ds-input__field:focus::placeholder { color: var(--kds-text-2); }
  /* За скриншотом клавиатуры: показывать белый фон над полем */
  /* Экранная клавиатура — стандартная андроидная для планшета: четыре ряда клавиш 52,
     нижний ряд [?123] [,] [RU/EN] [пробел] [.] [↵]. Появляется по тапу в поле поиска:
     на терминале системной клавиатуры нет */
  .kds-kbd { position: absolute; left: 0; right: 0; bottom: 0; z-index: 15;
    display: flex; flex-direction: column; gap: 8px; padding: 8px;
    background: #212121; border-top: 1px solid var(--kds-line); }
  .kds-kbd[hidden] { display: none; }
  .kds-kbd__row { display: flex; gap: 6px; justify-content: center; }
  .kds-kbd__k { flex: 1 1 0; min-width: 0; height: 52px; padding: 0 4px; border: 0; border-radius: 8px;
    background: var(--kds-btn); color: var(--kds-text);
    font: 400 20px/28px 'Roboto', 'Helvetica Neue', Arial, sans-serif; letter-spacing: .5px;
    display: flex; align-items: center; justify-content: center; }
  .kds-kbd__k:active { background: #4a4a52; }
  .kds-kbd__k--act { flex: 1.6 1 0; background: #2e2e33; color: var(--kds-text-3); font-size: 16px; }
  .kds-kbd__k--on { background: #fff; color: #121212; }
  .kds-kbd__k--enter { flex: 1.6 1 0; background: var(--kds-ic-accent); color: #fff; }
  .kds-kbd__k--space { flex: 4.2 1 0; }
  .kds-kbd__k .material-icons { font-size: 22px; }
  .kds-kbd__hint { padding: 0 8px; font: 400 12px/16px 'Roboto', 'Helvetica Neue', Arial, sans-serif;
    letter-spacing: .5px; color: var(--kds-text-2); }
  /* Цифровая панель — та же, что была в панели остатка: поверхность меню (#333, r12, рамка #616161,
     тень), клавиши 52 с обводкой 1px #616161 r12, три равные колонки, «Готово» во всю ширину.
     Всегда по центру кадра */
  .kds-numpad { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); z-index: 5;
    width: 560px; padding: 16px 24px; display: flex; flex-direction: column; gap: 8px;
    background: #333333; border: 1px solid var(--kds-line); border-radius: 12px;
    box-shadow: 0 8px 24px rgba(0, 0, 0, .45); }
  .kds-numpad[hidden] { display: none; }
  /* Отступ до кнопок: поле → сетка 8 (gap панели) + 8 = 16, сетка → «Готово» остаётся 8 */
  .kds-numpad__grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: var(--ds-space-2x, 8px); }
  .kds-numpad__k { height: 60px; padding: 0; border: 1px solid var(--kds-line); border-radius: 12px;
    background: transparent; color: #fff; display: flex; align-items: center; justify-content: center;
    font: 500 24px/32px 'Roboto', 'Helvetica Neue', Arial, sans-serif; }
  .kds-numpad__k .material-icons { font-size: 26px; color: #fff; }
  .kds-numpad__k:active { background: rgba(255, 255, 255, .08); }
  /* Действия панели: «Отмена» (обводка) и «Готово» (акцент) в один ряд, по половине ширины */
  .kds-numpad__acts { display: flex; gap: var(--ds-space-2x, 8px); margin-top: var(--ds-space-2x, 8px); }
  .kds-numpad__cancel, .kds-numpad__done { flex: 1 1 0; width: auto; margin-top: 0; height: 56px; }
  /* Панель по центру и закрывает строку — поэтому вводимое значение видно в ней самой: название позиции,
     поле в состоянии фокуса (тот же Input M) и единица */
  .kds-numpad__head { display: flex; flex-direction: column; gap: var(--ds-space-2x, 8px); }
  /* Название позиции — Header S (20/28 500), единица — рядом в той же строке, тот же шрифт,
     только приглушённым цветом */
  /* Название позиции и единица — одна строка, один шрифт и один цвет: «Фокачча, шт» */
  .kds-numpad__title { display: flex; align-items: baseline; gap: 4px; min-width: 0; }
  .kds-numpad__name, .kds-numpad__unit { font-size: 20px; line-height: 28px; font-weight: 500;
    letter-spacing: .25px; color: var(--kds-text); }
  .kds-numpad__name { flex: 0 1 auto; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .kds-numpad__name::after { content: ','; }
  .kds-numpad__unit { flex: 0 0 auto; }
  .kds-numpad__disp { display: flex; align-items: center; gap: 8px; }
  .kds-numpad__field { flex: 1 1 auto; min-width: 0; }
  .kds-numpad__field .ds-input { width: 100%; }
  /* поле в фокусе — акцентная обводка, как у Input M в состоянии Focus */
  .kds-numpad__field .ds-input__frame { background: var(--kds-row); border-color: var(--kds-ic-accent); }
  /* поле только показывает ввод — на себя фокус не забирает */
  .kds-numpad__field .ds-input__field { pointer-events: none; }
  /* Уровень ограничения переключается не в строке блюда — служебного сегмент-контрола в блоке
     позиции нет; показ размеров задаёт экран */
  /* Единица — колонка постоянной ширины (по самому длинному «порц»), текст мельче значения:
     16/24, как Support text ДС, чтобы не спорить с числом 22/28 */
  .kds-srow__unit { flex: 0 0 auto; min-width: 48px;
    font: 400 16px/24px 'Roboto', 'Helvetica Neue', Arial, sans-serif; letter-spacing: .25px;
    color: var(--kds-text-2); white-space: nowrap; }
  /* Ошибка ввода — подпись под строкой (Support/Error text ДС), строка растёт только в ошибке */
  .kds-srow__err { display: none; padding: 0 12px 8px 60px;
    font-size: 16px; line-height: 24px; letter-spacing: .25px; color: var(--kds-ic-negative); }
  .kds-srow__err.is-on { display: block; }
  /* Крестики закрытия в диалогах — цель нажатия 52 (видимые 24 + невидимые 14 вокруг), правило КДС */
  .kds-sconfirm__head .kds-iconbtn::after { inset: -14px; }
  /* Пустой стоп-лист */
  /* Пустое состояние — по центру области списка внутри рамки: фон прозрачный и не ловит тапы */
  .kds-sempty { flex: 1 1 auto; min-height: 0; position: relative; top: auto; bottom: auto; left: auto; right: auto;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 8px;
    pointer-events: none; }
  .kds-sempty > * { pointer-events: auto; }
  .kds-sempty__t { font-size: 22px; font-weight: 500; line-height: 28px; color: var(--kds-text); }
  .kds-sempty__d { font-size: 16px; line-height: 24px; letter-spacing: .25px; color: var(--kds-text-3); margin-bottom: 8px; }
  /* Поиск ничего не нашёл */
  .kds-snone { padding: 24px 16px; text-align: center; font-size: 16px; line-height: 24px; letter-spacing: .25px; color: var(--kds-text-2); }
  /* Шапка экрана стоп-листа: «К заказам» — кнопка высотой 52 в том же виде, что кнопки футера
     (заливка --kds-btn, без обводки, белый текст). Место — шапка слева (ТЗ §5.2), не переносим. */
  .kds-sl-back { position: relative; display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    height: 52px; padding: 0 16px; border: 1px solid transparent; border-radius: 12px; background: var(--kds-btn);
    color: var(--kds-text); font-style: normal; font-weight: 500; font-size: 14px; line-height: 20px; letter-spacing: .5px;
    text-transform: uppercase; white-space: nowrap; cursor: pointer; }
  .kds-sl-back .material-icons { flex: 0 0 20px; width: 20px; height: 20px; font-size: 20px; color: var(--kds-text); }
  .kds-sl-back:active { filter: brightness(1.15); }
  /* Шапка, в которой стоит кнопка 52, сама выравнивается по ней (базовая 44 — под текстовые пункты) */
  .kds-zoom:has(.kds-sl-back) .kds-topbar { height: 68px; padding: 8px 16px; }
  /* От линии-разделителя до полосы кнопок — 16 */
  .kds-zoom:has(.kds-sl-back) .kds-slist { top: 93px; }
  /* В узком/мобильном кадре подпись не прячем — иначе от кнопки остаётся один значок без рамки */
  .kds-view--mob .kds-sl-back { padding: 0 12px; }
  .kds-view--mob .kds-sl-back [data-val] { display: inline; }
  /* Заголовок и группа — в два ряда: подпись группы стоит под названием экрана */
  .kds-sl-title { display: flex; flex-direction: column; align-items: flex-start; justify-content: center; min-width: 0; }
  .kds-sl-title__t { font-size: 16px; font-weight: 500; line-height: 24px; letter-spacing: .5px; color: var(--kds-text); white-space: nowrap; }
  .kds-sl-title__s { font-size: 16px; line-height: 24px; letter-spacing: .5px; color: var(--kds-text-2); white-space: nowrap; }
  .kds-sl-right { flex: 0 0 auto; display: flex; align-items: center; gap: 16px; margin-left: auto; }
  /* Разделитель шапки и контента — компонент Divider ДС (Size M, 1 px) цветом палитры КДС.
     Визуально от кнопок шапки и до кнопок списка — по 16: 8 даёт нижний паддинг шапки */
  .kds-tb-div { position: absolute; left: 0; right: 0; top: calc(100% + var(--ds-space-2x, 8px));
    --ds-color-divider-solid-default-color: var(--kds-btn); }
  /* В режиме выбора полоса над списком замещает поиск: счётчик + действия рядом с чекбоксами */
  .kds-shead__act { flex: 1 1 auto; min-width: 0; display: flex; align-items: center; gap: var(--ds-space-2x, 8px); }
  /* Действия полосы: «Выбрать все» у левого края, главное действие — у правого */
  .kds-shead__btns { flex: 1 1 auto; display: flex; align-items: center; justify-content: space-between; gap: var(--ds-space-2x, 8px); }
  /* Группа справа: «Печать» и «Добавить позицию» (главное действие — крайнее справа) */
  .kds-shead__right { display: flex; align-items: center; gap: var(--ds-space-2x, 8px); margin-left: auto; }

    function slPlur(n) {
      var m = Math.abs(n) % 100, m1 = m % 10;
      if (m > 10 && m < 20) return 'позиций';
      if (m1 === 1) return 'позиция';
      if (m1 >= 2 && m1 <= 4) return 'позиции';
      return 'позиций';
    }
    /* В футере на экране внесения — счётчик стоп-листа, а не списка доступных позиций */

      return slCount();
    }

      if (m1 >= 2 && m1 <= 4) return 'размера';
      return 'размеров';
    }

    /* Размеры рендерятся отдельными строками блюда в slRowHtml — отдельной функции нет */
    /* ── Сохранение остатка из строки: пусто — ограничения нет, 0 — полный стоп, число — остаток.
       Enter и уход из поля сохраняют сразу — без кнопок и диалогов (заказчик 10.11.2026) ── */
    function slRerender() {
      var bodyEl = RT.view && RT.view.querySelector('[data-sl-body]');

    function slCommit(inp) {

      /* Один и тот же ввод сохраняем ровно один раз: при перерисовке строки браузер

      if (inp.__slDone) return false;

      slRowErr(inp, false);
      if (RT.sl.addMode) {

        inp.value = pr.val === 0 ? '0' : fmtRest(pr.val);

        if (si != null) {

          if (!it.sizes.some(function (s) { return s.stop || s.rest; })) slDropItem(i);
        } else {

    /* Общая кнопка «Добавить в стоп» на экране внесения: вносит все строки, где задано количество.

    function slAddFilled() {
      if (!RT.view || !RT.sl || !RT.sl.addMode) return;
      var added = 0, last = '', failed = 0;
      Array.prototype.forEach.call(RT.view.querySelectorAll('.kds-sbody [data-sl-row]'), function (r) {
        var inp = r.querySelector('[data-sl-in]');
        if (!inp) return;
        var pr = parseRest(inp.value);
        if (!pr.ok || pr.empty) return;
        if (r.querySelector('[data-sl-fail]')) { failed++; return; }
        var name = r.getAttribute('data-sl-name') || '';
        var un = r.querySelector('.kds-srow__unit');

      if (!added) {

        return;
      }
      render('list');
      slBanner('Добавлено в стоп-лист: ' + (added === 1 ? last : added) +

    /* Общая кнопка активна, когда хотя бы у одной строки задано количество */
    function slSyncAddBtn() {

      if (!btns.length) return;
      var any = Array.prototype.some.call(RT.view.querySelectorAll('.kds-sbody [data-sl-row] [data-sl-in]'), function (i) {
        if (i.disabled) return false;

        return pr.ok && !pr.empty;

      var valEl = padEl.querySelector('[data-sl-pad-val]');
      if (valEl && valEl.value !== v) valEl.value = v;
      var nameEl = padEl.querySelector('[data-sl-pad-name]');
      if (nameEl) nameEl.textContent = (RT.sl && RT.sl.padName) || '';
      var unitEl = padEl.querySelector('[data-sl-pad-unit]');
      if (unitEl) unitEl.textContent = (RT.sl && RT.sl.padUnit) || '';

    function slPadKey(k) {
      var inp = RT.sl && RT.sl.padInp;
      if (!inp) return;
      if (k === 'done') {
        var ok = slCommit(inp);
        if (!ok) return;                      /* ошибка осталась на месте — панель не закрываем */
        slPadHide();
        inp.blur();
        return;
      }
      /* Отмена: закрыть панель и вернуть прежнее значение — ввод не применяется */
      if (k === 'cancel') {
        var orig = RT.sl && RT.sl.padOrig != null ? RT.sl.padOrig : '';

        inp.value = orig;
        slRowErr(inp, false);
        inp.dispatchEvent(new Event('input', { bubbles: true }));
        slPadHide();
        inp.blur();

      }
      var v = String(inp.value == null ? '' : inp.value);

      } else v = v + k;

    /* ── Экранная клавиатура поиска: стандартная андроидная раскладка планшета ──

    var SL_KBD_ROWS = {
      ru: [
        ['й','ц','у','к','е','н','г','ш','щ','з','х','ъ'],
        ['ф','ы','в','а','п','р','о','л','д','ж','э'],
        ['Shift','я','ч','с','м','и','т','ь','б','ю','Backspace'],

        ['a','s','d','f','g','h','j','k','l'],
        ['Shift','z','x','c','v','b','n','m','Backspace'],

        ['-','/',':',';','(',')','₽','&','@','"'],

        ['ABC',',','Space','.','Enter']

    function slKbdEl() { return RT.view ? RT.view.querySelector('[data-sl-kbd]') : null; }
    function slKbdRowHtml(row, layer, shift) {

        if (k === 'Shift') return '<button class="kds-kbd__k kds-kbd__k--act' + (shift ? ' kds-kbd__k--on' : '') + '" type="button" data-sl-kb="Shift" aria-label="Заглавные"><span class="material-icons">keyboard_capslock</span></button>';
        if (k === 'Backspace') return '<button class="kds-kbd__k kds-kbd__k--act" type="button" data-sl-kb="Backspace" aria-label="Стереть"><span class="material-icons">backspace</span></button>';

    function slKbdKey(k) {

      if (!s || !RT.sl) return;
      var layer = RT.sl.kbLayer || 'ru';
      if (k === 'Enter') { slKbdHide(); s.blur(); return; }
      if (k === 'Shift') { RT.sl.kbShift = !RT.sl.kbShift; slKbdRender(); return; }

    /* Шаг остатка кнопками стрелок ДС: шаг 1, диапазон ТЗ 0…999,999 */    function slStep(inp, d) {

      if (RT.sl && RT.sl.addMode) {

        inp.dispatchEvent(new Event('input', { bubbles: true }));

      }

    }
    /* ── Голосовой поиск: на сенсорном терминале без клавиатуры название можно назвать ── */
    function slMic() {
      if (!RT.view) return;
      var field = RT.view.querySelector('.kds-ssearch');
      var inp = RT.view.querySelector('[data-sl-search]');
      if (!inp) return;
      var S = window.SpeechRecognition || window.webkitSpeechRecognition;
      if (!S) {
        slBanner('Голосовой ввод недоступен на этом терминале — введите название с клавиатуры');
        return;
      }
      /* Повторный тап по микрофону — остановить прослушивание */
      if (RT.slRec) {
        try { RT.slRec.stop(); } catch (err) {}
        RT.slRec = null;
        if (field) field.classList.remove('is-listen');
        return;
      }
      var rec = new S();
      rec.lang = 'ru-RU';
      rec.interimResults = true;
      rec.continuous = false;
      rec.maxAlternatives = 1;
      RT.slRec = rec;
      if (field) field.classList.add('is-listen');
      slBanner('Говорите название позиции');
      rec.onresult = function (ev) {
        var txt = '';
        for (var i = ev.resultIndex; i < ev.results.length; i++) txt += ev.results[i][0].transcript;
        inp.value = txt;
        RT.sl.q = txt.trim();
        applySlFilter();
      };
      rec.onerror = function (ev) {
        if (field) field.classList.remove('is-listen');
        RT.slRec = null;
        var denied = ev && (ev.error === 'not-allowed' || ev.error === 'service-not-allowed');

          : 'Не удалось распознать речь — назовите позицию ещё раз');
      };
      rec.onend = function () {
        if (field) field.classList.remove('is-listen');
        RT.slRec = null;
      };
      try { rec.start(); } catch (err) {
        RT.slRec = null;
        if (field) field.classList.remove('is-listen');
        slBanner('Голосовой ввод недоступен на этом терминале — введите название с клавиатуры');
      }
    }

    /* Полоса Scroll ДС — длина и позиция ползунка по списку (как DSPatterns.scrollSync):
       минимум 24, колесо над полосой крутит список, ползунок тянется мышью */
    function slScrollSync() {
      if (!RT.view) return;
      var list = RT.view.querySelector('[data-sl-body]');
      var strip = RT.view.querySelector('.kds-sbody-scroll');
      if (!strip) return;
      /* Пустой стоп-лист: списка нет — полосы прокрутки на этом экране быть не может */
      if (!list) { strip.hidden = true; return; }
      var can = list.scrollHeight > list.clientHeight + 1;
      strip.hidden = !can;
      if (!can) return;
      var track = strip.querySelector('.ds-scroll__background');
      var knob = strip.querySelector('.ds-scroll__knob');
      if (!track || !knob) return;
      var trackH = track.clientHeight;
      var knobH = Math.max(24, Math.round(trackH * list.clientHeight / list.scrollHeight));
      var maxTop = trackH - knobH;
      var ratio = list.scrollTop / Math.max(1, list.scrollHeight - list.clientHeight);
      knob.style.height = knobH + 'px';
      knob.style.marginTop = Math.round(maxTop * ratio) + 'px';
    }
    /* Крестик поиска виден только при введённом тексте */
    function syncSlClear() {
      if (!RT.view) return;
      var inp = RT.view.querySelector('[data-sl-search]');
      var btn = RT.view.querySelector('[data-sl-sclear]');
      if (inp && btn) btn.style.display = inp.value ? '' : 'none';
    }

      if (!RT.view || !RT.sl) return;

      if (bodyEl) {
        if (slData().length) bodyEl.innerHTML = slRowsHtml(slData());
        else bodyEl.outerHTML = slEmptyHtml();

      syncMass();
      applySlFilter();
      syncSl();
      slScrollSync();
      slPersist();

    /* Отметка — точечно, без перерисовки списка: список не дёргается */
    function toggleSlCheck(i) {
      var cur = slData()[+i];
      if (cur && cur._fail) return;   /* исключённую из меню позицию выбрать нельзя (§5.10 п.5) */
      RT.sl.checks[i] = !RT.sl.checks[i];
      /* отметка — на всю позицию: крашится и её строка, и все строки размеров */
      var rows = RT.view ? RT.view.querySelectorAll('[data-sl-row="' + i + '"]') : [];
      Array.prototype.forEach.call(rows, function (row) { row.classList.toggle('is-sel', !!RT.sl.checks[i]); });
      var row = RT.view && RT.view.querySelector('[data-sl-row="' + i + '"]');
      if (row) {
        var btn = row.querySelector('[data-sl-check]');
        var ic = btn && btn.querySelector('.material-icons');
        if (ic) ic.textContent = RT.sl.checks[i] ? 'check_box' : 'check_box_outline_blank';
        if (btn) btn.classList.toggle('is-on', RT.sl.checks[i]);
      }
      syncMass();
    }
    function syncMass() {
      if (!RT.view) return;
      var n = slChecked().length;
      /* Плашка массовых действий показывается только при отмеченных строках (в варианте A её нет) */
      var massEl = RT.view.querySelector('[data-sl-mass]');
      if (massEl) massEl.hidden = (n === 0) || !!RT.cfg.massInHead;
      if (RT.layer) RT.layer.classList.toggle('is-sel', n > 0);
      syncSl();
      /* Вариант 1: действия при выборе — в шапке полосы, плашки нет; «Добавить позицию» и «Выбрать все» уступают место */
      var headMass = RT.view.querySelector('[data-sl-head-mass]');
      if (headMass) headMass.hidden = n === 0;
      /* Пока видна плашка массовых действий — действует только она: остальные кнопки экрана
         неактивны (галочки и шевроны остаются живыми, иначе выбор не изменить).
         Снимаем блокировку только с тех кнопок, которые заблокировали мы сами (data-sl-lock):
         кнопка, отключённая своим правилом («Печать» на пустом списке), остаётся отключённой */
      /* Блокировка живёт ровно столько, сколько видна плашка: сняли выбор — всё снова доступно.
         На экране внесения не блокируем: там сначала выбирают позиции, потом задают им количество */
      var lockOthers = !(RT.sl && RT.sl.addMode) && n > 0 && !(RT.cfg && RT.cfg.massInHead);
      Array.prototype.forEach.call(RT.view.querySelectorAll('.kds-slist button, .kds-footer button'), function (b) {
        if (b.closest('[data-sl-mass]')) return;
        if (b.hasAttribute('data-sl-check') || b.hasAttribute('data-sl-fold')) return;
        if (lockOthers) {
          if (!b.disabled) { b.disabled = true; b.setAttribute('data-sl-lock', ''); }
        } else if (b.hasAttribute('data-sl-lock')) {
          b.disabled = false;
          b.removeAttribute('data-sl-lock');
        }
      });
      /* В режиме выбора экранная клавиатура не нужна — убираем, чтобы не висела поверх плашки */
      if (lockOthers) slKbdHide();
    }
    /* «Выбрать все»: отметить видимые позиции; если видимые уже отмечены — снять с них выбор */
    function slSelectAll() {
      /* В варианте с действиями в шапке кнопка работает как выход из выбора */
      if (RT.cfg && RT.cfg.massInHead && slChecked().length) {
        RT.sl.checks = {};
        refreshSl();
        return;
      }
      var vis = slVisibleIdx();
      var full = vis.length > 0 && vis.every(function (k) { return RT.sl.checks[k]; });
      var checks = {};
      Object.keys(RT.sl.checks).forEach(function (k) { if (RT.sl.checks[k]) checks[k] = true; });
      if (full) vis.forEach(function (k) { delete checks[k]; });
      else vis.forEach(function (k) { checks[k] = true; });
      RT.sl.checks = checks;
      refreshSl();
    }
    function parseRest(v) {
      var s = String(v == null ? '' : v).trim();
      if (!s) return { ok: true, empty: true };
      if (!/^\d+([.,]\d+)?$/.test(s)) return { ok: false };
      var n = parseFloat(s.replace(',', '.'));
      if (isNaN(n) || n < 0) return { ok: false };
      if (n !== 0 && (n < 0.001 || n > 999.999)) return { ok: false };
      var dec = s.split(/[.,]/)[1];
      if (dec && dec.length > 3) return { ok: false };
      return { ok: true, val: n };
    }
    function fmtRest(v) {
      if (v === 0) return '0';
      return String(v).indexOf('.') !== -1 ? String(v).replace('.', ',') : String(v);
    }
    /* У позиции есть действующее ограничение? (с размерами — если ограничен хотя бы один размер) */
    function slRestricted(it) {
      if (!it) return false;
      if (it.stop || it.rest) return true;
      return !!(it.sizes && it.sizes.some(function (sz) { return sz.stop || sz.rest; }));
    }
    function slMass(k) {
      var items = slData();
      var checked = slChecked().map(Number);
      if (k === 'wipe') { openSlConfirm(); return; }
      /* Множественное внесение: вносим выбранные строки одним действием.
         Остаток — из поля строки; пустое поле = полный стоп (проверено ТЗ: массовый полный стоп) */
      if (k === 'addsel') {
        var live = slLiveItems();
        checked.slice().sort(function (a, b) { return a - b; }).forEach(function (i) {
          var it = items[i];
          if (!it || it._fail) return;   /* исключённые из меню не вносятся (§5.10 п.5) */
          var inp = RT.view && RT.view.querySelector('[data-sl-in="' + i + '"]');
          var pr = inp ? parseRest(inp.value) : { ok: true, empty: true };
          var row = { name: it.name, unit: it.unit || 'шт' };
          if (pr.ok && !pr.empty && pr.val > 0) row.rest = fmtRest(pr.val);
          else row.stop = true;
          live.push(row);
        });
        RT.sl.checks = {};
        render('list');
        slBanner('Добавлено в стоп-лист: ' + checked.length);
        return;
      }
      if (k === 'stop') {
        checked.forEach(function (i) {
          var it = items[i];
          if (!it) return;
          if (it.sizes && it.sizes.length) it.sizes.forEach(function (sz) { sz.stop = true; sz.rest = ''; });
          else { it.stop = true; it.rest = ''; }
        });
        RT.sl.checks = {};
        refreshSl();
        /* Результат массового действия — как в §3.5 ТЗ */
        slBanner('В стопе: ' + checked.length);
        return;
      }
      if (k === 'clear') {
        var done = 0, skipped = 0;
        checked.forEach(function (i) {
          if (!slRestricted(items[i])) { skipped++; return; }
          done++;
        });
        var removed = checked.filter(function (i) { return slRestricted(items[i]); })
          .sort(function (a, b) { return b - a; });
        removed.forEach(function (i) {
          items.splice(i, 1);
        });
        RT.sl.checks = {};
        RT.sl.folds = {};
        refreshSl();
        slBanner('Снято ограничений: ' + done + (skipped ? ' · пропущено: ' + skipped + ' (не было ограничения)' : ''));
        return;
      }
    }
    function openSlConfirm() {
      var d = RT.view && RT.view.querySelector('[data-sl-confirm]');
      if (d) d.classList.add('is-open');
    }
    function closeSlConfirm() {
      var d = RT.view && RT.view.querySelector('[data-sl-confirm]');
      if (d) d.classList.remove('is-open');
    }
    function slConfirm(a) {
      closeSlConfirm();
      if (a === 'yes') {
        /* Очистка всего стоп-листа — глобальная: чистим и живой список, с какого бы экрана её ни открыли */
        SLITEMS = [];
        slData().length = 0;
        RT.sl.checks = {};
        RT.sl.folds = {};

    }
    function bindSl(view) {
      /* Полоса Scroll следует за прокруткой списка; колесо над полосой и перетаскивание ползунка — тоже */
      var slBodyEl = view.querySelector('[data-sl-body]');
      var slStripEl = view.querySelector('.kds-sbody-scroll');
      if (slBodyEl) slBodyEl.addEventListener('scroll', slScrollSync);
      if (slStripEl && !slStripEl.__slWired) {
        slStripEl.__slWired = true;
        slStripEl.addEventListener('wheel', function (e) {
          var body = view.querySelector('[data-sl-body]');
          if (!body) return;
          body.scrollTop += e.deltaY;
          slScrollSync();
          e.preventDefault();
        }, { passive: false });
        slStripEl.addEventListener('mousedown', function (e) {
          var knob = slStripEl.querySelector('.ds-scroll__knob');
          var track = slStripEl.querySelector('.ds-scroll__background');
          var body = view.querySelector('[data-sl-body]');
          if (!knob || !track || !body || e.target !== knob) return;
          e.preventDefault();
          var startY = e.clientY, startTop = body.scrollTop;
          var range = Math.max(1, track.clientHeight - knob.offsetHeight);
          var max = body.scrollHeight - body.clientHeight;
          function move(ev) {
            body.scrollTop = startTop + (ev.clientY - startY) * max / range;
            slScrollSync();
          }
          function up() {
            document.removeEventListener('mousemove', move);
            document.removeEventListener('mouseup', up);
          }
          document.addEventListener('mousemove', move);
          document.addEventListener('mouseup', up);
        });
      }
      var search = view.querySelector('[data-sl-search]');
      if (search) {
        search.addEventListener('input', function () { RT.sl.q = search.value.trim(); applySlFilter(); syncSlClear(); });
        search.addEventListener('keydown', function (e) {
          if (e.key === 'Escape') { search.value = ''; RT.sl.q = ''; applySlFilter(); syncSlClear(); }
        });
        syncSlClear();
      }
      view.addEventListener('focusin', function (e) {
        /* Тап в поле поиска — экранная клавиатура: на терминале системной нет */
        if (e.target && e.target.hasAttribute && e.target.hasAttribute('data-sl-search')) slKbdShow();
        /* Тап по полю — открываем цифровую панель: на сенсорном терминале клавиатуры нет */
        if (e.target && e.target.hasAttribute && e.target.hasAttribute('data-sl-in')) {
          RT.sl.padInp = e.target;
          RT.sl.padOrig = e.target.value;      /* «Отмена» вернёт это значение */
          var rowEl = e.target.closest ? e.target.closest('.kds-srow') : null;
          var nmEl = rowEl && rowEl.querySelector('.kds-srow__name');
          var unEl = rowEl && rowEl.querySelector('.kds-srow__unit');
          RT.sl.padName = nmEl ? nmEl.textContent.replace(/s+/g, ' ').trim() : '';
          RT.sl.padUnit = unEl ? unEl.textContent.trim() : '';
          var padEl = view.querySelector('[data-sl-numpad]');
          if (padEl) { padEl.hidden = false; slPadSync(); }
          /* на десктопе заодно всё значение выделено — удобно перепечатать (§5.12.7) */
          if (!(window.matchMedia && window.matchMedia('(pointer: coarse)').matches)) e.target.select();
        }
      });
      /* Ввод остатка в строке: ведущие нули не копятся, ошибка — сразу под строкой */
      view.addEventListener('input', function (e) {
        var inp = e.target && e.target.closest ? e.target.closest('[data-sl-in]') : null;
        if (!inp) return;
        inp.__slDone = false;                     /* новое значение — новый цикл сохранения */
        var v = String(inp.value);
        var norm = v.replace(/^0+(?=\d)/, '');
        if (norm.length > 9) norm = norm.slice(0, 9);
        if (norm !== v) inp.value = norm;
        slRowErr(inp, inp.value !== '' && !parseRest(inp.value).ok);
        slSyncSteps();
        slSyncAddBtn();
      });
      /* Уход из поля и Enter сохраняют сразу — без кнопок и диалогов */
      view.addEventListener('change', function (e) {
        var inp = e.target && e.target.closest ? e.target.closest('[data-sl-in]') : null;
        if (!inp) return;
        if (inp.isConnected === false) return;      /* поле уже перерисовано — это хвостовой change */
        if (RT.sl.addMode) return;                 /* при внесении сохраняет только «+» */
        slCommit(inp);
      });
      view.addEventListener('keydown', function (e) {
        var inp = e.target && e.target.closest ? e.target.closest('[data-sl-in]') : null;
        if (!inp) return;
        if (e.key === 'Enter') {
          e.preventDefault();
          if (slCommit(inp)) inp.blur(); else inp.focus();
        } else if (e.key === 'Escape') {
          /* Esc — откат к сохранённому значению */
          var it = slData()[+inp.getAttribute('data-sl-in')];
          var si = inp.hasAttribute('data-sl-si') ? +inp.getAttribute('data-sl-si') : null;
          var sz = it && (si != null ? it.sizes[si] : it);
          if (sz) inp.value = sz.rest != null ? String(sz.rest) : '';
          slRowErr(inp, false);
          inp.blur();
        }
      });
      /* При первом рендере список может уже не влезать в кадр — полосу показываем сразу,
         не дожидаясь первого события scroll */
      slScrollSync();
      if (!RT.sl.__rsWired && typeof ResizeObserver === 'function') {
        RT.sl.__rsWired = true;
        RT.sl.__ro = new ResizeObserver(function () { slScrollSync(); });
        if (slBodyEl) RT.sl.__ro.observe(slBodyEl);
      }
    }

    /* Строка блюда: статус — цвет/иконка кнопки (как в макете) */

        : '';

      'item-edit': { t: 'Панель остатка', s: 'Фокачча · 2,5 шт', q: 'Допустимы 0 (полный стоп) и положительные значения от 0,001 до 999,999 с точностью до трёх знаков после запятой. WebKDS не округляет дробные остатки при установке, отображении и корректировке.', d: 'Правка — прямо в строке: справа поле 52 с числом остатка (22/28), единица — рядом, вне поля (в Input ДС справа только иконочный слот, текстового суффикса нет). Тап по числу — значение выделено, можно печатать сразу; Enter или уход из поля сохраняют, Esc возвращает прежнее значение. Пустое поле — ограничения нет (строка уходит из стоп-листа), 0 — полный стоп. Некорректное значение не сохраняется: под строкой появляется красная подпись «Допустимо от 0,001 до 999,999…»; ✎ и отдельного диалога больше нет.' },
      'item-sizes': { t: 'Редактирование размера', s: 'Маргарита · 25 см', q: 'Ограничения размеров задаются и снимаются независимо друг от друга: снятие ограничения с одного размера не меняет ограничений остальных размеров.', d: 'Размеры — отдельные строки, у каждой своё поле остатка: «25 см» в фокусе, значение 12 выделено. Переключателя «Всё блюдо / Размеры» нет — правится ровно та строка, в чьё поле нажали. Снятый размер показывается подписью «Без ограничения»; если снять ограничение с последнего размера, позиция уходит из стоп-листа.' },
      'item-sizes-by': { t: 'Редактирование размера', s: 'Маргарита · 30 см', q: 'Ограничения размеров задаются и снимаются независимо друг от друга: снятие ограничения с одного размера не меняет ограничений остальных размеров.', d: 'Поле «30 см» в фокусе, значение выделено — удобно перепечатать. У «35 см» — «Полный стоп» (остаток 0): поле показывает «0», под названием красная подпись «Полный стоп».' },
      'item-invalid': { t: 'Некорректный остаток', s: 'ошибка под полем, поле для правки', q: 'Остаток вне допустимого диапазона (меньше 0,001 или больше 999,999), с большей точностью или отрицательный — значение не принимается.', d: 'Поле содержит недопустимое значение «0,0005» — красная подпись «Допустимо от 0,001 до 999,999, не больше 3 знаков после запятой» под строкой; поле доступно для правки, значение не сохраняется.' },
      'item-nodata': { t: 'Стоп-лист', s: 'нет данных об остатке', q: 'Нет данных об остатке — интерфейс не показывает значения; показ некорректного или выдуманного остатка не допускается.', d: 'У «Тирамису» поле пустое: под названием — подпись «Нет данных об остатке» (12/16 #9e9e9e). Значение не выдумано: пустое поле ≠ 0 и ≠ полный стоп.' },
      'add-fail': { t: 'Внесение в стоп-лист', s: 'часть позиций внести нельзя', q: 'Предлагаются блюда, заготовки, услуги и модификаторы, связанные с приготовлением: задано место приготовления либо признак «готовить вместе с основным блюдом». Товары, внешние товары, позиции для закупки и топливо не предлагаются. Если попытка внесения всё же происходит, действие не выполняется, сотрудник получает понятное сообщение об отказе.', d: 'Экран внесения: «К списку» · «Добавить в стоп-лист» · терминальная группа «Зал», поиск и строки позиций: у большинства подпись «Без ограничения», у «Суп дня», «Салат цезарь» и «Соус чесночный» — «исключена из меню». Остаток задаётся в строке или в цифровой панели, вносит одна кнопка «Добавить в стоп». Исключённые не вносятся: нейтральный баннер «Не удалось добавить: позиция исключена из меню», ограничение не появляется.' },
      'add-multi': { t: 'Внесение нескольких позиций', s: 'чекбоксы · массовое внесение', q: 'Внесение в стоп-лист может касаться нескольких позиций сразу: отметил несколько — внёс одним действием.', d: 'Копия экрана внесения: у каждой строки чекбокс, в полосе — «Выбрать все»; при выборе сверху появляется «Выбрано: N» и акцентная кнопка «Добавить в стоп-лист» — вносит все отмеченные. Остаток берётся из поля строки, пустое поле = полный стоп. Поштучных кнопок «Добавить» в строках нет — на этом экране вносит только массовое действие.' },
      'multi-head': { t: 'Режим выбора', s: 'действия в шапке · вариант A', q: 'Предусмотрены три массовых действия: массовый полный стоп — выбранные позиции переводятся в полный стоп; массовое снятие ограничений; очистка всего стоп-листа — с обязательным подтверждением. Массовая установка положительных остатков не предусматривается.', d: 'Вариант A: отмечены 3 позиции — слева «Выбрано: 3» и «Снять выбор», справа «Снять ограничения» и «В стоп»; нижней плашки нет, «Добавить позицию» на время выбора уступает место действиям.' },
      'multi-lock': { t: 'Режим выбора', s: 'плашка · вариант B', q: 'Предусмотрены три массовых действия: массовый полный стоп — выбранные позиции переводятся в полный стоп; массовое снятие ограничений; очистка всего стоп-листа — с обязательным подтверждением. Массовая установка положительных остатков не предусматривается.', d: 'Вариант B: отмечены 3 позиции — действует только нижняя плашка («Выбрано: 3 · Снять выбор · Снять ограничения · В стоп»); полоса, шаги остатков, сброс значения и кнопки футера неактивны, галочки и шевроны работают.' },
      'multi-partial': { t: 'Массовое снятие', s: 'результат с пропуском', q: 'Массовое действие, когда часть отмеченных позиций его не допускает — действие применяется к тем позициям, к которым применимо; результат виден.', d: 'После «Снять ограничения» — подпись результата: «Снято ограничений: 2 · пропущено: 1 (без ограничения)». Результат виден, пропущенная позиция названа с причиной; действие не теряется незаметно.' },
      'clear-confirm': { t: 'Очистить стоп-лист?', s: 'обязательное подтверждение', q: 'Очистка всего стоп-листа — удаляются все ограничения текущего стоп-листа, включая позиции с положительным остатком; очистка выполняется с обязательным подтверждением.', d: 'Открывается из футера — «Очистить стоп-лист», без выделения строк. Диалог 500 по анатомии Dialog ДС: шапка с заголовком 20/24 и ✕, описание 16/24, в подвале справа «Отмена» и «Очистить». «Отмена» (и Esc, и тап мимо) закрывает диалог без изменений.' },
      'shift-off': { t: 'Возврат к заказам', s: 'персональная смена выключена', q: 'Если персональную смену отключили после включения стоп-листа, открытый интерфейс закрывается с возвратом к работе с заказами; действия со стоп-листом недоступны.', d: 'Экран заказов + нейтральный баннер «Стоп-лист закрыт: персональная смена выключена» сверху ленты (не красный — это не ошибка), авто-скрытие 3 с. Значение опции сохраняется: после включения смены доступ восстанавливается.' },
      'icons': { t: 'Пиктограммы', s: 'все — кандидаты, не утверждены', q: 'Иконки экрана стоп-листа подобраны как кандидаты: block — вход в стоп-лист, edit — действие строки, print — печать, restaurant и straighten — уровни ограничения.', d: 'Постер пиктограмм (паттерн kds-posters): пять иконок Material Icons Outlined, у каждой подпись «кандидат, не утверждена». Ни одна иконка не выдана за утверждённую; окончательный набор согласуется с дизайнером отдельно.' },
      'rationale': { t: 'Обоснование решений', s: '6 решений · согласованы 23.10.2026', q: 'Открытые вопросы задачи закрыты решениями, которые дизайнер согласовал 23.10.2026; прототип рисует именно их.', d: 'Постер «Обоснование решений»: шесть карточек — переключение уровней, отказ от истории изменений, частичное массовое действие, единый вид полного стопа, причина отказа при внесении, закрытие из-за персональной смены. У каждого — решение и почему именно так.' }
    };
    function docHead(id, pill) {
      var x = DOC[id] || DOC['base'];
      /* Место (цех/сборка) — в заголовок, если его там ещё нет (поле s) */
      var showPill = pill && id !== 'd-list' && (!x.s || x.s.toLowerCase().indexOf(pill.toLowerCase()) < 0);
      return '<div class="kds-doc kds-doc--head"><div class="kds-doc__title">' +
        x.t + (x.s ? ' · ' + x.s : '') + (showPill ? ' · ' + pill : '') + '</div></div>';
    }
    function docBody(id) {
      var x = DOC[id] || DOC['base'];
      return '<div class="kds-doc kds-doc--body">' +
        (x.q ? '<p class="kds-doc__q"><b>Цитата сценария (PB-8102):</b> «' + x.q + '»</p>' : '') +
        '<p class="kds-doc__item">' + x.d + '</p></div>';
    }
    /* Все сценарии по экранам: каждый экран отдельной строкой со своим описанием.
       Текущий экран подсвечен. Данные — из самих описаний DOC.
       Порядок — по номерам сценариев (совпадает с реестром layouts.js). */
    var SCREEN_ORDER = ['base', 'base-noaccess',
      'list', 'list-empty', 'excluded',
      'item-edit', 'item-sizes', 'item-sizes-by', 'item-invalid', 'item-nodata',
      'add-fail', 'add-multi',
      'multi-head', 'multi-lock', 'multi-partial', 'clear-confirm',
      'shift-off',
      'icons', 'rationale'];
    function scenList(curId) {
      var rows = SCREEN_ORDER.map(function (sid, i) {
        var dd = DOC[sid];
        if (!dd) return '';
        return '<li class="kds-scen__i' + (sid === curId ? ' is-cur' : '') + '">' +
          '<span class="kds-scen__n">' + (i + 1) + '</span>' +
          '<span class="kds-scen__body">' +
            '<span class="kds-scen__t">' + esc(dd.t + (dd.s ? ' · ' + dd.s : '')) + '</span>' +
            (dd.q ? '<span class="kds-scen__q">Задача: «' + dd.q + '»</span>' : '') +
            '<span class="kds-scen__d">' + dd.d + '</span>' +
          '</span></li>';
      }).join('');
      return '<div class="kds-scen"><div class="kds-scen__head">Экраны прототипа — всё, что есть в нём</div>' +
        '<ul class="kds-scen__list">' + rows + '</ul></div>';
    }

    /* ── Комментарии к экрану ──
       Хранятся локально в браузере (localStorage), ключ — id экрана.
       Внимание: у file:// и GitHub Pages это РАЗНЫЕ хранилища, между устройствами не синхронизируются. */
    var CMT_KEY = 'kdsComboComments:v1';
    function cmtAll() {
      try { var raw = window.localStorage.getItem(CMT_KEY); return raw ? (JSON.parse(raw) || {}) : {}; }
      catch (e) { return {}; }
    }
    function cmtSave(all) {
      try { window.localStorage.setItem(CMT_KEY, JSON.stringify(all)); } catch (e) {}
    }
    function cmtListOf(id) { var a = cmtAll(); return (a[id] || []).slice(); }
    function cmtStamp(ts) {
      var d = new Date(ts); var p = function (n) { return (n < 10 ? '0' : '') + n; };
      return p(d.getDate()) + '.' + p(d.getMonth() + 1) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
    }
    function cmtPanelHtml(id) {
      var list = cmtListOf(id);
      var items = list.map(function (c) {
        return '<li class="kds-cmt__i" data-cmt-id="' + esc(c.id) + '">' +
          '<span class="kds-cmt__t">' + esc(c.text) + '</span>' +
          '<span class="kds-cmt__time">' + cmtStamp(c.ts) + '</span>' +
          '<button class="kds-cmt__del" type="button" data-cmt-del="' + esc(c.id) + '" title="Удалить"><span class="material-icons">close</span></button>' +
        '</li>';
      }).join('');
      return '<div class="kds-cmt__head">Комментарии к экрану' +
          '<span class="kds-cmt__n' + (list.length ? '' : ' kds-cmt__n--zero') + '">' + list.length + '</span>' +
          '<button class="kds-cmt__copy" type="button" data-cmt-copy>Скопировать все</button>' +
          '<button class="kds-cmt__close" type="button" data-cmt-close title="Закрыть"><span class="material-icons">close</span></button>' +
        '</div>' +
        (items
          ? '<ul class="kds-cmt__list">' + items + '</ul>'
          : '<p class="kds-cmt__empty">Пока нет. Напиши замечание — оно сохранится в этом браузере.</p>') +
        '<div class="kds-cmt__add">' +
          '<textarea class="kds-cmt__input" data-cmt-input rows="2" placeholder="Замечание к экрану…"></textarea>' +
          '<button class="kds-cmt__send" type="button" data-cmt-send disabled>Добавить</button>' +
        '</div>' +
        '<p class="kds-cmt__hint">Хранится локально в этом браузере (localStorage) — на опубликованной странице и у коллег этих комментариев не будет. Ctrl+Enter — добавить.</p>';
    }
    /* Кнопка и панель создаются один раз (fixed — доступны при любом скролле),
       содержимое перерисовывается под текущий экран */
    function cmtMount(id) {
      var fab = document.getElementById('kdsCmtFab');
      var panel = document.getElementById('kdsCmtPanel');
      if (!fab) {
        fab = document.createElement('button');
        fab.id = 'kdsCmtFab'; fab.type = 'button'; fab.className = 'kds-cmt-fab';
        fab.innerHTML = '<span class="material-icons">mode_comment</span><span class="kds-cmt-fab__n"></span>';
        document.body.appendChild(fab);
      }
      if (!panel) {
        panel = document.createElement('div');
        panel.id = 'kdsCmtPanel'; panel.className = 'kds-cmt-panel';
        document.body.appendChild(panel);
      }
      panel.setAttribute('data-cmt-screen', id);
      panel.innerHTML = cmtPanelHtml(id);
      var n = cmtListOf(id).length;
      fab.querySelector('.kds-cmt-fab__n').textContent = n ? String(n) : '';
      fab.classList.toggle('has-cmt', !!n);
      fab.title = 'Комментарии к экрану' + (n ? ' (' + n + ')' : '');
    }
    function cmtAdd(sec) {
      if (!sec) return;
      var id = sec.getAttribute('data-cmt-screen');
      var ta = sec.querySelector('[data-cmt-input]');
      var text = ((ta && ta.value) || '').trim();
      if (!text) return;
      var all = cmtAll();
      (all[id] = all[id] || []).push({ id: 'c' + Date.now() + Math.random().toString(36).slice(2, 6), text: text, ts: Date.now() });
      cmtSave(all);
      cmtMount(id);
    }
    function cmtCopyFallback(text) {
      var ta = document.createElement('textarea');
      ta.value = text; ta.style.position = 'fixed'; ta.style.top = '-1000px';
      document.body.appendChild(ta); ta.select();
      try { document.execCommand('copy'); } catch (e) {}
      document.body.removeChild(ta);
    }
    function cmtCopyAll(btn) {
      var all = cmtAll();
      var ids = SCREEN_ORDER.filter(function (s) { return (all[s] || []).length; });
      var flash = function (msg) { if (!btn) return; var old = btn.textContent; btn.textContent = msg; setTimeout(function () { btn.textContent = old; }, 1600); };
      if (!ids.length) { flash('Пока пусто'); return; }
      var out = ['Комментарии · КДС «Комбо-набор»', ''];
      ids.forEach(function (s) {
        out.push((SCREEN_ORDER.indexOf(s) + 1) + '. ' + ((DOC[s] && DOC[s].t) || s) + ' (' + s + ')');
        all[s].forEach(function (c) { out.push('   • ' + cmtStamp(c.ts) + ' — ' + c.text); });
        out.push('');
      });
      var text = out.join('\n');
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(function () { flash('Скопировано'); }, function () { cmtCopyFallback(text); flash('Скопировано'); });
      } else { cmtCopyFallback(text); flash('Скопировано'); }
    }
    /* Обработчики — на документе: переживают перерисовку экрана */
    document.addEventListener('input', function (e) {
      var ta = e.target && e.target.closest ? e.target.closest('[data-cmt-input]') : null;
      if (!ta) return;
      var panel = ta.closest('.kds-cmt-panel');
      var btn = panel && panel.querySelector('[data-cmt-send]');
      if (btn) btn.disabled = !ta.value.trim();
    });
    document.addEventListener('keydown', function (e) {
      if (!(e.ctrlKey || e.metaKey) || e.key !== 'Enter') return;
      var ta = e.target && e.target.closest ? e.target.closest('[data-cmt-input]') : null;
      if (!ta) return;
      e.preventDefault();
      cmtAdd(ta.closest('.kds-cmt-panel'));
    });
    document.addEventListener('click', function (e) {
      var t = e.target;
      if (!t || !t.closest) return;
      if (t.closest('#kdsCmtFab')) {
        var p = document.getElementById('kdsCmtPanel');
        if (p) {
          p.classList.toggle('is-open');
          if (p.classList.contains('is-open')) { var ta0 = p.querySelector('[data-cmt-input]'); if (ta0) ta0.focus(); }
        }
        return;
      }
      var panel = t.closest('.kds-cmt-panel');
      if (!panel) return;
      if (t.closest('[data-cmt-close]')) { panel.classList.remove('is-open'); return; }
      if (t.closest('[data-cmt-send]')) { cmtAdd(panel); return; }
      var del = t.closest('[data-cmt-del]');
      if (del) {
        var id = panel.getAttribute('data-cmt-screen');
        var all = cmtAll();
        all[id] = (all[id] || []).filter(function (c) { return c.id !== del.getAttribute('data-cmt-del'); });
        if (!all[id].length) delete all[id];
        cmtSave(all); cmtMount(id); return;
      }
      var cp = t.closest('[data-cmt-copy]');
      if (cp) cmtCopyAll(cp);
    });

    /* ── Сборка экрана ── */
    var host = document.getElementById('kdsHost');
    /* Живой стоп-лист: после очистки/снятия/добавления список остаётся таким до перезагрузки.
       null — ещё не трогали демо-данные SCREENS['list'] */
    var SLITEMS = null;
    function slLiveItems() {
      if (SLITEMS == null) SLITEMS = JSON.parse(JSON.stringify(SCREENS['list'].items || []));
      return SLITEMS;
    }
    /* Сброс живого списка из текущего рендера (только экран list) */
    function slPersist() {
      if (RT && RT.cfg && RT.cfg.__live) SLITEMS = JSON.parse(JSON.stringify(RT.cfg.items || []));
    }
    function render(id) {
      var src = SCREENS[id] || SCREENS['base'];
      var cfg = JSON.parse(JSON.stringify(src));          // рабочая копия: состояние живёт до смены экрана
      RT.cfg = cfg; RT.M = {}; RT.hist = []; RT.filter = null; RT.shift = true; RT.asm = !!cfg.asm;
      RT.sl = (cfg.mode === 'slist' || cfg.mode === 'add')
