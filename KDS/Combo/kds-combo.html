        : '';
      var comboTag = d.combo
        ? '<span class="kds-dl-combo-tag" data-full="' + esc(d.combo) + '">' + esc(d.combo) +
          (d.inst ? '<span class="kds-dl-inst">' + d.inst + '</span>' : '') + '</span>'
        : '';
      var qty = d.qty > 1 ? '<span class="kds-dl-qty"' + (d.qtyBg ? ' style="background:' + d.qtyBg + '"' : '') + '>' + d.qty + '</span>' : '';
      return '<div class="kds-dl-row"' + (d._rid ? ' data-rid="' + d._rid + '"' : '') + '>' +
        '<button class="kds-dl-stub kds-dl-stub--' + (rr.st || 'waiting') + '" type="button" data-ord="' + esc(rr.ord) + '">' +
          '<span class="kds-dl-stub__top"><span class="kds-dl-stub__num">' + esc(rr.ord) + '</span>' +
            '<span class="kds-dl-stub__timer' + (rr.timerNeg ? ' is-neg' : '') + '">' + esc(rr.timer) + '</span></span>' +
          '<span class="kds-dl-stub__ch">' + esc(rr.ch) + '</span>' +
        '</button>' +
        '<div class="kds-dl-body' + (d.indent ? ' kds-dl-body--indent' : '') + (d.sel ? ' kds-dl-body--sel' : '') + '">' +
          '<div class="kds-dl-main' + (chips ? ' kds-dl-main--chips' : '') + (comment ? ' kds-dl-main--combo' : '') + '">' +
            '<div class="kds-dl-cell">' + meta +
              '<div class="kds-dl-line">' + qty + '<span class="kds-dl-name' + (neg ? ' is-neg' : '') + '">' + esc(d.name) + '</span>' + comboTag + '</div>' +
            '</div>' +
            chips +
            comment +
          '</div>' +
          '<button class="kds-dl-btn kds-btn--' + st + '" type="button"><span class="material-icons">' + icoFor(st, 'lrow') + '</span></button>' +
        '</div>' +
      '</div>';
    }
    function posters(p) {
      var html = p.cards.map(function (c) {
        if (c.row) {
          var cells = c.row.map(function (cell) {
            return '<div class="kds-poster__cell">' +
              (cell.star ? '<span class="kds-star kds-star--lg">' + svgIco('stars', 40) + '</span>' :
                cell.svg ? '<span class="kds-poster__ico ' + (cell.muted ? 'kds-poster__ico--muted' : 'kds-poster__ico--neutral') + '">' + svgIco(cell.svg, 40) + '</span>' :
                '<span class="kds-poster__ico' + (cell.warn ? ' kds-poster__ico--warn' : '') + (cell.muted ? ' kds-poster__ico--muted' : '') + ' material-icons">' + cell.ico + '</span>') +
              '<div class="kds-poster__title">' + esc(cell.title) + '</div>' +
              '<div class="kds-poster__sub">' + esc(cell.sub) + '</div>' +
            '</div>';
          }).join('');
          return '<article class="kds-poster kds-poster--row">' + cells + '</article>';
        }
        return '<article class="kds-poster">' +
          '<div class="kds-poster__title">' + esc(c.title) + '</div>' +
          '<ul class="kds-poster__list">' + c.items.map(function (i) { return '<li>' + esc(i) + '</li>'; }).join('') + '</ul>' +
        '</article>';
      }).join('');
      return '<div class="kds-posters">' + html + (p.note ? '<div class="kds-posters__note">' + esc(p.note) + '</div>' : '') + '</div>';
    }

    var DOC = {
      'base': { t: 'Экран как в Figma', s: 'база до задачи · 1:1 по Figma', q: 'Набор — не блюдо, не подача и не статус: у него нет количества, статуса, времени и действий. Всё исполняемое остаётся у блюд: количество, модификаторы, статус, время.', d: 'Сценарием не задан — это база 1:1 по Figma, на которой держатся остальные экраны: шапка карточки, строки блюд с кнопками статусов, перенос чека пунктиром, готовая карточка с блюдом и модификаторами, отменённый заказ.' },
      'g-multi': { t: 'По заказам · блюда набора одним блоком', s: 'сценарий 2.1 · горячий цех', q: 'Режим «по заказам»: в пределах курса видимые компоненты одного набора — целостная группа с названием набора независимо от их числа, включая единственный видимый компонент; другие блюда внутрь не вклиниваются.', d: 'Сделано по сценарию 2.1 (горячий цех): в «Ланче» видны только блюда этого цеха — бургер и картофель, в строке названия справа — «2 из 3 блюд»; заголовок набора без кнопки и без статуса; отдельно купленный бургер стоит своей строкой и бургер из набора не заменяет.' },
      'g-single': { t: 'По заказам · блюда набора одним блоком', s: 'сценарий 2.1 · холодный цех', q: 'Частичная видимость: отсутствие строки блюда не означает, что оно готово или отсутствует в наборе, и экран не должен создавать такое впечатление. Один или несколько компонентов внутри группы не означают, что показан полный состав.', d: 'Сделано по сценарию 2.1 (холодный цех): тот же заказ №214, в «Ланче» только салат и справа в строке названия — «1 из 3 блюд» — группа из одного компонента остаётся той же группой набора и не выдаёт себя за полный состав.' },
      'g-kitchens': { t: 'По заказам · блюда набора одним блоком', s: 'сценарий 3.4 · оба цеха', q: 'Цех и фильтры: на цеховом экране видна только часть набора, и фильтр не должен переключать способ обозначения набора.', d: 'Сделано по сценарию 3.4 (оба цеха на одном экране): у каждого блюда справа рамка цвета цеха (PB-6800), «Ланч» виден целиком — бургер и картофель горячего цеха, салат холодного; отдельный бургер готов, но бургер из набора не заменяет.' },
      'g-assembly': { t: 'По заказам · экран сборщика', s: 'сценарий 3.4 · сборка', q: 'Режим «по заказам»: в пределах курса видимые компоненты одного набора — целостная группа с названием набора независимо от их числа, включая единственный видимый компонент; другие блюда внутрь не вклиниваются.', d: 'Сделано по сценарию 3.4 (экран сборщика, здесь доставка): шапка нейтральная — без заливки статуса и без кнопки; у блюд только иконки статусов и рамка цеха, кнопок нет; «Ланч» целиком — готовые картофель и салат собирает сборщик, бургер ещё готовится; отдельный бургер готов, но бургер из набора не заменяет.' },
      'g-courses': { t: 'По заказам · набор разложен по курсам', s: 'сценарий 3.3', q: 'Курсы: набор не равен подаче. В пределах одного курса компоненты конкретного экземпляра набора воспринимаются как одна целостная группа, другие блюда её не разрывают. Части набора из разных курсов между курсами не перемещаются, но их принадлежность должна оставаться понятной.', d: 'Сделано по сценарию 3.3: «Бизнес-ланч» разложен по двум курсам — суп в первом (подпись «1 из 3 блюд»), бургер и картофель во втором («2 из 3 блюд»); это один и тот же экземпляр набора, поэтому номера у блоков нет — номер появляется, только когда экземпляров больше одного. Через границу курса группы не соединяются, порядок выдачи не меняется; активного или дизейбл-курса нет — в сценарии такого состояния нет.' },
      'g-between': { t: 'По заказам · группа внутри курса, части набора в разных курсах', s: 'сценарий 3.2', q: 'Группировка и курсы: компоновка, при которой целостность группы внутри курса видна, части набора из разных курсов не перемещаются между курсами, а порядок заказов, курсы и производственные приоритеты сохраняются.', d: 'Сделано по сценарию 3.2 с курсами: в курсе 1 блюда набора стоят одной группой с полосой 2 px #4D4D4D, посторонний салат остаётся своей строкой и в группу не попадает. В курсе 2 — продолжение того же набора (чай) отдельной группой: часть набора из другого курса в курс 1 не переезжает. Порядок курсов сохраняется; отступы внутри и между блоками — 4 px.' },
      'g-between-order': { t: 'По заказам · исходный порядок из заказа', s: 'сценарий 3.2 · как пришло', q: 'Группировка и курсы: компоновка, при которой целостность группы внутри курса видна, части набора из разных курсов не перемещаются между курсами, а порядок заказов, курсы и производственные приоритеты сохраняются.', d: 'Контрольное состояние: тот же заказ №214 и тот же состав, но строки идут в исходном порядке из чека — бургер набора, посторонний салат, картофель набора, затем курс 2: чай набора и отдельный бургер. Группы и полосы нет, принадлежность — строкой «Ланч» над названием. Курсы и их порядок те же, что на экране «как собрано»; меняется только компоновка внутри курса.' },
      'g-instances': { t: 'По заказам · два набора, разный состав', s: 'сценарий 3.1', q: 'В одном заказе возможны одно и то же блюдо с разной принадлежностью (в наборе и отдельно), несколько экземпляров одного набора и разные наборы с одинаковым блюдом.', d: 'Сделано по сценарию 3.1: один гость заказал два «Ланча» из одного комбо-меню — у первого борщ, котлета, чай, у второго гаспачо, рыба, компот. Номеров и приписок к названию нет: оба блока называются «Ланч», различаются составом и статусами.' },
      'g-instances-same': { t: 'По заказам · два набора, одинаковый состав', s: 'сценарий 3.1', q: 'Экземпляры одного набора — это повторно заказанный набор с независимо выбранными блюдами: название у них общее и экземпляр оно не идентифицирует, поэтому различать их нужно всегда, в том числе при совпавшем выбранном составе, — и внутри одного курса, и между курсами. Количества и статусы отдельных порций нельзя смешивать.', d: 'Сделано по сценарию 3.1: повторно заказанный набор с совпавшим составом — номеров нет, оба блока подписаны «Ланч»; это два независимых комплекта, количества и статусы порций у них свои и не смешиваются.' },
      'g-modifier': { t: 'По заказам · модификатор готовится отдельно', s: 'сценарий 3.6', q: 'Модификатор относится к блюду, а не к набору. Если модификатор готовится отдельной позицией — по существующим правилам, — он сохраняет две связи: с родительским блюдом и с конкретным экземпляром набора этого блюда. Отдельным компонентом набора он при этом не становится: компонент набора — блюдо вместе со своими модификаторами, поэтому состав набора не меняется. Обе связи должны читаться и тогда, когда родительского блюда на экране нет.', d: 'Сделано по сценарию 3.6: «Соус к бургеру» — отдельная задача; обе связи текстом: «к Бургеру · Ланч 2» — с блюдом и с конкретным экземпляром набора (в заказе два «Ланча», они различены цифрой), без иконки. Звезды у строки нет; компонентом набора соус не становится и свои статус и кнопку сохраняет, даже когда бургера на экране нет.' },
      'g-cancelled': { t: 'По заказам · отменённое блюдо из набора', s: 'требование задачи PB-8108 · отмена', q: 'Отмена и изменение блюд обрабатываются по обычным правилам изменения заказа: отменённое блюдо не показывается как необходимая часть комплекта.', d: 'Отдельного сценария в списке нет — сделано по требованию задачи: отменённое блюдо не показывается как необходимая часть комплекта — бургер из набора красный, без зачёркивания и без кнопки (справа крестик), картофель готов, отдельный бургер вне группы готов как обычно.' },
      'g-long': { t: 'По заказам · длинное название, узкий экран', s: 'сценарий 3.7', q: 'Название набора есть всегда. При нехватке места допускается сокращённое представление, но полное название должно оставаться доступным сотруднику. Производственные сведения о блюде — название и количество, статус, модификаторы, время — остаются первыми.', d: 'Сделано по сценарию 3.7: экран 720 px, два набора с похожими названиями, которые различаются в видимой части (напиток / суп); названия сокращаются с многоточием, полное имя открывается нажатием на строку заголовка (поповер, авто-скрытие 3 с, раскладка не сдвигается), состав не раскрывается.' },
      'd-list': { t: 'По блюдам · набор подписан текстом', s: 'сценарий 2.2', q: 'Режим «по блюдам»: компактное текстовое указание принадлежности у строки блюда, без показа остальных компонентов набора.', d: 'Сделано по сценарию 2.2 и требованию к экземплярам: строки-контейнера набора нет — каждая позиция набора идёт своей строкой с пометкой над названием «Ланч» 12/16 #D6D6D6 (как строка гостя), без иконки; если экземпляров набора несколько — рядом цифра-бейдж 1/2, одна и та же у блюд одного экземпляра. Показаны: одно и то же блюдо с набором и без (бургер дважды), два разных набора с одним блюдом (Ланч и Детский набор), два экземпляра одного набора, отменённый компонент набора (чай красный), длинное название набора (обрезается многоточием, полное — по тапу). Состав набора не раскрывается; количество, статус, время и кнопки остаются у блюд.' },
      'g-filter': { t: 'По заказам · включён фильтр «Готово»', s: 'требование задачи PB-8108 · фильтр по статусу', q: 'Цех и фильтры: на цеховом экране видна только часть набора, и фильтр не должен переключать способ обозначения набора.', d: 'Сделано по требованию задачи, пример взят из сценария 2.2: включён фильтр «Готово» — в «Ланче» готовы картофель и салат, бургер из набора ещё готовится и скрыт фильтром. Группа и её заголовок те же, способ обозначения не переключился; подпись видимости пересчитана по видимым строкам — «2 из 3 блюд». Две готовые позиции не значат, что набор готов; отдельный бургер вне группы готов, но бургер из набора не заменяет.' },

    /* Кнопка и панель создаются один раз (fixed — доступны при любом скролле),

    /* На реальном узком вьюпорте шапка переходит в мобильный вариант (Figma «Header» 375) */

    /* ── Масштаб холста: макет всегда 1:1, чтобы размеры в инспекторе совпадали с CSS.

    function fitScale() {

      if (!shell) return;
      var scale = 1;
      shell.style.transform = 'none';

      fit.style.height = Math.ceil(shell.offsetHeight * scale) + 'px';
    }

    /* ── Тултип полного названия (своя раскладка: Hint для тёмной темы КДС в ДС нет) ── */
    function relPos(el, root) {
      var x = 0, y = 0;
      while (el && el !== root) { x += el.offsetLeft; y += el.offsetTop; el = el.offsetParent; }
      return { x: x, y: y };
    }
    function bindTips(view) {
      if (!view) return;

      var hoverOK = !!(window.matchMedia && window.matchMedia('(hover: hover) and (pointer: fine)').matches);

      function hide() { clearTimeout(hideT); tip.style.display = 'none'; tip.textContent = ''; }

    /* ── Прокрутка «рукой»: мышью тянем доску/список, на тач-экране — нативный свайп ── */
    function bindPan(view) {
      if (!view) return;

    /* ── Полоса скролла под лентой (своя, как в макете: 12 px, ползунок 8 px #333) ── */
    function bindScrollStrip(view) {
      if (!view) return;
      var board = view.querySelector('.kds-board');
      var strip = view.querySelector('.kds-scrollstrip');
      var thumb = view.querySelector('.kds-scrollstrip__thumb');
      if (!strip || !thumb) return;
      if (!board) { strip.style.display = 'none'; return; }
      function upd() {
        var cw = board.clientWidth, sw = board.scrollWidth;
        /* Полоса видна всегда, как в макете: при переполнении ползунок — доля,
           без переполнения — во всю ширину трека */
        strip.style.display = 'block';
        var track = cw - 4;
        var w = Math.min(track, Math.max(48, Math.round(track * cw / sw)));
        thumb.style.width = w + 'px';
        var max = track - w;
        thumb.style.transform = 'translateX(' + (sw > cw ? Math.round((board.scrollLeft / (sw - cw)) * max) : 0) + 'px)';
      }
      board.addEventListener('scroll', upd);
      upd();
    }
    /* ── Вертикальная полоса скролла режима «по блюдам» (Figma Scroll: трек #9E9E9E, ползунок #616161) ── */
    function bindVScroll(view) {
      var list = view.querySelector('.kds-dlist');

        var ch = list.clientHeight, sh = list.scrollHeight;
        if (sh <= ch + 1) { strip.style.display = 'none'; return; }
        strip.style.display = 'block';

        var k = Math.max(24, Math.round(th * ch / sh));
        knob.style.height = k + 'px';

    /* ══════════ Работающий макет: состояние, статусы, шапка, селекты, футер ══════════ */
    var RT = { cfg: null, view: null, layer: null, M: {}, hist: [], shift: true, filter: null,

    /* Значения счётчиков из макета («Menu setting»): 12 / 2 / 8 и ср. время 14:32.

    var STATUS_ORDER = { waiting: 0, urgent: 1, cooking: 2, ready: 3, cancelled: 4 };

      if (o.contTop && idx > 0) {

    /* Иконка кнопки из статуса: стрелка → в работу, галочка → готово, крестик/корзина → отмена */
    function icoFor(st, kind) {
      /* экран сборщика (Figma DSGN-509/8941:7418) — статус без кнопки, KDS-иконки по состояниям:
         часы access_time (ожидает, серый), update (пора готовить, оранжевый),
         timelapse (готовится, синий), галочка (готово, зелёный), корзина (отменено, красный) */
      if (kind === 'asm') {
        if (st === 'cancelled') return 'delete';
        if (st === 'ready') return 'check';
        if (st === 'cooking') return 'timelapse';
        if (st === 'urgent') return 'update';
        return 'access_time';
      }
      if (kind === 'mgroup' || kind === 'lrow') return st === 'cancelled' ? 'delete' : (st === 'ready' ? 'check' : 'arrow_forward');
      if (st === 'cancelled') return 'close';
      if (st === 'ready') return 'check';

    /* Проставляем id строкам: по ним нажатие находит модель */
    function prep(cfg) {
      var n = 0;
      function A(o, kind, cid) {
        o._rid = 'r' + (++n); o._kind = kind; o._cid = cid;
        RT.M[o._rid] = { o: o, kind: kind, cid: cid };
      }
      (cfg.orders || []).forEach(function (o, i) {
        o._cid = 'c' + i;
        if (o.timer) o._secs = parseTimer(o.timer);
        /* Экземпляры набора: ключ = название + номер экземпляра (comboId на бэкенде).

        var instSets = {};                       // title -> { inst: true, ... }
        (o.items || []).forEach(function (it) {

          (it.rows || []).forEach(function (rw) {

    /* ── Действия со строками (вики: Готовится → Приготовлено → строка исчезает) ── */
    function pushHist(e) {
      RT.hist.push(e);
      while (RT.hist.length > HIST_MAX) RT.hist.shift();
    }
    function rowEl(rid) { return RT.view.querySelector('[data-rid="' + rid + '"]'); }
    function cardEl(cid) { return RT.view.querySelector('[data-cid="' + cid + '"]'); }
    function rowAction(rid) {
      var m = RT.M[rid];
      if (!m || !RT.shift) return;                 // смена выключена — действия недоступны
      if (m.kind === 'combo' || m.kind === 'mgroup' || m.kind === 'set') { setAction(rid); return; }
      if (m.o.st === 'done') return;               // блюдо уже сброшено с экрана
      var next = CYCLE[m.o.st] || 'cooking';
      pushHist({ type: 'row', rid: rid, prev: m.o.st });
      applyRow(rid, next);
    }
    /* Кнопка набора = bump всего набора (компоненты переходят вместе) */
    function setAction(rid) {
      var m = RT.M[rid];
      if (!m || !RT.shift || m.o.st === 'done') return;
      var kids = (m.o.rows || []).filter(function (rw) { return rw._rid && RT.M[rw._rid] && RT.M[rw._rid].o.st !== 'done'; });
      var next = CYCLE[m.o.st] || 'cooking';
      pushHist({ type: 'set', rid: rid, prev: m.o.st, rows: kids.map(function (rw) { return { rid: rw._rid, prev: rw.st }; }) });
      kids.forEach(function (rw) { rw.st = CYCLE[rw.st] || 'cooking'; });
      applySet(rid, next);
    }
    /* Отрисовка состояния набора: цвет шапки/компонентов и иконка единственной кнопки */
    function applySet(rid, st) {
      var m = RT.M[rid];
      if (!m) return;
      m.o.st = st;
      var el = rowEl(rid);
      if (!el) return;
      if (st === 'done') { el.style.display = 'none'; applyCounts(); syncUndo(); return; }
      el.style.display = '';
      var neg = st === 'cancelled';
      el.classList.toggle('kds-kit--neg', neg);
      ['waiting', 'urgent', 'cooking', 'ready', 'cancelled', 'done'].forEach(function (s) { el.classList.toggle('kds-kit--' + s, st === s); });
      el.querySelectorAll('.kds-kit__comp').forEach(function (c) { c.classList.toggle('kds-kit__comp--neg', neg); });
      var btn = el.querySelector('.kds-kit__btn');
      if (btn) {
        btn.className = 'kds-kit__btn kds-kit__btn--' + st;

    /* Шапка карточки = bump заказа (PB-7765): действие с полноширинной кнопки перенесено в шапку.

       Цикл как у блюд: серая → жёлтая → синяя → зелёная, красная — ошибка/отмена. */

      if (!items.length) return;
      var next = ORDER_CYCLE[o.st] || 'cooking';
      pushHist({ type: 'card', cid: cid, prev: o.st, rows: items.map(function (m) { return { rid: m.o._rid, prev: m.o.st }; }) });
      items.forEach(function (m) { if (m.o.st !== 'done') bumpRow(m.o._rid); });

      pushHist({ type: 'card', cid: cid, prev: o.st, rows: items.map(function (m) { return { rid: m.o._rid, prev: m.o.st }; }) });
      items.forEach(function (m) { if (m.o.st !== 'done') bumpRow(m.o._rid); });

          (it.rows || []).forEach(function (rw) { if (RT.M[rw._rid]) out.push(RT.M[rw._rid]); });
        } else if (RT.M[it._rid] && it.k !== 'transfer' && it.k !== 'course') out.push(RT.M[it._rid]);

    function listOrderAction(ord) {

    /* ── Счётчики шапки (Figma «Menu setting») и отмена последнего действия ──
         Корзины — по цветам шапки (правило заказчика 22.10):
           синяя «В работе» — блюдо «Готовится» (cooking);
           красная «Просрочено» — время карточки истекло, задача ещё не готова (urgent/cooking);
           зелёная «Готово» — «Приготовлено» (ready).
         Ожидание, «Пора готовить» без просрочки, отменённое и сброшенное — не считаем. ── */
    function inBucket(k, st, overdue) {
      if (!st || st === 'cancelled' || st === 'done' || st === 'waiting') return false;
      if (k === 'done') return st === 'ready';
      if (k === 'run') return st === 'cooking';
      /* просрочено — только то, что уже в работе: время вышло у «Готовится» */
      if (k === 'over') return !!overdue && st === 'cooking';
      return false;
    }
    function countsNow() {
      var run = 0, over = 0, done = 0;
      function add(st, overdue) {
        if (inBucket('run', st, overdue)) run++;
        if (inBucket('over', st, overdue)) over++;
        if (inBucket('done', st, overdue)) done++;
      }
      ((RT.cfg && RT.cfg.orders) || []).forEach(function (o) {
        if (o._hidden) return;
        var overdue = !!(o.timerNeg || (o._secs != null && o._secs < 0));
        cardRows(o).forEach(function (m) { add(m.o.st, overdue); });
      });
      ((RT.cfg && RT.cfg.rows) || []).forEach(function (rw) {
        var d = rw.dish || rw;
        add(d.st || 'waiting', !!rw.timerNeg);
      });
      return { run: run, over: over, done: done };
    }
    /* на экране 6 карточек, а в макете 12/2/8 — храним дельту, чтобы стартовые
       цифры совпадали с Figma, а дальше реагировали на нажатия */
    function displayCounts() {
      var c = countsNow();
      /* цифры в шапке — реальные количества блюд (без подмешивания Figma-значений) */
      return { run: c.run, over: c.over, done: c.done, avg: CNT_BASE.avg };
    }
    function applyCounts() {
      if (!RT.view) return;
      var c = displayCounts();
      ['run', 'over', 'done', 'avg'].forEach(function (k) {
        var el = RT.view.querySelector('[data-cnt="' + k + '"]');
        if (el) el.textContent = c[k];
      });
      var menu = RT.view.querySelector('.kds-menu--metrics');
      if (menu) {
        var rows = menu.querySelectorAll('[data-mrow]');
        Array.prototype.forEach.call(rows, function (r) {
          var k = r.getAttribute('data-mrow');
          r.lastChild.textContent = r.getAttribute('data-label') + ' ' + c[k];
        });
      }
      applyFilter();
    }
    /* ── Счётчики-фильтры: «В работе» / «Просрочено» / «Вовремя» ── */
    function toggleFilter(k) {
      RT.filter = RT.filter === k ? null : k;
      applyFilter();
      /* фильтр применяется к ленте с её начала — иначе скрытые карточки за экраном
         и кажется, что фильтр ничего не сделал */
      var board = RT.view && RT.view.querySelector('.kds-board');
      if (board) board.scrollLeft = 0;
    }
    function matchFilter(st, overdue) {
      if (!RT.filter) return true;
      return inBucket(RT.filter, st, overdue);
    }
    function applyFilter() {
      if (!RT.view || !RT.cfg) return;
      var changed = false;
      /* Фильтр — по ЗАДАЧАМ (блюдам), как счётчики шапки: неподходящие блюда скрываются
         внутри карточек, карточка без единого видимого блюда прячется целиком */
      (RT.cfg.orders || []).forEach(function (o) {
        var art = cardEl(o._cid);
        if (!art) return;
        var overdue = !!(o.timerNeg || (o._secs != null && o._secs < 0));
        var any = false;
        Array.prototype.forEach.call(art.querySelectorAll('[data-rid]'), function (el) {
          var m = RT.M[el.getAttribute('data-rid')];
          if (!m) return;
          /* контейнер группы не блюдо: его видимость решается по его блюдам (ниже) */
          if ((el.classList.contains('kds-kit') || el.classList.contains('kds-cset')) && el.querySelector('[data-rid]')) return;
          var st = m.o.st || 'waiting';
          var hide = (st === 'done') || !matchFilter(st, overdue);
          var want = hide ? 'none' : '';
          if (el.style.display !== want) { el.style.display = want; changed = true; }
          if (!hide) any = true;
        });
        /* контейнер группы виден, только если внутри есть видимое блюдо */
        Array.prototype.forEach.call(art.querySelectorAll('.kds-kit[data-rid], .kds-cset[data-rid]'), function (box) {
          var kids = box.querySelectorAll('[data-rid]');
          if (!kids.length) return;
          var alive = Array.prototype.some.call(kids, function (k) { return k.style.display !== 'none'; });
          var wantBox = alive ? '' : 'none';
          if (box.style.display !== wantBox) { box.style.display = wantBox; changed = true; }
        });
        /* подпись видимости — по видимым строкам ЭТОГО блока на карточке */
        Array.prototype.forEach.call(art.querySelectorAll('[data-seen]'), function (cap) {
          var m = +cap.getAttribute('data-seen-m') || 0;
          var n = 0;
          var box = cap.closest('.kds-cset, .kds-kit');
          if (box) Array.prototype.forEach.call(box.querySelectorAll('.kds-row, .kds-kit__comp'), function (r) {
            if (r.style.display === 'none') return;
            if (r.classList.contains('kds-row--cancelled') || r.classList.contains('kds-kit__comp--cancelled')) return;  /* отменённое не считаем */
            n++;
          });
          var l1 = cap.querySelector('[data-seen-l1]');
          if (l1) l1.textContent = n + ' из ' + m + ' блюд';
          cap.title = 'на экране ' + n + ' из ' + m + ' блюд набора';
          var wantCap = n > 0 && n < m ? '' : 'none';
          if (cap.style.display !== wantCap) { cap.style.display = wantCap; changed = true; }
        });
        var want = (o._hidden || (!!RT.filter && !any)) ? 'none' : '';
        if (art.style.display !== want) { art.style.display = want; changed = true; }
      });
      (RT.cfg.rows || []).forEach(function (rw) {
        var d = rw.dish || rw;
        if (!d._rid) return;
        var el = rowEl(d._rid);
        if (!el) return;
        var want = (d.st === 'done' || !matchFilter(d.st || 'waiting', !!rw.timerNeg)) ? 'none' : '';   // сброшенное блюдо не возвращаем фильтром
        if (el.style.display !== want) { el.style.display = want; changed = true; }
      });
      Array.prototype.forEach.call(RT.view.querySelectorAll('[data-filter]'), function (b) {
        b.classList.toggle('is-sel', RT.filter === b.getAttribute('data-filter'));
      });
      if (changed) {
        var board = RT.view.querySelector('.kds-board');
        if (board) board.dispatchEvent(new Event('scroll'));
      }
    }
    function syncUndo() {
      var b = RT.view && RT.view.querySelector('[data-act="undo"]');
      if (b) b.disabled = !RT.hist.length;
    }

    /* ── Выпадающие панели шапки (Figma: Menu setting, Menu header + content) ── */
    function openPop(anchor, cls, html) {
      var wasOpen = RT.pop && RT.pop.anchor === anchor;
      closePop();
      if (wasOpen) return null;
      var menu = document.createElement('div');
      menu.className = 'kds-menu ' + cls + ' is-open';
      menu.innerHTML = html;
      var layer = RT.layer || RT.view;
      layer.appendChild(menu);
      var p = relPos(anchor, layer);
      var w = menu.offsetWidth, h = menu.offsetHeight;
      var left = Math.min(Math.max(8, p.x), Math.max(8, layer.clientWidth - w - 8));
      var top = p.y + anchor.offsetHeight + 8;
      if (top + h > layer.clientHeight - 8) top = Math.max(8, p.y - h - 8);
      menu.style.left = left + 'px';
      menu.style.top = top + 'px';
      RT.pop = { el: menu, anchor: anchor };
      return menu;
    }
    function closePop() {
      if (!RT.view) return;
      Array.prototype.forEach.call(RT.view.querySelectorAll('.kds-menu'), function (m) { m.remove(); });
      Array.prototype.forEach.call(RT.view.querySelectorAll('[data-select].is-open'), function (b) { b.classList.remove('is-open'); });
      RT.pop = null;
    }
    /* меню показателей: «Показатели за 15 минут» (10106:75132) */
    function openMetrics(anchor) {
      var c = displayCounts();
      function row(k, ico, color, label) {
        return '<button class="kds-menu__item" type="button" data-mrow="' + k + '" data-label="' + label + '">' +
          '<span class="kds-menu__ico" style="color:' + color + '">' + ico + '</span><span>' + label + ' ' + c[k] + '</span></button>';
      }
      var html = '<div class="kds-menu__title"><span class="material-icons">bar_chart</span>Показатели за 15 минут</div>' +
        '<div class="kds-menu__div"></div>' +
        row('run', svgIco('clock_loader_40'), '#448aff', 'В работе') +
        row('over', '<span class="material-icons">info</span>', '#ff5252', 'Просрочено') +
        row('done', '<span class="material-icons">check_circle</span>', '#14b456', 'Вовремя') +
        row('avg', '<span class="material-icons">hourglass_empty</span>', '#9e9e9e', 'Ср. время');
      openPop(anchor, 'kds-menu--metrics', html);
    }
    /* панель «Настройки»: шапка с заголовком и ×, «Тема», «Масштаб» */
    function openSettings(anchor) {
      var html = '<div class="kds-set__head"><span class="kds-set__title">Настройки</span>' +
          '<button class="kds-iconbtn" type="button" data-act="close-pop"><span class="material-icons">close</span></button></div>' +
        '<div class="kds-set__body">' +
          '<div class="kds-set__row"><span class="kds-set__label">Тема</span>' +
            '<div class="kds-toggle">' +
              '<button class="kds-toggle__i' + (RT.opts.theme === 'light' ? ' is-on' : '') + '" type="button" data-act="theme-light"><span class="material-icons">light_mode</span></button>' +
              '<button class="kds-toggle__i' + (RT.opts.theme === 'dark' ? ' is-on' : '') + '" type="button" data-act="theme-dark"><span class="material-icons">dark_mode</span></button>' +
            '</div></div>' +
          '<div class="kds-set__row"><span class="kds-set__label">Масштаб</span>' +
            '<div class="kds-scale">' +
              '<button class="kds-scale__btn kds-scale__btn--reset" type="button" data-act="zoom-reset"><span class="material-icons">refresh</span></button>' +
              '<button class="kds-scale__btn" type="button" data-act="zoom-out"><span class="material-icons">remove</span></button>' +
              '<span class="kds-scale__val" data-zoomval>' + Math.round(RT.opts.zoom * 100) + '%</span>' +
              '<button class="kds-scale__btn" type="button" data-act="zoom-in"><span class="material-icons">add</span></button>' +
            '</div></div>' +
        '</div>';
      openPop(anchor, 'kds-menu--settings', html);
    }
    /* списки терминала и ресторана — тот же контейнер меню */
    function openSelect(btn) {
      var kind = btn.getAttribute('data-select');
      var items = kind === 'term' ? TERMS : RESTS;
      var cur = SEL[kind];
      var ico = kind === 'term' ? 'desktop_windows' : 'person';
      var html = items.map(function (label, i) {
        return '<button class="kds-menu__item' + (i === cur ? ' is-sel' : '') + '" type="button" data-pick="' + i + '">' +
          '<span class="kds-menu__ico material-icons">' + (i === cur ? 'check' : ico) + '</span>' + esc(label) + '</button>';
      }).join('');
      var menu = openPop(btn, '', html);
      if (!menu) return;
      menu.addEventListener('click', function (ev) {
        var b = ev.target.closest('[data-pick]');
        if (!b) return;
        var i = +b.getAttribute('data-pick');
        SEL[kind] = i;
        var val = btn.querySelector('[data-val]');
        if (val) val.textContent = items[i];
        closePop();
      });
    }

    /* ── Тема и масштаб (панель «Настройки» из Figma) ── */
    function setTheme(t) {
      RT.opts.theme = t;
      applyTheme();
      var l = RT.view.querySelector('[data-act="theme-light"]');
      var d = RT.view.querySelector('[data-act="theme-dark"]');
      if (l) l.classList.toggle('is-on', t === 'light');
      if (d) d.classList.toggle('is-on', t === 'dark');
    }
    function applyTheme() {
      if (RT.view) RT.view.classList.toggle('kds-view--light', RT.opts.theme === 'light');
    }
    function setZoom(z) {
      RT.opts.zoom = Math.min(1.5, Math.max(0.6, Math.round(z * 100) / 100));
      applyZoom();
    }
    function applyZoom() {
      if (!RT.view) return;
      var z = RT.opts.zoom;
      if (RT.layer) {
        RT.layer.style.transform = 'scale(' + z + ')';
        RT.layer.style.width = (100 / z) + '%';
        RT.layer.style.height = (100 / z) + '%';
      }
      var v = RT.view.querySelector('[data-zoomval]');
      if (v) v.textContent = Math.round(z * 100) + '%';
    }
    /* питание — состояние смены, которое показывает футер («Включен»/«Выключен») */
    function toggleShift() {
      RT.shift = !RT.shift;
      if (!RT.view) return;
      var st = RT.view.querySelector('.kds-footer__status');
      if (st) st.innerHTML = '<span class="kds-dot"></span>' + (RT.shift ? 'Включен' : 'Выключен');
      var dot = st && st.querySelector('.kds-dot');
      if (dot) dot.style.background = RT.shift ? '' : 'var(--kds-ic-neutral)';
      var area = RT.view.querySelector('.kds-board, .kds-dlist, .kds-posters');
      if (area) area.style.opacity = RT.shift ? '' : '.45';
    }
    function doAct(a) {
      if (a === 'power') toggleShift();
      else if (a === 'undo') undo();
      else if (a === 'close-pop') closePop();
      else if (a === 'theme-light') setTheme('light');
      else if (a === 'theme-dark') setTheme('dark');
      else if (a === 'zoom-in') setZoom(RT.opts.zoom + 0.1);
      else if (a === 'zoom-out') setZoom(RT.opts.zoom - 0.1);
      else if (a === 'zoom-reset') setZoom(1);
    }

    /* ── Живые таймеры карточек и часы в шапке ── */
    function startTicker() {
      clearInterval(RT.tickId);
      RT.tickId = setInterval(function () {
        if (!RT.view || document.hidden) return;
        var clock = RT.view.querySelector('[data-clock]');
        if (clock) clock.textContent = nowHHMM();
        var list = RT.cfg && RT.cfg.orders;
        if (!list || !RT.shift) return;
        var moved = false;
        list.forEach(function (o) {
          if (o._secs == null || o._hidden || o.st === 'ready' || o.st === 'cancelled') return;
          o._secs -= 1; moved = true;
          var art = RT.view.querySelector('[data-cid="' + o._cid + '"]');
          if (art) {
            var t = art.querySelector('.kds-card__timer');
            if (t) t.textContent = fmtTimer(o._secs);
            /* просрочка — это только красный таймер и подсветка полосы, статус задачи не меняется
               (в макете карточка «Готовится» спокойно живёт с отрицательным таймером) */
            var head = art.querySelector('.kds-card__head');
            if (head && o._secs < 0) head.style.setProperty('--st-timer', '#ff5252');
          }
        });
        if (moved) applyCounts();
      }, 1000);
    }

    /* ── Ползунок полосы скролла: тянется мышью и пальцем ── */
    function bindThumb(view) {
      var board = view.querySelector('.kds-board');
      var thumb = view.querySelector('.kds-scrollstrip__thumb');
      if (!board || !thumb) return;
      var dragging = false, startX = 0, startL = 0, k = 1;
      thumb.addEventListener('pointerdown', function (e) {
        dragging = true; startX = e.clientX; startL = board.scrollLeft;
        k = view.getBoundingClientRect().width / view.offsetWidth || 1;
        try { thumb.setPointerCapture(e.pointerId); } catch (err) {}
        e.preventDefault(); e.stopPropagation();
      });
      thumb.addEventListener('pointermove', function (e) {
        if (!dragging) return;
        var cw = board.clientWidth, sw = board.scrollWidth;
        var max = Math.max(1, (cw - 4) - thumb.offsetWidth);
        board.scrollLeft = startL + ((e.clientX - startX) / k / max) * (sw - cw);
        e.stopPropagation();
      });
      function end() { dragging = false; }
      thumb.addEventListener('pointerup', end);
      thumb.addEventListener('pointercancel', end);
    }

    /* ── Один делегированный обработчик на весь экран ── */
    function bindInteractive(view) {
      if (!view) return;
      view.addEventListener('click', function (e) {
        var t = e.target;
        if (!t || !t.closest) return;
        var pop = t.closest('[data-pop]');
        if (pop) {
          e.stopPropagation();
          if (pop.getAttribute('data-pop') === 'metrics') openMetrics(pop); else openSettings(pop);
          return;
        }
        var flt = t.closest('[data-filter]');
        if (flt) { e.stopPropagation(); toggleFilter(flt.getAttribute('data-filter')); return; }
        var sel = t.closest('[data-select]');
        if (sel) { e.stopPropagation(); openSelect(sel); return; }
        var act = t.closest('[data-act]');
        if (act) { e.stopPropagation(); doAct(act.getAttribute('data-act')); return; }
        var stub = t.closest('[data-ord]');
        if (stub) { e.stopPropagation(); listOrderAction(stub.getAttribute('data-ord')); return; }
        var row = t.closest('[data-rid]');
        if (row) {
          /* статус меняет только кнопка строки (52×52), а не вся строка:
             нажатие на название раскрывает полное название, а не меняет статус */
          if (t.closest('.kds-btn, .kds-kit__btn, .kds-dl-btn')) { rowAction(row.getAttribute('data-rid')); return; }
          closePop();
          return;
        }
        var course = t.closest('[data-course]');
        if (course) { courseAction(course.getAttribute('data-cid'), +course.getAttribute('data-course')); return; }
        var cardEl = t.closest('.kds-card[data-cid]');
        if (cardEl && t.closest('.kds-card__head')) {
          orderAction(cardEl.getAttribute('data-cid'));
          return;
        }
        closePop();
      });
      view.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') closePop();
      });
      bindThumb(view);
    }

    /* ── Переключение экранов — только из панели ревью (ds-review.js) ── */
    window.DSReviewState = render;
    document.addEventListener('dsreview:state', function (e) { render(e.detail && e.detail.id || 'base'); });

    var initial = 'base';
    try { initial = new URL(location.href).searchParams.get('state') || 'base'; } catch (err) {}
    render(SCREENS[initial] ? initial : 'base');
    window.addEventListener('load', fitScale);
    window.addEventListener('resize', fitScale);
    setTimeout(fitScale, 600);
  })();
  </script>
</body>
