          if (it.k === 'transfer' || it.k === 'course') return;
          if (!it.st) it.st = 'waiting';
          A(it, 'dish', o._cid);
        });
      });
      (cfg.rows || []).forEach(function (rw) {
        var d = rw.dish || rw;
        if (!d.st) d.st = 'waiting';
        A(d, 'lrow', 'dl');
      });
    }

    /* ── Действия со строками (вики: Готовится → Приготовлено → строка исчезает) ── */
    function pushHist(e) {
      RT.hist.push(e);
      while (RT.hist.length > HIST_MAX) RT.hist.shift();
    }
    function rowEl(rid) { return RT.view.querySelector('[data-rid="' + rid + '"]'); }
    function cardEl(cid) { return RT.view.querySelector('[data-cid="' + cid + '"]'); }
    function rowAction(rid) {
      var m = RT.M[rid];
      if (!m || !RT.shift) return;                 // смена выключена — действия недоступны
      if (m.kind === 'combo' || m.kind === 'mgroup' || m.kind === 'set') { setAction(rid); return; }
      if (m.o.st === 'done') return;               // блюдо уже сброшено с экрана
      var next = CYCLE[m.o.st] || 'cooking';
      pushHist({ type: 'row', rid: rid, prev: m.o.st });
      applyRow(rid, next);
    }
    /* Кнопка набора = bump всего набора (компоненты переходят вместе) */
    function setAction(rid) {
      var m = RT.M[rid];
      if (!m || !RT.shift || m.o.st === 'done') return;
      var kids = (m.o.rows || []).filter(function (rw) { return rw._rid && RT.M[rw._rid] && RT.M[rw._rid].o.st !== 'done'; });
      var next = CYCLE[m.o.st] || 'cooking';
      pushHist({ type: 'set', rid: rid, prev: m.o.st, rows: kids.map(function (rw) { return { rid: rw._rid, prev: rw.st }; }) });
      kids.forEach(function (rw) { rw.st = CYCLE[rw.st] || 'cooking'; });
      applySet(rid, next);
    }
    /* Отрисовка состояния набора: цвет шапки/компонентов и иконка единственной кнопки */
    function applySet(rid, st) {
      var m = RT.M[rid];
      if (!m) return;
      m.o.st = st;
      var el = rowEl(rid);
      if (!el) return;
      if (st === 'done') { el.style.display = 'none'; applyCounts(); syncUndo(); return; }
      el.style.display = '';
      var neg = st === 'cancelled';
      el.classList.toggle('kds-kit--neg', neg);
      ['waiting', 'urgent', 'cooking', 'ready', 'cancelled', 'done'].forEach(function (s) { el.classList.toggle('kds-kit--' + s, st === s); });
      el.querySelectorAll('.kds-kit__comp').forEach(function (c) { c.classList.toggle('kds-kit__comp--neg', neg); });
      var btn = el.querySelector('.kds-kit__btn');
      if (btn) {
        btn.className = 'kds-kit__btn kds-kit__btn--' + st;
        btn.innerHTML = '<span class="material-icons">' + icoFor(st, 'mgroup') + '</span>';
      }
      applyCounts(); syncUndo();
    }
    /* Шапка карточки = bump заказа (PB-7765): действие с полноширинной кнопки перенесено в шапку.
       В WebKDS статус заказа живёт отдельно от блюд, но bumpOrder прогоняет и блюда — область «весь заказ» (DS-534).
       Цикл как у блюд: серая → жёлтая → синяя → зелёная, красная — ошибка/отмена. */
    var ORDER_CYCLE = { waiting: 'urgent', urgent: 'cooking', cooking: 'ready', ready: 'done', cancelled: 'done' };
    function orderAction(cid) {
      var o = RT.cfg.orders[+cid.slice(1)];
      if (!o || !RT.shift || o._hidden) return;
      var items = cardRows(o);
      if (!items.length) return;
      var next = ORDER_CYCLE[o.st] || 'cooking';
      pushHist({ type: 'card', cid: cid, prev: o.st, rows: items.map(function (m) { return { rid: m.o._rid, prev: m.o.st }; }) });
      items.forEach(function (m) { if (m.o.st !== 'done') bumpRow(m.o._rid); });
      if (next === 'done') { hideCard(cid); return; }
      o.st = next;
      paintCard(cid);
      sortBoard();
      applyCounts(); syncUndo();
    }
    /* клик по курсу = bumpCourse: тот же переход, но в пределах курса (DS-534) */
    function courseAction(cid, idx) {
      var o = RT.cfg.orders[+cid.slice(1)];
      if (!o || !RT.shift || o._hidden) return;
      var items = courseRows(o, idx);
      if (!items.length) return;
      pushHist({ type: 'card', cid: cid, prev: o.st, rows: items.map(function (m) { return { rid: m.o._rid, prev: m.o.st }; }) });
      items.forEach(function (m) { if (m.o.st !== 'done') bumpRow(m.o._rid); });
      applyCounts(); syncUndo();
    }
    function bumpRow(rid) {
      var m = RT.M[rid];
      if (!m) return;
      applyRow(rid, CYCLE[m.o.st] || 'cooking');
    }
    function courseRows(o, idx) {
      var out = [], on = false;
      (o.items || []).forEach(function (it, i) {
        if (it.k === 'course') { on = (i === idx); return; }
        if (!on) return;
        if (it.k === 'combo' || it.k === 'nest' || it.k === 'cset') {
          (it.rows || []).forEach(function (rw) { if (RT.M[rw._rid]) out.push(RT.M[rw._rid]); });
        } else if (RT.M[it._rid] && it.k !== 'transfer') out.push(RT.M[it._rid]);
      });
      return out;
    }
    /* строки карточки без служебных заголовков набора */
    function cardRows(o) {
      var out = [];
      (o.items || []).forEach(function (it) {
        if (it.k === 'combo' || it.k === 'nest' || it.k === 'cset') {
          (it.rows || []).forEach(function (rw) { if (RT.M[rw._rid]) out.push(RT.M[rw._rid]); });
        } else if (RT.M[it._rid] && it.k !== 'transfer' && it.k !== 'course') out.push(RT.M[it._rid]);
      });
      return out;
    }
    function applyRow(rid, st) {
      var m = RT.M[rid];
      if (!m) return;
      m.o.st = st;
      var el = rowEl(rid);
      if (el) {
        if (st === 'done') {
          el.style.display = 'none';                 // блюдо сброшено с экрана
        } else {
          el.style.display = '';
          var isGroup = m.kind === 'mgroup' || m.kind === 'combo' || m.kind === 'set';
          var isLrow = m.kind === 'lrow';
          el.classList.toggle('kds-row--neg', !isGroup && !isLrow && st === 'cancelled');
          el.classList.toggle('kds-kit--neg', isGroup && st === 'cancelled');
          el.querySelectorAll('.kds-kit__comp').forEach(function (c) { c.classList.toggle('kds-kit__comp--neg', isGroup && st === 'cancelled'); });
          var nm = el.querySelector('.kds-dl-name');
          if (nm) nm.classList.toggle('is-neg', st === 'cancelled');
          ['waiting', 'urgent', 'cooking', 'ready', 'cancelled', 'done'].forEach(function (s) {
            el.classList.toggle('kds-row--' + s, !isGroup && !isLrow && st === s);
            el.classList.toggle('kds-kit--' + s, isGroup && st === s);
          });
          var btn = el.querySelector('.kds-btn, .kds-kit__btn, .kds-dl-btn');
          if (btn) {
            var base = isGroup ? 'kds-kit__btn kds-kit__btn--'
              : isLrow ? 'kds-dl-btn kds-btn--'
              : 'kds-btn kds-btn--';
            btn.className = base + st;
            btn.innerHTML = '<span class="material-icons">' + icoFor(st, isGroup ? 'mgroup' : m.kind) + '</span>';
          } else {
            /* экран сборщика: кнопки нет — обновляем иконку статуса */
            var icoEl = el.querySelector('.kds-row__ico');
            if (icoEl) {
              icoEl.className = 'kds-row__ico kds-btn--' + st;
              var gl = icoEl.querySelector('.material-icons');
              if (gl) gl.textContent = icoFor(st, 'asm');
            }
          }
        }
      }
      if (m.cid !== 'dl') autoHideCard(m.cid);
      applyCounts(); syncUndo();
    }
    /* если все блюда заказа сброшены — карточка уходит с экрана (вики, шаг 3а);
       статус самого заказа при этом не пересчитывается — он живёт отдельно */
    function autoHideCard(cid) {
      var o = RT.cfg.orders[+cid.slice(1)];
      if (!o || o._hidden) return;
      var rows = cardRows(o);
      if (rows.length && rows.every(function (m) { return m.o.st === 'done'; })) hideCard(cid);
    }
    function hideCard(cid) {
      var o = RT.cfg.orders[+cid.slice(1)];
      var a = cardEl(cid);
      if (o) o._hidden = true;
      if (a) a.style.display = 'none';
      applyCounts(); syncUndo();
    }
    function showCard(cid) {
      var o = RT.cfg.orders[+cid.slice(1)];
      var a = cardEl(cid);
      if (o) o._hidden = false;
      if (a) a.style.display = '';
    }
    function undo() {
      var h = RT.hist.pop();
      if (!h) return;
      if (h.type === 'row') {
        applyRow(h.rid, h.prev);
        var m = RT.M[h.rid];
        if (m && m.cid !== 'dl') showCard(m.cid);
      } else if (h.type === 'card') {
        if (h.rows) h.rows.forEach(function (r) { applyRow(r.rid, r.prev); });
        var o = RT.cfg.orders[+h.cid.slice(1)];
        if (o) { o.st = h.prev; paintCard(h.cid); }
        showCard(h.cid);
        sortBoard();
      } else if (h.type === 'rows') {
        h.rows.forEach(function (r) { applyRow(r.rid, r.prev); });
      } else if (h.type === 'set') {
        h.rows.forEach(function (r) { var km = RT.M[r.rid]; if (km) km.o.st = r.prev; });
        applySet(h.rid, h.prev);
      }
      applyCounts(); syncUndo();
    }
    /* в режиме «по блюдам» шапка-плашка = bump всего заказа (bumpOrder) */
    function listOrderAction(ord) {
      if (!RT.shift) return;
      var live = [];
      (RT.cfg.rows || []).forEach(function (rw) {
        var d = rw.dish || rw;
        if (rw.ord !== ord) return;
        var m = RT.M[d._rid];
        if (m && m.o.st !== 'done') live.push(m);
      });
      if (!live.length) return;
      pushHist({ type: 'rows', rows: live.map(function (m) { return { rid: m.o._rid, prev: m.o.st }; }) });
      live.forEach(function (m) { applyRow(m.o._rid, CYCLE[m.o.st] || 'cooking'); });
      applyCounts(); syncUndo();
    }
    function paintCard(cid) {
      var o = RT.cfg.orders[+cid.slice(1)];
      if (!o) return;
      var art = RT.view.querySelector('[data-cid="' + cid + '"]');
      if (!art) return;
      var s = ST[o.st] || ST.waiting;
      var head = art.querySelector('.kds-card__head');
      if (head) {
        head.style.setProperty('--st-band', s.band);
        head.style.setProperty('--st-tint', s.tint);
        head.style.setProperty('--st-num', s.num);
        head.style.setProperty('--st-timer', (o._secs != null && o._secs < 0) ? '#ff5252' : s.timer);
      }
      art.setAttribute('data-st', o.st);
      art.classList.toggle('kds-card--cancelled', o.st === 'cancelled');
      art.classList.toggle('kds-card--wico', o.st === 'ready' || o.st === 'cancelled');
    }

    /* ── Счётчики шапки (Figma «Menu setting») и отмена последнего действия ──
         Корзины — по цветам шапки (правило заказчика 22.10):
           синяя «В работе» — блюдо «Готовится» (cooking);
           красная «Просрочено» — время карточки истекло, задача ещё не готова (urgent/cooking);
           зелёная «Готово» — «Приготовлено» (ready).
         Ожидание, «Пора готовить» без просрочки, отменённое и сброшенное — не считаем. ── */
    function inBucket(k, st, overdue) {
      if (!st || st === 'cancelled' || st === 'done' || st === 'waiting') return false;
      if (k === 'done') return st === 'ready';
      if (k === 'run') return st === 'cooking';
      /* просрочено — только то, что уже в работе: время вышло у «Готовится» */
      if (k === 'over') return !!overdue && st === 'cooking';
      return false;
    }
    function countsNow() {
      var run = 0, over = 0, done = 0;
      function add(st, overdue) {
        if (inBucket('run', st, overdue)) run++;
        if (inBucket('over', st, overdue)) over++;
        if (inBucket('done', st, overdue)) done++;
      }
      ((RT.cfg && RT.cfg.orders) || []).forEach(function (o) {
        if (o._hidden) return;
        var overdue = !!(o.timerNeg || (o._secs != null && o._secs < 0));
        cardRows(o).forEach(function (m) { add(m.o.st, overdue); });
      });
      ((RT.cfg && RT.cfg.rows) || []).forEach(function (rw) {
        var d = rw.dish || rw;
        add(d.st || 'waiting', !!rw.timerNeg);
      });
      return { run: run, over: over, done: done };
    }
    /* на экране 6 карточек, а в макете 12/2/8 — храним дельту, чтобы стартовые
       цифры совпадали с Figma, а дальше реагировали на нажатия */
    function displayCounts() {
      var c = countsNow();
      /* цифры в шапке — реальные количества блюд (без подмешивания Figma-значений) */
      return { run: c.run, over: c.over, done: c.done, avg: CNT_BASE.avg };
    }
    function applyCounts() {
      if (!RT.view) return;
      var c = displayCounts();
      ['run', 'over', 'done', 'avg'].forEach(function (k) {
        var el = RT.view.querySelector('[data-cnt="' + k + '"]');
        if (el) el.textContent = c[k];
      });
      var menu = RT.view.querySelector('.kds-menu--metrics');
      if (menu) {
        var rows = menu.querySelectorAll('[data-mrow]');
        Array.prototype.forEach.call(rows, function (r) {
          var k = r.getAttribute('data-mrow');
          r.lastChild.textContent = r.getAttribute('data-label') + ' ' + c[k];
        });
      }
      applyFilter();
    }
    /* ── Счётчики-фильтры: «В работе» / «Просрочено» / «Вовремя» ── */
    function toggleFilter(k) {
      RT.filter = RT.filter === k ? null : k;
      applyFilter();
      /* фильтр применяется к ленте с её начала — иначе скрытые карточки за экраном
         и кажется, что фильтр ничего не сделал */
      var board = RT.view && RT.view.querySelector('.kds-board');
      if (board) board.scrollLeft = 0;
    }
    function matchFilter(st, overdue) {
      if (!RT.filter) return true;
      return inBucket(RT.filter, st, overdue);
    }
    function applyFilter() {
      if (!RT.view || !RT.cfg) return;
      var changed = false;
      /* Фильтр — по ЗАДАЧАМ (блюдам), как счётчики шапки: неподходящие блюда скрываются
         внутри карточек, карточка без единого видимого блюда прячется целиком */
      (RT.cfg.orders || []).forEach(function (o) {
        var art = cardEl(o._cid);
        if (!art) return;
        var overdue = !!(o.timerNeg || (o._secs != null && o._secs < 0));
        var any = false;
        Array.prototype.forEach.call(art.querySelectorAll('[data-rid]'), function (el) {
          var m = RT.M[el.getAttribute('data-rid')];
          if (!m) return;
          /* контейнер группы не блюдо: его видимость решается по его блюдам (ниже) */
          if ((el.classList.contains('kds-kit') || el.classList.contains('kds-cset')) && el.querySelector('[data-rid]')) return;
          var st = m.o.st || 'waiting';
          var hide = (st === 'done') || !matchFilter(st, overdue);
          var want = hide ? 'none' : '';
          if (el.style.display !== want) { el.style.display = want; changed = true; }
          if (!hide) any = true;
        });
        /* контейнер группы виден, только если внутри есть видимое блюдо */
        Array.prototype.forEach.call(art.querySelectorAll('.kds-kit[data-rid], .kds-cset[data-rid]'), function (box) {
          var kids = box.querySelectorAll('[data-rid]');
          if (!kids.length) return;
          var alive = Array.prototype.some.call(kids, function (k) { return k.style.display !== 'none'; });
          var wantBox = alive ? '' : 'none';
          if (box.style.display !== wantBox) { box.style.display = wantBox; changed = true; }
        });
        /* подпись видимости — по видимым строкам ЭТОГО блока на карточке */
        Array.prototype.forEach.call(art.querySelectorAll('[data-seen]'), function (cap) {
          if (cap.hasAttribute('data-seen-static')) return;   /* подпись задана в данных — не пересчитываем */
          var m = +cap.getAttribute('data-seen-m') || 0;
          var n = 0;
          var box = cap.closest('.kds-cset, .kds-kit');
          if (box) Array.prototype.forEach.call(box.querySelectorAll('.kds-row, .kds-kit__comp'), function (r) {
            if (r.style.display === 'none') return;
            if (r.classList.contains('kds-row--mod')) return;       /* модификатор — не блюдо набора */
            if (r.closest('.kds-cset__submod')) return;  /* вложенный мод — не блюдо набора */
            if (r.classList.contains('kds-row--cancelled') || r.classList.contains('kds-kit__comp--cancelled')) return;  /* отменённое не считаем */
            n++;
          });
          var l1 = cap.querySelector('[data-seen-l1]');
          if (l1) l1.textContent = n + ' из ' + m + ' блюд';
          cap.title = 'на экране ' + n + ' из ' + m + ' блюд набора';
          var wantCap = n > 0 && n < m ? '' : 'none';
          if (cap.style.display !== wantCap) { cap.style.display = wantCap; changed = true; }
        });
        var want = (o._hidden || (!!RT.filter && !any)) ? 'none' : '';
        if (art.style.display !== want) { art.style.display = want; changed = true; }
      });
      (RT.cfg.rows || []).forEach(function (rw) {
        var d = rw.dish || rw;
        if (!d._rid) return;
        var el = rowEl(d._rid);
        if (!el) return;
        var want = (d.st === 'done' || !matchFilter(d.st || 'waiting', !!rw.timerNeg)) ? 'none' : '';   // сброшенное блюдо не возвращаем фильтром
        if (el.style.display !== want) { el.style.display = want; changed = true; }
      });
      Array.prototype.forEach.call(RT.view.querySelectorAll('[data-filter]'), function (b) {
        b.classList.toggle('is-sel', RT.filter === b.getAttribute('data-filter'));
      });
      if (changed) {
        var board = RT.view.querySelector('.kds-board');
        if (board) board.dispatchEvent(new Event('scroll'));
      }
    }
    function syncUndo() {
      var b = RT.view && RT.view.querySelector('[data-act="undo"]');
      if (b) b.disabled = !RT.hist.length;
    }

    /* ── Выпадающие панели шапки (Figma: Menu setting, Menu header + content) ── */
    function openPop(anchor, cls, html) {
      var wasOpen = RT.pop && RT.pop.anchor === anchor;
      closePop();
      if (wasOpen) return null;
      var menu = document.createElement('div');
      menu.className = 'kds-menu ' + cls + ' is-open';
      menu.innerHTML = html;
      var layer = RT.layer || RT.view;
      layer.appendChild(menu);
      var p = relPos(anchor, layer);
      var w = menu.offsetWidth, h = menu.offsetHeight;
      var left = Math.min(Math.max(8, p.x), Math.max(8, layer.clientWidth - w - 8));
      var top = p.y + anchor.offsetHeight + 8;
      if (top + h > layer.clientHeight - 8) top = Math.max(8, p.y - h - 8);
      menu.style.left = left + 'px';
      menu.style.top = top + 'px';
      RT.pop = { el: menu, anchor: anchor };
      return menu;
    }
    function closePop() {
      if (!RT.view) return;
      Array.prototype.forEach.call(RT.view.querySelectorAll('.kds-menu:not(.kds-sconfirm)'), function (m) { m.remove(); });
      Array.prototype.forEach.call(RT.view.querySelectorAll('[data-select].is-open'), function (b) { b.classList.remove('is-open'); });
      RT.pop = null;
    }
    /* меню показателей: «Показатели за 15 минут» (10106:75132) */
    function openMetrics(anchor) {
      var c = displayCounts();
      function row(k, ico, color, label) {
        return '<button class="kds-menu__item" type="button" data-mrow="' + k + '" data-label="' + label + '">' +
          '<span class="kds-menu__ico" style="color:' + color + '">' + ico + '</span><span>' + label + ' ' + c[k] + '</span></button>';
      }
      var html = '<div class="kds-menu__title"><span class="material-icons">bar_chart</span>Показатели за 15 минут</div>' +
        '<div class="kds-menu__div"></div>' +
        row('run', svgIco('clock_loader_40'), '#448aff', 'В работе') +
        row('over', '<span class="material-icons">info</span>', '#ff5252', 'Просрочено') +
        row('done', '<span class="material-icons">check_circle</span>', '#14b456', 'Вовремя') +
        row('avg', '<span class="material-icons">hourglass_empty</span>', '#9e9e9e', 'Ср. время');
      openPop(anchor, 'kds-menu--metrics', html);
    }
    /* панель «Настройки»: шапка с заголовком и ×, «Тема», «Масштаб» */
    function openSettings(anchor) {
      var html = '<div class="kds-set__head"><span class="kds-set__title">Настройки</span>' +
          '<button class="kds-iconbtn" type="button" data-act="close-pop"><span class="material-icons">close</span></button></div>' +
        '<div class="kds-set__body">' +
          '<div class="kds-set__row"><span class="kds-set__label">Тема</span>' +
            '<div class="kds-toggle">' +
              '<button class="kds-toggle__i' + (RT.opts.theme === 'light' ? ' is-on' : '') + '" type="button" data-act="theme-light"><span class="material-icons">light_mode</span></button>' +
              '<button class="kds-toggle__i' + (RT.opts.theme === 'dark' ? ' is-on' : '') + '" type="button" data-act="theme-dark"><span class="material-icons">dark_mode</span></button>' +
            '</div></div>' +
          '<div class="kds-set__row"><span class="kds-set__label">Масштаб</span>' +
            '<div class="kds-scale">' +
              '<button class="kds-scale__btn kds-scale__btn--reset" type="button" data-act="zoom-reset"><span class="material-icons">refresh</span></button>' +
              '<button class="kds-scale__btn" type="button" data-act="zoom-out"><span class="material-icons">remove</span></button>' +
              '<span class="kds-scale__val" data-zoomval>' + Math.round(RT.opts.zoom * 100) + '%</span>' +
              '<button class="kds-scale__btn" type="button" data-act="zoom-in"><span class="material-icons">add</span></button>' +
            '</div></div>' +
        '</div>';
      openPop(anchor, 'kds-menu--settings', html);
    }
    /* списки терминала и ресторана — тот же контейнер меню */
    function openSelect(btn) {
      var kind = btn.getAttribute('data-select');
      var items = kind === 'term' ? TERMS : RESTS;
      var cur = SEL[kind];
      var ico = kind === 'term' ? 'desktop_windows' : 'person';
      var html = items.map(function (label, i) {
        return '<button class="kds-menu__item' + (i === cur ? ' is-sel' : '') + '" type="button" data-pick="' + i + '">' +
          '<span class="kds-menu__ico material-icons">' + (i === cur ? 'check' : ico) + '</span>' + esc(label) + '</button>';
      }).join('');
      var menu = openPop(btn, '', html);
      if (!menu) return;
      menu.addEventListener('click', function (ev) {
        var b = ev.target.closest('[data-pick]');
        if (!b) return;
        var i = +b.getAttribute('data-pick');
        SEL[kind] = i;
        var val = btn.querySelector('[data-val]');
        if (val) val.textContent = items[i];
        closePop();
      });
    }

    /* ── Тема и масштаб (панель «Настройки» из Figma) ── */
    function setTheme(t) {
      RT.opts.theme = t;
      applyTheme();
      var l = RT.view.querySelector('[data-act="theme-light"]');
      var d = RT.view.querySelector('[data-act="theme-dark"]');
      if (l) l.classList.toggle('is-on', t === 'light');
      if (d) d.classList.toggle('is-on', t === 'dark');
    }
    function applyTheme() {
      if (RT.view) RT.view.classList.toggle('kds-view--light', RT.opts.theme === 'light');
    }
    function setZoom(z) {
      RT.opts.zoom = Math.min(1.5, Math.max(0.6, Math.round(z * 100) / 100));
      applyZoom();
    }
    function applyZoom() {
      if (!RT.view) return;
      var z = RT.opts.zoom;
      if (RT.layer) {
        RT.layer.style.transform = 'scale(' + z + ')';
        RT.layer.style.width = (100 / z) + '%';
        RT.layer.style.height = (100 / z) + '%';
      }
      var v = RT.view.querySelector('[data-zoomval]');
      if (v) v.textContent = Math.round(z * 100) + '%';
    }
    /* питание — состояние смены, которое показывает футер («Включен»/«Выключен») */
    function toggleShift() {
      RT.shift = !RT.shift;
      if (!RT.view) return;
      var st = RT.view.querySelector('.kds-footer__status');
      if (st) st.innerHTML = '<span class="kds-dot"></span>' + (RT.shift ? 'Включен' : 'Выключен');
      var dot = st && st.querySelector('.kds-dot');
      if (dot) dot.style.background = RT.shift ? '' : 'var(--kds-ic-neutral)';
      var area = RT.view.querySelector('.kds-board, .kds-dlist, .kds-posters, .kds-slist');
      if (area) area.style.opacity = RT.shift ? '' : '.45';
    }
    function doAct(a) {
      if (a === 'power') toggleShift();
      else if (a === 'undo') undo();
      else if (a === 'close-pop') closePop();
      else if (a === 'theme-light') setTheme('light');
      else if (a === 'theme-dark') setTheme('dark');
      else if (a === 'zoom-in') setZoom(RT.opts.zoom + 0.1);
      else if (a === 'zoom-out') setZoom(RT.opts.zoom - 0.1);
      else if (a === 'zoom-reset') setZoom(1);
    }

    /* ── Живые таймеры карточек и часы в шапке ── */
    function startTicker() {
      clearInterval(RT.tickId);
      RT.tickId = setInterval(function () {
        if (!RT.view || document.hidden) return;
        var clock = RT.view.querySelector('[data-clock]');
        if (clock) clock.textContent = nowHHMM();
        var list = RT.cfg && RT.cfg.orders;
        if (!list || !RT.shift) return;
        var moved = false;
        list.forEach(function (o) {
          if (o._secs == null || o._hidden || o.st === 'ready' || o.st === 'cancelled') return;
          o._secs -= 1; moved = true;
          var art = RT.view.querySelector('[data-cid="' + o._cid + '"]');
          if (art) {
            var t = art.querySelector('.kds-card__timer');
            if (t) t.textContent = fmtTimer(o._secs);
            /* просрочка — это только красный таймер и подсветка полосы, статус задачи не меняется
               (в макете карточка «Готовится» спокойно живёт с отрицательным таймером) */
            var head = art.querySelector('.kds-card__head');
            if (head && o._secs < 0) head.style.setProperty('--st-timer', '#ff5252');
          }
        });
        if (moved) applyCounts();
      }, 1000);
    }

    /* ── Ползунок полосы скролла: тянется мышью и пальцем ── */
    function bindThumb(view) {
      var board = view.querySelector('.kds-board');
      var thumb = view.querySelector('.kds-scrollstrip__thumb');
      if (!board || !thumb) return;
      var dragging = false, startX = 0, startL = 0, k = 1;
      thumb.addEventListener('pointerdown', function (e) {
        dragging = true; startX = e.clientX; startL = board.scrollLeft;
        k = view.getBoundingClientRect().width / view.offsetWidth || 1;
        try { thumb.setPointerCapture(e.pointerId); } catch (err) {}
        e.preventDefault(); e.stopPropagation();
      });
      thumb.addEventListener('pointermove', function (e) {
        if (!dragging) return;
        var cw = board.clientWidth, sw = board.scrollWidth;
        var max = Math.max(1, (cw - 4) - thumb.offsetWidth);
        board.scrollLeft = startL + ((e.clientX - startX) / k / max) * (sw - cw);
        e.stopPropagation();
      });
      function end() { dragging = false; }
      thumb.addEventListener('pointerup', end);
      thumb.addEventListener('pointercancel', end);
    }

    /* ── Один делегированный обработчик на весь экран ── */
    /* ── Один делегированный обработчик на весь экран ── */
    function bindInteractive(view) {
      if (!view) return;
      view.addEventListener('click', function (e) {
        var t = e.target;
        if (!t || !t.closest) return;
        if (RT.sl) {
          var confEl = view.querySelector('[data-sl-confirm]');
          if (confEl && confEl.classList.contains('is-open')) {
            var cfBtn = t.closest('[data-sl-confirm="yes"], [data-sl-confirm="no"]');
            if (cfBtn) { slConfirm(cfBtn.getAttribute('data-sl-confirm')); return; }
            if (!t.closest('[data-sl-confirm]')) closeSlConfirm();
            return;
          }
          var cf = t.closest('[data-sl-confirm]');
          if (cf) { slConfirm(cf.getAttribute('data-sl-confirm')); return; }
          /* Тап мимо открытого попапа — закрыть и НЕ выполнять то, по чему попали */
          if (RT.pop && RT.pop.el && !t.closest('.kds-menu')) { closePop(); return; }
          /* Цифровая панель: клавиши пишут в поле, тап мимо панели и поля — закрыть */
          var kbK = t.closest('[data-sl-kb]');
          if (kbK) { e.preventDefault(); slKbdKey(kbK.getAttribute('data-sl-kb')); return; }
          var padK = t.closest('[data-sl-k]');
          if (padK) { e.preventDefault(); slPadKey(padK.getAttribute('data-sl-k')); return; }
          if (!t.closest('.kds-numpad') && !t.closest('[data-sl-in]')) slPadHide();
          if (!t.closest('[data-sl-kbd]') && !t.closest('.kds-ssearch')) slKbdHide();
          var back = t.closest('[data-sl-back]');
          if (back) { render(back.getAttribute('data-sl-back')); return; }
          var addb = t.closest('[data-sl-add]');
          if (addb) { render('add-fail'); return; }
          /* «+» в строке внесения: сохраняет введённый тут же остаток и добавляет позицию */
          var addAllBtn = t.closest('[data-sl-addfilled]');
          if (addAllBtn) { e.preventDefault(); slAddFilled(); return; }
          var arw = t.closest('[data-sl-addrow]');
          if (arw) {
            var arRow = arw.closest('[data-sl-row]');
            var arInp = arRow && arRow.querySelector('[data-sl-in]');
            if (arInp && !slCommit(arInp)) arInp.focus();
            return;
          }
          /* Кнопки шага у поля: шаг на 1 и сразу сохраняем */
          var stepBtn = t.closest('[data-sl-step]');
          if (stepBtn) {
            e.preventDefault();
            var stepWrap = stepBtn.closest('.kds-srow__val');
            var stepInp = stepWrap && stepWrap.querySelector('[data-sl-in]');
            if (stepInp) slStep(stepInp, +stepBtn.getAttribute('data-sl-step'));
            return;
          }
          /* Сброс значения в поле (Element right у Input ДС) */
          var clrBtn = t.closest('[data-sl-clear]');
          if (clrBtn) {
            e.preventDefault();
            slClearField(clrBtn);
            return;
          }
          /* Свернуть/развернуть размеры позиции */
          var foldBtn = t.closest('[data-sl-fold]');          if (foldBtn) {
            var foldIdx = foldBtn.getAttribute('data-sl-fold');
            var foldOff = foldBtn.classList.toggle('is-collapsed');
            if (RT.sl.folds) RT.sl.folds[foldIdx] = foldOff;
            var foldIco = foldBtn.querySelector('.material-icons');
            if (foldIco) foldIco.textContent = foldOff ? 'chevron_right' : 'expand_more';
            var foldSubs = RT.view.querySelectorAll('.kds-srow--sub[data-sl-row="' + foldIdx + '"]');
            Array.prototype.forEach.call(foldSubs, function (sr) { sr.style.display = foldOff ? 'none' : ''; });
            return;
          }
          var sclr = t.closest('[data-sl-sclear]');          if (sclr) {
            e.preventDefault();
            var sInp = RT.view.querySelector('[data-sl-search]');
            if (sInp) { sInp.value = ''; RT.sl.q = ''; applySlFilter(); syncSlClear(); }
            return;
          }
          var mic = t.closest('[data-sl-mic]');
          if (mic) { e.preventDefault(); slMic(); return; }
          var chk = t.closest('[data-sl-check]');
          if (chk) { toggleSlCheck(+chk.getAttribute('data-sl-check')); return; }
          var sall = t.closest('[data-sl-selall]');
          if (sall) { slSelectAll(); return; }
          var unsel = t.closest('[data-sl-unselect]');
          if (unsel) { RT.sl.checks = {}; refreshSl(); return; }
          var wipe = t.closest('[data-sl-wipe]');
          if (wipe) { openSlConfirm(); return; }
          var ma = t.closest('[data-sl-massact]');
          if (ma) { slMass(ma.getAttribute('data-sl-massact')); return; }
          var pr = t.closest('[data-sl-print]');
          if (pr) { slBanner('Стоп-лист отправлен на печать'); return; }
          var srow = t.closest('[data-sl-row]');
          if (srow) {
            /* тап по полю остатка — это правка числа, а не отметка строки */
            if (t.closest('[data-sl-in]')) return;
            var rowInp = srow.querySelector('[data-sl-in]');
            /* строка размера — сразу в своё поле */
            /* тап по названию размера ничего не делает: панель ввода — только по самому полю */
            if (srow.hasAttribute('data-sl-si')) { return; }
            if (!t.closest('.kds-srow__main')) return;
            /* Исключённая из меню строка не кликабельна (pointer-events: none у блока блюда):
               ни панели, ни баннера — причину показывает красная подпись справа */
            if (t.closest('[data-sl-fail]')) return;
            /* На экране с чекбоксами (множественное внесение) тап по строке = отметка,
               как в стоп-листе; панель ввода — только по самому полю */
            if (RT.sl.addMode) {
              if (RT.cfg.multi) toggleSlCheck(+srow.getAttribute('data-sl-row'));
              else if (rowInp) rowInp.focus();
            }
            else toggleSlCheck(+srow.getAttribute('data-sl-row'));
            return;
          }
          /* тап мимо строки — ничего не делаем */
        }
        var stb = t.closest('[data-stopbtn]');
        /* Вход в стоп-лист с базы открывает пустой стоп-лист (ограничений ещё нет) */
        if (stb) { e.stopPropagation(); render('list-empty'); return; }
        var pop = t.closest('[data-pop]');
        if (pop) {
          e.stopPropagation();
          if (pop.getAttribute('data-pop') === 'metrics') openMetrics(pop); else openSettings(pop);
          return;
        }
        var flt = t.closest('[data-filter]');
        if (flt) { e.stopPropagation(); toggleFilter(flt.getAttribute('data-filter')); return; }
        var sel = t.closest('[data-select]');
        if (sel) { e.stopPropagation(); openSelect(sel); return; }
        var act = t.closest('[data-act]');
        if (act) { e.stopPropagation(); doAct(act.getAttribute('data-act')); return; }
        var stub = t.closest('[data-ord]');
        if (stub) { e.stopPropagation(); listOrderAction(stub.getAttribute('data-ord')); return; }
        var row = t.closest('[data-rid]');
        if (row) {
          /* статус меняет только кнопка строки (52×52), а не вся строка:
             нажатие на название раскрывает полное название, а не меняет статус */
          if (t.closest('.kds-btn, .kds-kit__btn, .kds-dl-btn')) { rowAction(row.getAttribute('data-rid')); return; }
          closePop();
          return;
        }
        var course = t.closest('[data-course]');
        if (course) { courseAction(course.getAttribute('data-cid'), +course.getAttribute('data-course')); return; }
        var cardEl = t.closest('.kds-card[data-cid]');
        if (cardEl && t.closest('.kds-card__head')) {
          orderAction(cardEl.getAttribute('data-cid'));
          return;
        }
        closePop();
      });
      view.addEventListener('keydown', function (e) {
        if (e.key === 'Escape') { closePop(); closeSlConfirm(); }
      });
      if (!RT.escBound) {
        RT.escBound = true;
        document.addEventListener('keydown', function (e) {
          if (e.key === 'Escape') { closePop(); closeSlConfirm(); }
        });
      }
      bindThumb(view);
    }
    /* ── Переключение экранов — только из панели ревью (ds-review.js) ── */
    window.DSReviewState = render;
    document.addEventListener('dsreview:state', function (e) { render(e.detail && e.detail.id || 'base'); });

    var initial = 'base';
    try { initial = new URL(location.href).searchParams.get('state') || 'base'; } catch (err) {}
    render(SCREENS[initial] ? initial : 'base');
    window.addEventListener('load', fitScale);
    window.addEventListener('resize', fitScale);
    setTimeout(fitScale, 600);
  })();
  </script>
